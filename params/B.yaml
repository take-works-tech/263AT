- id: B41
  name_ja: Mohanram G-score
  category: B
  category_name: 収益性・クオリティ
  subsection: null
  definition: 8項目の 0/1 合計（収益性・CF・成長の安定性・R&D/設備投資/広告の集約度）
  formula: 8項目の 0/1 合計（ROA・CFO/TA・アクルーアル・収益の安定性・成長の安定性・R&D/TA・設備投資/TA・広告/TA）
  inputs:
  - NI
  - CFO
  - TA
  - REV
  - RD
  - CAPEX
  - AdExp
  sign: positive
  buy_class: main
  sell_class: useful
  gate_policy: null
  horizon:
    label: 1Y-3Y
    min_m: 12
    max_m: 36
  data_sources:
  - CALC
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T1
  markets:
  - JP
  - US
  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: R&D と広告費を独立開示しない企業が多く、**日本は特に広告費の開示が少ない。** 8項目のうち3項目が計算できない銘柄が日本では多数出る。
  pit_lag_days: 0
  zero_denominator_policy: TA>0。計算可能な項目が5項目未満なら全体を欠損にする。
  missing_policy: flag
  missing_bias: '**R&D・広告を開示する企業に偏る。** 日本の小型製造業では R&D 開示が薄く、 B17（Piotroski）は計算できるが B41 は計算できない、という非対称が起きる。'
  normalization: rank_sector
  nonlinear: null
  winsorize: null
  correlated_with:
  - B16
  - B17
  - B06
  - B25
  - C33
  - B39
  economic_rationale: '**B17 が低PBR（バリュー）群向けなのに対し、B41 は高PBR（成長）群向け。** 成長株は現在の収益性が低いことが多く、Piotroski の基準では全滅する。 G-score は代わりに「成長の安定性」と「無形投資の水準」を評価する。 OSAP で t=9.1 と、複合会計指標では最上位。 **バリューとグロースで別の品質指標を使うという発想自体が、263AT に欠けていた視点。**'
  references:
  - https://www.openassetpricing.com/
  - https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf
  - OSAP MS — Mohanram G-score, t=9.1
  notes: OSAP MS t=9.1。B17 Piotroski が低PBR株向けなのに対し、G-score は高PBR（成長）株向け。両方持って使い分ける
  notes_extra: null
