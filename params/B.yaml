  - US
  industries: null
  period_convention: AVG
  consolidation: consolidated
  accounting_standard_note: B03 の会計基準差を継承。WACC の推定にはベータ（I05）が要るので株価データにも依存する。
  pit_lag_days: 0
  zero_denominator_policy: na（差分）。WACC の推定が不能なら欠損。
  missing_policy: flag
  missing_bias: '**WACC の推定が最大の不確実性。** ベータ・株式リスクプレミアム・負債コストの どれも推定値で、業種平均で代用すると個社の実態から離れる。 日本は東証が「資本コストを意識した経営」を要請しており、**企業自身が開示した WACC がある場合は それを優先する**（F22 と連携）。'
  normalization: rank_sector
  nonlinear: null
  winsorize: null
  correlated_with:
  - B03
  - B12
  - C07
  - C08
  - C39
  - A42
  - F22
  economic_rationale: '**正なら成長が価値を生み、負なら成長するほど価値を壊す。** C カテゴリ（成長性）の符号を決める条件変数であり、 **成長率を単独で加点してはいけない理由そのもの。** C07（再投資率）、C39（投資/売上）、 N33（大型設備投資）はすべて B04 との交互作用で符号が変わる。 LAW-32（資産成長アノマリー）が「投資しすぎは劣後」を示すのは、 平均的な企業の B04 が小さいからだと解釈できる。'
  references:
  - https://images.aqr.com/-/media/AQR/Documents/Insights/Journal-Article/The-Limits-to-Arbitrage-Revisited-The-Accrual-and-Asset-Growth-Anomalies.pdf
  - https://www.jpx.co.jp/english/equities/follow-up/02.html
  notes: 正 = 価値創造、負 = 成長するほど価値破壊。負の企業は成長を減点材料にする
  notes_extra: null
