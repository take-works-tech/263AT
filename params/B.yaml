- id: B03
  name_ja: ROIC
  category: B
  category_name: 収益性・クオリティ
  subsection: null
  definition: NOPAT / 投下資本、NOPAT = EBIT*(1-実効税率)
  formula: EBIT_TTM * (1 - TAXR) / IC_AVG
  inputs:
  - EBIT
  - TAXR
  - IBD
  - EQ
  - CASH
  sign: positive
  buy_class: main
  sell_class: useful
  gate_policy: null
  horizon:
    label: 1Y-5Y
    min_m: 12
    max_m: 60
  data_sources:
  - CALC
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T2
  markets:
  - JP
  - US
  industries: null
  period_convention: AVG
  consolidation: consolidated
  accounting_standard_note: '**ROIC は定義の揺れが最も大きい指標。** IC を「IBD + EQ - CASH」に固定する（spec §2）。 「超過現金のみ控除」版も別に持って比較する（spec §2 の注）。 IFRS16 でリース負債が IBD に入ると IC が膨らみ ROIC が下がるので、Z07 の年は注意。'
  pit_lag_days: 0
  zero_denominator_policy: '**IC がゼロ・負になる企業が実在する**（ネットキャッシュが自己資本を超える）。 その場合 ROIC は意味を失うので欠損にし、A16/A17（実質PER）で評価する。'
  missing_policy: flag
  missing_bias: ネットキャッシュ潤沢な小型株で欠損しやすい。**それは 263AT が狙う銘柄と重なる**。
  normalization: rank_sector
  nonlinear: null
  winsorize: null
  correlated_with:
  - B01
  - B04
  - B12
  - B13
  - B40
  - C08
  - A14
  - A42
  economic_rationale: '**長期複利の本体。** `長期リターン ≈ ROIC × 再投資率`（C08、LAW-43）の第1項。 資本構成に中立なので、B01 と違ってレバレッジで水増しできない。 Buffett の超過収益が QMJ で説明できる（LAW-119）という実証も、 突き詰めれば「高 ROIC を安く買う」に還元される。'
  references:
  - http://www.econ.yale.edu/~shiller/behfin/2013_04-10/asness-frazzini-pedersen.pdf
  - https://www.nber.org/system/files/working_papers/w19681/w19681.pdf
  - https://mysimon.rochester.edu/novy-marx/research/OSoV.pdf
  notes: 本命指標。定義の揺れが大きいので計算方法を1つに固定して記録する
  notes_extra: null
