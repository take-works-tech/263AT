  - US
  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: '**spec §2.1 で 263AT は GAAP のみを使うと決めた。** E07 は「非GAAP をどれだけ使っているか」を測るためだけに非GAAP を参照する。'
  pit_lag_days: 0
  zero_denominator_policy: '**GAAP 利益がゼロ近傍で発散する。abs で正規化し、上下 clip する。**'
  missing_policy: flag
