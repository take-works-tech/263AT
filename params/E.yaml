- id: E04
  name_ja: Beneish M-Score
  category: E
  category_name: 会計品質・不正検知
  subsection: null
  definition: 8変数（DSRI, GMI, AQI, SGI, DEPI, SGAI, LVGI, TATA）
  formula: -4.84 + 0.92*DSRI + 0.528*GMI + 0.404*AQI + 0.892*SGI + 0.115*DEPI - 0.172*SGAI + 4.679*TATA - 0.327*LVGI
  inputs:
  - REV
  - AR
  - GP
  - TA
  - DA
  - SGA
  - NI
  - CFO
  - TL
  sign: negative
  buy_class: gate
  sell_class: main
  gate_policy: '**M > -1.78 だけでは除外しない**（偽陽性が多い）。 M > -1.78 かつ 次のいずれかを満たす場合に除外する: (a) E01 総アクルーアルが断面上位20%、(b) E10 売上とCFの乖離が2期連続で拡大、 (c) E08 監査法人変更、(d) E20 期末集中売上が対過去で異常。'
  horizon:
    label: 1Y-3Y
    min_m: 12
    max_m: 36
  data_sources:
  - CALC
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T2
  markets:
  - JP
  - US
  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: 8変数すべてが前期比を取るため、**決算期変更（Z06）や会計基準変更（Z07）があると全て異常値になる**。 該当年は判定不能として扱う。米国データで推定された係数であり日本での妥当性は未検証。
  pit_lag_days: 0
  zero_denominator_policy: 前期値がゼロ・負になる変数（GMI の粗利率、SGI の売上）で発散する。 **各変数を個別に 1%/99% でクリップしてから合成する**。クリップされた変数が3つ以上なら判定不能。
  missing_policy: flag
  missing_bias: 8変数すべてに2期分のデータが要るので、上場2年未満と決算期変更企業で欠損。
  normalization: rank_sector
  nonlinear: null
  winsorize: null
  correlated_with:
  - E01
  - E02
  - E10
  - E18
  - E20
  - B23
  economic_rationale: 利益操作の兆候を8つの角度から集約する。**単独では偽陽性が多い**（正常な急成長企業も高スコアになる） ため、263AT では M>-1.78 だけでは除外せず、E01/E10/E08/E20 のいずれかとの複合で除外する。 会計不正は1件で他の全銘柄の利益を吹き飛ばすため、偽陽性のコストより偽陰性のコストが遥かに高い。
  references:
  - '原論文: Beneish (1999) Financial Analysts Journal 55(5) 24-36'
  - https://journals.sagepub.com/doi/10.1177/21582440251386174
  - https://www.researchgate.net/publication/347761022_Beneish_M-score_and_Altman_Z-score_as_a_catalyst_for_corporate_fraud_detection
  notes: -1.78 超で操作の疑い。単独では偽陽性が多いので他と合議させる
  notes_extra: null
