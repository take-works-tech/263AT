    プットが割高になっているのは、**悪材料を知っている誰かが
    先に保険を買っている**ことを示す。
    **ただし 263AT の中核ユニバース（小型・ネグレクト）には
    オプションが存在しないので、実際に使える銘柄は限られる**
    — これは K カテゴリのオプション系全体に共通する制約。
  evidence_tier: T1
  references: ["https://www.openassetpricing.com/", "Xing-Zhang-Zhao (JFQA 2010) What Does the Individual Option Volatility Smirk Tell Us?", "OSAP SmileSlope t=8.2"]
