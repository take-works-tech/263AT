K52:
  formula: "ShortInterest × institutional ownership の交互作用"
  inputs: [K19, K22]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: na
  pit_lag_days: 45
  zero_denominator_policy: "両方が必要。片方でも欠損なら欠損。"
  missing_bias: "**K19（3日遅れ）と K22（45日遅れ）で鮮度が全く違うものを掛ける。遅い方に律速される**（_defaults の pit_lag_rule）。"
  correlated_with: [K19, K22, K21, K51]
  economic_rationale: >-
