# --- Q セクター・相関・ポートフォリオ文脈 --------------------------------------

Q01:
  formula: "max_j corr( r_i, r_j )、j は保有銘柄、日次252日"
  inputs: [PRICE, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "共通観測が60日未満なら欠損。"
  missing_bias: "上場1年未満で欠損。売買停止日が多い銘柄で推定が歪む。"
  correlated_with: [Q02, Q06, Q13, Q16, Q03]
  economic_rationale: >-
    **0.7超なら実質同じ銘柄。** §1.6 で集中設計（rho 高）を採るほど、
    残す銘柄間の相関管理が重要になる。ただし**平時の相関は危機時に役に立たない**
    （Q13）ので、これだけで分散できたと考えてはいけない。
  evidence_tier: T2
  references: ["構造的判断。分散の数学 LAW-06"]
  markets: [JP, US]
  review: {status: verified}

Q02:
  formula: "mean_j corr( r_i, r_j )"
  inputs: [PRICE, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "Q01 と同じ。"
  missing_bias: "Q01 と同じ。"
  correlated_with: [Q01, Q13, Q14, Q04]
  economic_rationale: >-
    ポートフォリオ全体の分散度。Q01（最大）が個別の重複を見るのに対し、
    Q02（平均）は全体の凝集度を見る。**実効銘柄数（Q14）と併せて、
    「20銘柄持っているが実質5銘柄」という状態を検出する。**
  evidence_tier: T2
  references: ["構造的判断。LAW-06"]
  markets: [JP, US]
  review: {status: verified}

Q03:
  formula: "SUM( セクター別ウェイト^2 )"
  inputs: [SELF_positions, sector_classification]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: "業種分類の欠損で計算不能。"
  correlated_with: [Q01, Q02, Q11, Q14, V13]
  economic_rationale: >-
    セクター集中度。**追加後の HHI を計算して閾値超過なら減点する**という
    後段補正に使う。ただし 263AT は小型株中心なので、
    **そもそもセクターが偏りやすい**（小型株が多い業種と少ない業種がある）。
    厳しく管理しすぎるとユニバースを失う。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Q04:
  formula: "d(sigma_p) / d(w_i)"
  inputs: [PRICE, SELF_positions, I03]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "ポートフォリオのボラがゼロなら欠損。"
  missing_bias: "共分散行列の推定に依存。保有銘柄数が少ないと不安定。"
  correlated_with: [Q01, Q02, Q05, Q12, I03, I16]
  economic_rationale: >-
    **単独リスクではなくポートフォリオへの寄与で判断する。**
    高ボラでも既存保有と負相関なら、全体のリスクは下がる。
    §1.6 の Kelly サイジングは単独の sigma を使うが、
    **本来は限界リスク寄与で調整すべき**（未実装。次の改訂候補）。
  evidence_tier: T2
  references: ["構造的判断。LAW-06 / §1.6"]
  markets: [JP, US]
  review: {status: verified}

Q05:
  formula: "d(E[U_p]) / d(w_i)"
  inputs: [mu_hat, Q04, lambda]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: "期待リターン推定（§1.4）に依存。**b_h が有意でなければこの値も無意味。**"
  correlated_with: [Q04, Q12, R11, S12]
  economic_rationale: >-
    **Q04 との比が実質的な採用基準。** 期待効用の増加をリスクの増加で割った値が
    高い順に組み入れる。**§1.4 の較正（スコア → 期待リターン）ができていないと
    計算できない**ので、Phase 3 までは使えない。
  evidence_tier: T3
  references: ["構造的判断。§1.4 / §1.6"]
  markets: [JP, US]
  review: {status: verified}

Q06:
  formula: "LLM による既存保有とのテーマ類似度 0-1"
  inputs: [LLM, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: "LLM 依存。過去に遡れない（§6.4）。"
  correlated_with: [Q01, Q02, Q13, Q16, R22, T21]
  economic_rationale: >-
    **相関では見えない「同じ賭け」を検出する。**
    半導体 × AI × 電力インフラは、過去の相関が低くても同じシナリオに依存している。
    **LLM を使うと「今の物語」に引っ張られて集中しやすい**（§8-5）ので、
    LLM 自身にその重複を検出させるという構造にしている。
  evidence_tier: T3
  references: ["構造的判断。LLM 由来のため前向き記録が必要"]
  markets: [JP, US]
  review: {status: verified}

Q07:
  formula: "SUM( w_i × P08_i )"
  inputs: [P08, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  nonlinear: "abs_dev(x_star=0)"
  missing_bias: "P08（銘柄別為替感応度）の推定に依存。"
  correlated_with: [P07, P08, P21, Q15, S18, V07]
  economic_rationale: >-
    ∩型（ゼロが最適とは限らないが、意図しない大きな露出は避ける）。
    **日米両方に投資するので二重に効く** — 米国株を持つこと自体がドル露出であり、
    さらに日本の輸出企業もドル感応度を持つ。**気づかないうちに為替に大きく賭けている**
    という状態が起きやすい。Q08（投信部分）まで含めて見ないと全体が分からない。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Q08:
  formula: "保有投信の組入上位銘柄と個別株保有の重複ウェイト"
  inputs: [SELF_fund_holdings, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: >-
    **投信の組入銘柄は月次開示で、しかも上位10銘柄程度しか出ない。**
    インデックス投信なら構成銘柄が分かるが、アクティブ投信は不透明。
    **全体像は原理的に把握できない。**
  correlated_with: [Q01, Q06, Q07, Q15, Q11]
  economic_rationale: >-
    **全体ポートフォリオの90%が投信である以上、これを見ないのは片手落ち。**
    §1.8 のバーベル構造（90%投信 + 10%個別株）が成立する前提は、
    両者が独立であること。個別株が投信と同じ銘柄なら、
    **バーベルではなく単なる集中になっている。**
    ただし上記の通り把握には限界があるので、**セクター・地域レベルで近似する**のが現実的。
  evidence_tier: T3
  references: ["構造的判断。catalog §1.8 のバーベル前提"]
  markets: [JP, US]
  review: {status: verified}

Q09:
  formula: "業種内での S_buy の順位"
  inputs: [S_buy, sector_classification]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "業種内の銘柄数が5未満なら欠損。"
  missing_bias: "業種分類の欠損。T21（LLM による真の競合特定）で母集団を置き換える案がある。"
  correlated_with: [A25, A41, R22, T21, Q10]
  economic_rationale: >-
    **「この業種に賭けるなら、この銘柄が最善か」。**
    業種の追い風で全銘柄が上がっている局面では、
    銘柄選択の巧拙が見えなくなる。業種内順位で見れば、
    **業種要因を除いた選択能力が分かる。** A41（同業最安値スプレッド）と対。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Q10:
  formula: "r_i(6ヶ月) - median( r_同業(6ヶ月) )"
  inputs: [PRICE, sector_classification]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "業種内の銘柄数が3未満なら欠損。"
  missing_bias: "業種分類の欠損。"
  correlated_with: [G11, G27, Q09, L01, L09]
  economic_rationale: >-
    **一社だけ下がっているなら個社要因。** 業種全体が下がっているなら
    マクロかセクター要因で、意味が全く違う。
    **LLM で理由を調べるトリガーにする**という使い方が本質で、
    スコアへの直接寄与より、調査リソースの配分に使う（LAW-14 情報の価値）。
  evidence_tier: T2
  references: ["https://www.openassetpricing.com/", "OSAP IndMom / IndRetBig との関連"]
  markets: [JP, US]
  review: {status: verified}

Q11:
  formula: "ポートフォリオのファクター露出（バリュー/クオリティ/サイズ/モメンタム）"
  inputs: [SELF_positions, factor_loadings]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  nonlinear: "abs_dev(x_star=target_exposure)"
  missing_bias: "ファクター・ローディングの推定に Ken French データが要る（無料で取得可能）。"
  correlated_with: [Q03, Q07, Q08, Q13, P17, P23]
  economic_rationale: >-
    ∩型。**意図しないファクター賭けの検出。**
    銘柄単位で選ぶと必ずどこかに偏る。バリュー重視で選んだつもりが
    小型株ばかりになっている、といった事態を検出する。
    P23（ファクター混雑度）と組み合わせると、**混雑したファクターに
    知らないうちに全張りしている**という最悪の状態を防げる。
  evidence_tier: T2
  references: ["https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Q12:
  formula: "delta( mu_p / sigma_p ) 追加前後"
  inputs: [Q04, Q05, mu_hat]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "sigma_p がゼロなら欠損。"
  missing_bias: "期待リターン推定に依存。"
  correlated_with: [Q04, Q05, Q13, R10, R11]
  economic_rationale: >-
    Q04（限界リスク）と Q05（限界期待値）の統合。
    **採用可否の最終判断はこれで行う。** 単独のスコアが高くても、
    ポートフォリオのシャープを下げるなら入れない。
    OQ-24 の実測（合成シャープ 0.6〜1.0）を踏まえると、
    **1銘柄の追加でシャープが下がるなら、それは組み入れる価値がない。**
  evidence_tier: T3
  references: ["構造的判断。research/findings §7"]
  markets: [JP, US]
  review: {status: verified}

Q13:
  formula: "市場下落上位5%の日に限定した銘柄間相関"
  inputs: [PRICE, market_return, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "下落上位5%の日が20未満なら欠損。"
  missing_bias: "危機を含む長期の履歴が要る。**上場5年未満では危機を経験していない可能性がある。**"
  correlated_with: [Q01, Q02, I10, I16, I18, I28]
  economic_rationale: >-
    **平時の相関は危機時に役に立たない。** 危機では相関が1に近づき、
    分散効果が消える。Q01/Q02 で分散できたと思っていても、
    **本当に必要なときに機能しない**という致命的な誤算が起きる。
    I18（危機時パフォーマンス）と併せて、**ストレス下での実際の分散度**を測る。
  evidence_tier: T2
  references: ["構造的判断。危機時の相関上昇は広く観測される"]
  markets: [JP, US]
  review: {status: verified}

Q14:
  formula: "1 / SUM(w_i^2)"
  inputs: [SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "ポジションが無ければ欠損。"
  nonlinear: "abs_dev(x_star=N_target)"
  missing_bias: "na"
  correlated_with: [Q02, Q03, Q13, R10]
  economic_rationale: >-
    ∩型。**見かけの銘柄数ではなく実質的な分散度。**
    20銘柄でも1銘柄が50%なら実効銘柄数は約4。
    §1.8.3 で N_target を実測IC から導くと決めたので、
    **その目標値との乖離**を測るのがこの変数の役割。
    Bessembinder（4%の銘柄が全リターンを生む）を踏まえると、
    実効銘柄数が小さすぎると右裾を掴む確率が下がる。
  evidence_tier: T2
  references: ["https://www.zeninvestor.org/wp-content/uploads/2025/11/Do-stocks-outperform-T-bills.pdf", "catalog §1.8.3"]
  markets: [JP, US]
  review: {status: verified}

Q15:
  formula: "国別・通貨別のウェイト分布"
  inputs: [SELF_positions, J19]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  nonlinear: "abs_dev(x_star=target_allocation)"
  missing_bias: "na"
  correlated_with: [Q07, Q08, P07, P21, P22, S18]
  economic_rationale: >-
    ∩型。Q07（為替感応度の合計）が統計的な露出を測るのに対し、
    Q15 は名目的な配分を測る。**日米の配分比率は P22（相対バリュエーション）で
    動的に決めるべきだが、それはマクロ予測になるので §1.9 の
    「マクロで銘柄を選ばない」（LAW-78）と衝突する。**
    暫定的には固定比率（例: 50/50）にして、Q15 で乖離を監視するのが安全。
  evidence_tier: T3
  references: ["構造的判断。catalog LAW-78"]
  markets: [JP, US]
  review: {status: verified}

Q16:
  formula: "保有銘柄間の顧客・仕入先の重複度（LLM 判定）"
  inputs: [LLM, N21, L06, L07, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: "LLM 依存。顧客・仕入先の開示が薄い日本では推定精度が落ちる。"
  correlated_with: [Q01, Q06, Q13, L06, L07, N21]
  economic_rationale: >-
    **Q06（テーマ）でも相関でも見えない連鎖リスク。**
    同じ最終顧客に依存する2社は、テーマも業種も違って見えても
    同じ需要ショックで同時に沈む。L06/L07（サプライチェーン・モメンタム）が
    リターン予測に使う関係を、**リスク管理側から使う。**
  evidence_tier: T3
  references: ["https://www.openassetpricing.com/", "OSAP iomom_cust / iomom_supp と同根"]
  markets: [JP, US]
  review: {status: verified}

Q17:
  formula: "現金 / 個別株予算"
  inputs: [SELF_cash, PORTFOLIO_JPY]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "予算>0。"
  nonlinear: "abs_dev(x_star=target_cash)"
  missing_bias: "na"
  correlated_with: [P16, P10, Q14, R10, S05]
  economic_rationale: >-
    ∩型。**下落時の買い増し余地を確保する。**
    P16（市場ドローダウン）と連動させ、市場が下がったときに
    使える現金を持っておく。ただし**現金を持つこと自体は期待リターンを下げる**ので、
    タイミングを計ろうとすると LAW-78 に反する。
    **NISA 枠の年間上限（S05、240万円）があるので、
    そもそも一度に全額投入できない**という制度的な制約が、
    結果的にドルコスト平均法的な効果を生む点は指摘しておく価値がある。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Q18:
  formula: "NISA 保有銘柄の期待リターン順位 vs 全保有の期待リターン順位"
  inputs: [S04, S05, mu_hat, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: "期待リターン推定に依存。日本固有。"
  correlated_with: [S04, S05, S06, S14, S10, S16]
  economic_rationale: >-
    **期待値が高い順に NISA を埋める**という原則の、ポートフォリオ全体での測定。
    ただし S06 で述べた通り単純な期待値順ではなく、
    **(a) NISA は損切りが救済されないので分散の小さい銘柄が向く、
    (b) 高配当米国株は外国税額控除が使えず不利（S10）**という
    2つの修正が要る。**税制の最適化は 263AT で最も日本固有かつ
    確実にリターンを改善できる領域**で、しかも予測不要なので確度が高い。
  evidence_tier: T3
  references: ["https://faq.sbisec.co.jp/answer/5ee86c0b144d40001145db08/", "構造的判断"]
  markets: [JP]
  review: {status: verified}

# --- Y ESG・非財務リスク -------------------------------------------------------

Y01:
  formula: "主要評価機関の ESG スコア"
  inputs: [ESG_rating]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: >-
    **カバレッジが大型株に強く偏る。** 日本の小型株はほぼ未評価。
    さらに**評価機関間の相関が低い**（同じ企業に真逆の評価が付く）ので、
    どの機関のスコアを使うかで結果が変わる。
  correlated_with: [Y02, Y03, Y12, W07, M27]
  economic_rationale: >-
    **単独のアルファ源としては証拠が弱い。** 評価機関間の不一致が大きいこと自体が、
    「ESG」という概念が測定可能な単一の量ではないことを示唆する。
    263AT では**需給要因（Y12 指数採用）とテールリスク（Y06/Y10）としてのみ扱い、
    水準はほぼ使わない。** ★1 の事前スケール 0.15 で強く縮小される。
  evidence_tier: T3
  references: ["構造的判断。ESG スコアの機関間不一致は広く報告されている"]
  markets: [JP, US]
  review: {status: verified}

Y02:
  formula: "Y01 の前年比変化"
  inputs: [Y01]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "前年のスコアが無ければ欠損。"
  missing_bias: "Y01 を継承。評価方法の変更でスコアが動くと誤検出する。"
  correlated_with: [Y01, Y04, Y12]
  economic_rationale: >-
    **水準よりモメンタムの方がまだ証拠がある。** 理由は需給
    — ESG 資金が改善企業に流入するため。因果ではなくフローの話。
    ただし評価機関が算定方法を変えただけでもスコアが動くので、
    **変化の原因を確認しないと誤検出する。**
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Y03:
  formula: "(Scope1 + Scope2 排出量) / REV"
  inputs: [emissions, REV]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: >-
    **算定基準（GHG プロトコル）は共通だが、集計範囲が企業判断。**
    Scope2 のマーケット基準とロケーション基準で数値が変わる。
  zero_denominator_policy: "REV>0。排出量の開示が無ければ欠損。"
  missing_bias: "**開示企業に偏る。** 日本は東証プライムで実質義務化されているが、スタンダード・グロースは任意。"
  correlated_with: [Y04, Y05, Y10, V07, P30]
  economic_rationale: >-
    **炭素税・排出量取引が導入されれば直接コストになる。**
    5年ホライズンでは制度変更（P30）の確率が無視できないので、
    アルファではなく**将来コストの現在価値**として扱う。
    排出量原単位が業種中央値の数倍なら、制度変更時の打撃が大きい。
  evidence_tier: T3
  references: ["GHG プロトコル", "https://www.jpx.co.jp/english/equities/follow-up/02.html"]
  markets: [JP, US]
  review: {status: verified}

Y04:
  formula: "排出削減目標に対する実績の進捗率"
  inputs: [Y03, emission_targets, LLM]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "目標が無ければ欠損。"
  missing_bias: "目標を掲げる企業に偏る。**目標を掲げない企業を評価できない。**"
  correlated_with: [Y03, Y02, N18, T11]
  economic_rationale: >-
    **目標だけの企業と実行企業の区別。** N18（中計の達成率）と
    T11（経営陣の約束履行率）の環境版で、**同じ「約束を守るか」という
    企業文化の指標**として見る方が、環境そのものより情報量が多いかもしれない。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Y05:
  formula: "1 if 化石燃料・武器・たばこ・ギャンブル等に該当 else 0"
  inputs: [LLM, sector_classification, REV_breakdown]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: "該当業種の判定に売上構成が要る。副業として該当事業を持つ企業を取りこぼす。"
  correlated_with: [Y01, Y12, O13, K26]
  economic_rationale: >-
    **符号が相殺する厄介な変数。** 機関のダイベストメントで売り圧力を受ける（負）が、
    **その結果として割安になる**（正）。OSAP `sinAlgo` t=2.0 は正の符号
    — つまり**避けられる銘柄の方が儲かる**という結果。
    これは O カテゴリ（ネグレクト）と同じ構造で、
    **「機関が持てない」ことが個人の機会になる**典型例。
    ただし本人の価値観で除外したい場合は、これをゲートにする選択もありうる。
  evidence_tier: T1
  references: ["https://www.openassetpricing.com/", "OSAP sinAlgo t=2.0"]
  markets: [JP, US]
  review: {status: verified}

Y06:
  formula: "過去5年の重大な不祥事の件数"
  inputs: [NEWS, LLM]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（カウント）"
  missing_bias: >-
    **報道依存なので小型株で見逃す**（N36/N37/W14 と同型）。
    O カテゴリと逆方向で、**ネグレクト銘柄で悪材料を見逃す**という
    リスク管理上まずい偏りが、Y カテゴリにも共通して現れる。
  correlated_with: [Y07, Y09, W14, N36, N37, E12, E08]
  economic_rationale: >-
    **再発率が高い。組織文化の指標として実用的。**
    1件目を「不運」と見るか「兆候」と見るかで判断が変わるが、
    実務的には兆候と見るべき。E08/E12（会計上の問題）、W14（労務）、
    N36/N37（製品・情報）と合わせて、**組織の統制の弱さを横断的に測る。**
  evidence_tier: T3
  references: ["構造的判断。不祥事の再発率に関する体系的な実証は未確認"]
  markets: [JP, US]
  review: {status: verified}

Y07:
  formula: "訴訟・行政処分の件数と規模 / MCAP"
  inputs: [LLM, EDINET, SEC_legal, MCAP]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "N20 と同じ日米の開示基準差（米国の方が広い）。"
  zero_denominator_policy: "MCAP>0。"
  missing_bias: "N20 と同じ。米国はクラスアクションが多く制度差が数値差になる。"
  correlated_with: [N20, Y06, Y10, D21, E12]
  economic_rationale: >-
    N20（現在係争中）が現在を見るのに対し、Y07 は履歴を見る。
    **訴訟の多い企業は訴訟を招く事業慣行を持っている**可能性が高く、
    Y06（不祥事）と同じ「再発する」性質を持つ。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Y08:
  formula: "強制労働懸念地域への調達・生産依存度"
  inputs: [LLM, V08, supply_chain]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: "**サプライチェーンの2次以降が見えない。** 直接取引先しか分からず、過小評価に偏る。"
  correlated_with: [V08, T19, Y10, N38, P30]
  economic_rationale: >-
    **米国 UFLPA 等で輸入差止のリスク。** 実際に発動されると
    売上が即座に止まるので、テールリスクとして無視できない。
    V08（中国エクスポージャー）と重なるが、
    **こちらは規制リスクという具体的な発現経路を持つ。**
  evidence_tier: T3
  references: ["米国: Uyghur Forced Labor Prevention Act (UFLPA)", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Y09:
  formula: "個人データ取扱量とプライバシー規制への露出度"
  inputs: [LLM, V07, business_model]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: "LLM 推定。ネット企業に偏る。"
  correlated_with: [Y07, N37, T20, V07]
  economic_rationale: >-
    **GDPR の制裁金は全世界売上の最大4%**という規模なので、
    利益ではなく売上に対して科される点が特異。
    N37（情報漏洩）が事故を見るのに対し、Y09 は規制への構造的な露出を見る。
  evidence_tier: T3
  references: ["EU GDPR Art.83", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Y10:
  formula: "環境関連の引当金 + 推定潜在債務 / EQ"
  inputs: [environmental_provisions, LLM, EQ]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: >-
    **引当計上の基準が国で違う。** 米国 ASC 410（資産除去債務）は範囲が広く、
    日本は限定的。**日本企業の方が簿外に残りやすい。**
  zero_denominator_policy: "EQ>0。債務超過なら D02 で既に除外。"
  missing_bias: "潜在債務の推定は LLM 頼み。化学・重工業以外ではほぼゼロ。"
  correlated_with: [Y03, Y07, D21, D20, E11]
  economic_rationale: >-
    **簿外の巨額債務になりうる。** 土壌汚染・アスベスト・原状回復義務は、
    発覚した時点で自己資本を大きく毀損する。
    D21（保証債務）と同じく**貸借対照表に載っていないリスク**で、
    バリュー指標（A03 PBR）を見ているだけでは絶対に気づけない。
  evidence_tier: T3
  references: ["米国: ASC 410（資産除去債務）", "日本: 資産除去債務に関する会計基準"]
  markets: [JP, US]
  review: {status: verified}

Y11:
  formula: "主要拠点の水害・地震ハザードマップ上のリスク評価"
  inputs: [LLM, facility_locations, hazard_maps]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: >-
    **拠点の所在地は有報の「主要な設備の状況」から取れるが、粒度が粗い**
    （市区町村レベル）。サプライヤーの拠点は分からない。
  correlated_with: [N38, V07, V08, Y10, I18]
  economic_rationale: >-
    **日本は地震・水害リスクが構造的に高い。** 5年ホライズンでは
    大規模災害の発生確率が無視できない。ただし**定量化が極めて難しく、
    しかも保険でカバーされる部分がある**ので、実効的なリスクは推定値より小さい。
    ★1 で強く縮小されるのが妥当。
  evidence_tier: T3
  references: ["構造的判断。定量化手法が確立していない"]
  markets: [JP, US]
  review: {status: verified}

Y12:
  formula: "主要 ESG 指数への採用・除外イベント"
  inputs: [index_membership]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（分類）"
  missing_bias: "指数の構成銘柄リストが必要。日本は GPIF 採用指数が公表されている。"
  correlated_with: [K12, K13, K26, O13, Y01, Y02]
  economic_rationale: >-
    **純粋な需給イベントとして扱う**（K13 の指数採用と同種）。
    日本は GPIF が ESG 指数に巨額を配分しているので、
    **採用・除外の需給インパクトが他国より大きい。**
    Y01（スコア水準）にアルファが無くても、
    **指数採用というイベントには需給効果がある**という切り分けが重要。
  evidence_tier: T3
  references: ["https://www.openassetpricing.com/", "K13（指数イベント）と同種の需給効果"]
  markets: [JP, US]
  review: {status: verified}
