K45:
  formula: "1 if 空売り機関のレポートが公表され、72時間以内に精査が完了していない else 0"
  inputs: [NEWS, short_seller_reports]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: >-
    **検出はニュース監視に依存する。** 小型株ほど報道されにくく、
    逆に小型株ほど標的にされやすいので、**見逃しが最も起きやすい領域で最も危険**という
    最悪の組み合わせになる。T36（発信源の信頼度）と併せて監視範囲を広げる必要がある。
  correlated_with: [K19, K21, K44, E04, E12]
  economic_rationale: >-
    構造的制約。空売り機関は自らの資金を賭けて数ヶ月〜数年の調査を行っており、
    **個人が数時間でできる分析より情報量が多い。** 内容が正しいかは別として、
    「無視する」という選択肢は合理的でない。判定できない場合は除外を維持する（LAW-61）。
  evidence_tier: T3
  references:
    - "構造的制約。レポートの主張の当否ではなく、精査が済むまで判断を保留するという規律"
  markets: [JP, US]
  review: {status: verified}

# --- N カタリスト -------------------------------------------------------------

N23:
  formula: "1 if 整理銘柄・監理銘柄に指定、または上場廃止基準に抵触して改善期間中 else 0"
  inputs: [TD_disclosure, exchange_designation]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: >-
    日本は東証が明示的に指定するので機械的に取れる。**米国は取引所ごとに
    deficiency notice の形式が違い、8-K に埋もれる**ため検出率が下がる。
  correlated_with: [N44, N22, D13, J06, K34]
  economic_rationale: >-
    構造的制約。上場廃止は**最悪のテールリスク**で、廃止後の売却は極端に困難になる
    （DF-01 で実測した通り、廃止銘柄は価格データすら消える）。
    改善期間中は「改善すれば戻る」という賭けになるが、それは 263AT の設計思想
    （多数の弱いシグナルの合成）と別物のイベント投資であり、混ぜるべきでない。
  evidence_tier: T3
  references:
    - "東証 有価証券上場規程 第2章第4節（上場廃止基準）"
  markets: [JP, US]
  review: {status: verified}

N44:
  formula: "min(流通株式時価総額/基準, 流通株式比率/基準, 株主数/基準)"
  inputs: [float_market_cap, float_ratio, shareholder_count]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "基準値は制度で定まっているのでゼロにならない。"
  missing_bias: >-
    流通株式時価総額と株主数は**年1回の開示**なので最大1年古い（Z04）。
    株主数の急減（K34）は基準抵触の先行指標だが、これも年次。**先行指標としての解像度が粗い。**
  correlated_with: [N23, J06, J07, K34, K36]
  economic_rationale: >-
    構造的制約。N23（抵触してから）では遅い。**余裕度が薄い銘柄を先に外す。**
    東証の市場区分見直しで基準が厳格化しており、スタンダード市場の小型株では
    現実的なリスクになっている。ただし**抵触リスクがある企業ほど割安に見える**ため、
    A カテゴリと逆相関する典型的なバリュートラップ要因。
  evidence_tier: T3
  references:
    - "https://www.jpx.co.jp/english/equities/follow-up/02.html"
    - "東証 有価証券上場規程（上場維持基準）"
  markets: [JP, US]
  review: {status: verified}

# --- T LLM 派生 ---------------------------------------------------------------

T13:
  formula: "1 if LLM が (a) 事業を3文で説明でき かつ (b) 収益ドライバーを3つ特定できる else 0"
  inputs: [company_description, financial_statements]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: >-
    **開示が薄い企業ほど説明できず不合格になる。** それは「理解できない」の正しい検出でもあるが、
    同時に「無名だが良い企業」を外す方向にも働く。O カテゴリ（ネグレクト＝加点）と
    **正面から衝突するゲート**であり、閾値の設定が戦略の性格を決める（OQ-23 で較正）。
  correlated_with: [T10, T14, T21, E17, O09]
  economic_rationale: >-
    構造的制約。LAW-61（Munger）の実装。**理解していない事業の株価が下がったとき、
    買い増すべきか売るべきかを判断できない。** 判断できないポジションは、
    結局は最も感情的な瞬間に処分することになる（LAW-98 パニック売り）。
    263AT は機械的に運用するが、テーゼ検証（T25）と最終承認は人間が行うので、
    人間が理解できることは要件である。
  evidence_tier: T3
  references:
    - "構造的制約。統計的エッジではなく運用規律"
  markets: [JP, US]
  review: {status: verified}

# --- U 業種固有 ---------------------------------------------------------------

U08:
  formula: "ソルベンシー・マージン総額 / (リスクの合計額 * 0.5) * 100"
  inputs: [solvency_margin, total_risk]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: >-
    日本の算出方法は金融庁告示で定まっており、**米国の RBC 比率とは計算式が違う**。
    日米で直接比較してはいけない。それぞれの規制基準（日本200%、米国 RBC 200%）で判定する。
  zero_denominator_policy: "リスク合計額 > 0。ゼロなら判定不能として欠損。"
  missing_bias: "保険業にのみ適用。他業種では常に欠損＝適用外（U カテゴリの設計通り）。"
  correlated_with: [U06, U07, D02, D08]
  economic_rationale: >-
    構造的制約。**規制当局が介入する水準を割った保険会社は、
    増資・事業縮小・最悪は破綻に至る。** 保険業は通常の財務指標（D01/D02）が
    そのままでは意味を持たないため、業種固有のゲートが必須になる。
  evidence_tier: T3
  references:
    - "日本: 保険業法第130条、平成8年大蔵省告示第50号"
    - "米国: NAIC Risk-Based Capital"
  markets: [JP, US]
  review: {status: verified}

# --- Z メタ -------------------------------------------------------------------

Z14:
  formula: "assert all(available_at <= t) for すべての参照データ"
  inputs: [available_at, evaluation_timestamp]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（真偽検査）"
  missing_bias: >-
    **available_at が記録されていないデータは検査できない。** つまり
    「検査に通った」ではなく「検査できなかった」状態が、通過として扱われる危険がある。
    available_at が無いソースは、それ自体を不合格として扱う。
  correlated_with: [Z04, Z05, Z06, Z07]
  economic_rationale: >-
    これはパラメータというより**検証機構**である。統計的エッジとは無関係。
    PIT 違反は 1件でも通すと、そのバックテスト結果全体が信用できなくなる
    （catalog §8-1）。実測では companyfacts で同一 (tag, 期間) の 91% が複数回提出され、
    AAPL の2009年6月期の純利益は 1,229 と 1,828 で 48.7% 違った。
    **素直に読むと必ず踏む罠**なので、検査を自動化する以外に防ぐ方法がない。
  evidence_tier: T3
  references:
    - "https://www.hec.ca/finance/Fichier/McLean.pdf"
    - "実測: docs/03_data_feasibility.md §2.1"
  markets: [JP, US]
  review: {status: verified}

# =============================================================================
# O カテゴリ（ネグレクト）全24件 + B カテゴリの buy=main 12件の完全検証
#
# O は 263AT の戦略の中核（LAW-79「大手が入れない場所を探せ」）でありながら
# verified 0 件だった。ここには他のカテゴリに無い固有の問題が3つある。
#
#  (1) **「カバレッジ0」と「データ欠損」が原理的に区別できない。**
#      日本の小型株の62%は無カバーで、そもそも予想データベースに行が存在しない。
#      欠損を「カバレッジ0＝加点」と扱うと、単にデータが無い銘柄を買うことになる。
#  (2) **ネグレクトは他の全パラメータの信頼度を下げる。** 誰も見ていない銘柄は
#      開示も薄く、Z01（欠損率）が高い。O で加点しながら Z01 で減点する構造になる。
#  (3) **T13（理解可能性ゲート）と正面から衝突する。** 開示が薄いほど LLM が
#      説明できず不合格になるが、それはまさに狙っている銘柄である。
#
# これらは「解決した」のではなく「明示した」。閾値は Phase 1 で較正する（OQ-23）。
# =============================================================================

O01:
  formula: "アナリスト予想を提出している証券会社の実人数"
  inputs: [EST_analyst_count]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（カウント）"
  missing_bias: >-
    **このカテゴリ最大の問題。日本の小型株の62%は予想データベースに行が存在しない。**
    「カバレッジ0」と「データが取れていない」が区別できず、欠損を0とみなすと
    データ整備の穴を買っていることになる。対策は2つ: (a) データベースの
    ユニバース定義を確認し「収録されているがカバレッジ0」と「未収録」を分ける、
    (b) 分けられないなら O03/O04/O08/O12 など予想データに依存しない代理変数を主に使う。
  correlated_with: [O02, O03, O10, O12, O14, O19, J05, N10, N11]
  economic_rationale: >-
    LAW-27（見捨てられた企業効果）の中核。カバーするアナリストが少ないほど公開情報の
    拡散が遅く、価格発見が不完全になる（L03-L05 の価格遅延と同じ現象を別角度から測っている）。
    **263AT にとってこれは単なる1パラメータではなく、ユニバース選定の思想そのもの。**
    ただし「見られていない」ことと「見る価値がない」ことは区別できないので、
    B/C カテゴリ（クオリティ・成長）との交互作用でのみ意味を持つ。
  evidence_tier: T2
  references:
    - "https://www.osam.com/Commentary/microcaps-factor-spreads-structural-biases-and-the-institutional-imperative"
    - "https://en.wikipedia.org/wiki/Neglected_firm_effect"
    - "https://note.com/tatsuya_sabato/n/nf1005ea7bace?hl=en"
  markets: [JP, US]
  review: {status: verified}

O02:
  formula: "1 if 過去12ヶ月に新規にカバレッジを開始した証券会社がある else 0"
  inputs: [EST_analyst_count]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: >-
    O01 と同じ。加えて**データベースへの収録開始と、実際のカバレッジ開始が区別できない**。
    ベンダーが対象を広げただけで「新規カバー」と誤判定する。収録開始日を別途持つ必要がある。
  correlated_with: [O01, O16, O17, O18, O19]
  economic_rationale: >-
    **無名から発見への遷移が最も儲かる瞬間**という仮説の直接的な代理変数。
    証券会社がカバーを始めるのは、機関投資家からの需要が生まれたか、
    企業が IR に投資し始めたかのどちらか。いずれも流動性と価格発見の改善に先行する。
    O11/O16（発見トリガー）の構成要素。
  evidence_tier: T2
  references:
    - "https://www.osam.com/Commentary/microcaps-factor-spreads-structural-biases-and-the-institutional-imperative"
  markets: [JP, US]
  review: {status: verified}

O03:
  formula: "米国: 13F 集計保有株数 / 発行済株式数。日本: 信託銀行・投資信託の保有比率"
  inputs: [SEC_13F, EDINET_shareholders, SHARES]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "SHARES > 0 なので問題ない。"
  missing_bias: >-
    **米国の 13F は45日遅れ**（spec §1.2）で、しかも運用額1億ドル以上の機関のみが提出義務を負う。
    小型株を持つ小さなファンドは提出しないので、**小型株ほど機関保有が過小に見える**
    — つまり測りたい方向に都合よく偏るという、最も注意すべき形のバイアス。
    日本は年1回の大株主開示なので解像度がさらに粗い。
  correlated_with: [O01, O10, O12, O13, O20, O21, O22, O23, K22, K23, K51]
  economic_rationale: >-
    機関投資家が持っていない銘柄は、機関の情報生産（アナリスト・IR面談・モデル）の
    対象外にある。LAW-27 / LAW-50（限定的裁定）の直接測定。
    **OSAP の RIO_* 系（O20-O23、t=2.5-4.9）は、この変数を他のアノマリーに掛けると
    効果が増幅することを示しており、263AT が O10 を「乗数として使う」という設計の
    実証的裏づけになっている。**
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP RIO_MB t=4.9 / RIO_Volatility t=4.4 — 残差機関保有との交互作用"
  markets: [JP, US]
  review: {status: verified}

O04:
  formula: "count(ニュース記事, 直近90日)"
  inputs: [NEWS]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（カウント）"
  missing_bias: >-
    **同じ記事が複数媒体に転載されるので重複除去が必須**（T01 と同じ問題）。
    また日本語と英語で媒体数が違うため、日米を同じ尺度で比較できない。
    O カテゴリは rank_all（全体ランク）を既定にしているが、**この変数だけは
    市場内ランクにすべき可能性が高い**（要検証）。
  correlated_with: [O01, O05, O06, O10, O15, T01]
  economic_rationale: >-
    注目度の直接測定。ゼロに近いほど良い。ただし上場企業として最低限の開示は必要なので、
    極端にゼロだと開示不全（E17 透明性の低さ）の可能性がある。
    LAW-93（個人は注目銘柄を買い越す）の逆を行くための変数でもある。
  evidence_tier: T3
  references:
    - "https://faculty.haas.berkeley.edu/odean/papers%20current%20versions/allthatglitters_rfs_2008.pdf"
  markets: [JP, US]
  review: {status: verified}

O05:
  formula: "検索ボリューム指数（企業名・ティッカー）の直近水準と急増率"
  inputs: [search_trends]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "指数がゼロの期間があるため、急増率は分母に下限を置く。"
  missing_bias: >-
    検索指数は**相対値で正規化されており銘柄間で直接比較できない**。
    また小型株は検索数が少なすぎて指数がゼロ固定になることが多く、
    「注目ゼロ」と「測定限界以下」が区別できない（O01 と同型の問題）。
  correlated_with: [O04, O06, O07, O15, X05]
  economic_rationale: >-
    **企業名検索の急増は個人の飛び付きの直接証拠**であり、LAW-93 の逆指標として使う。
    製品名検索（X05）は需要の先行指標なので符号が逆になる点に注意。
    両者を混ぜると打ち消し合うので、必ず分けて持つ。
  evidence_tier: T2
  references:
    - "https://faculty.haas.berkeley.edu/odean/papers%20current%20versions/allthatglitters_rfs_2008.pdf"
    - "https://www.openassetpricing.com/"
  markets: [JP, US]
  review: {status: verified}

O06:
  formula: "count(SNS・掲示板での言及, 直近30日) を過去平均で正規化"
  inputs: [NEWS, social_mentions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "過去平均がゼロの銘柄は正規化できない。生のカウントで代替する。"
  missing_bias: >-
    取得元によってカバー範囲が全く違う。**日本の株式掲示板と X では母集団が別**。
    さらに **§4（セキュリティ）で指摘した通り、このデータは第三者が容易に書ける** ので、
    仕込みによる操作を前提に扱う必要がある。単独で大きな重みを与えてはならない。
  nonlinear: "abs_dev(x_star=sector_median)"
  correlated_with: [O04, O05, O07, O15, T01, I06]
  economic_rationale: >-
    ∩型。適度な言及は流動性と発見の証拠だが、**急増は個人の飛び付き＝天井のサイン**。
    LAW-74（人の行く裏に道あり）と LAW-93 の実装。I06（MAX効果）と同じ現象を
    価格ではなく言及量で捉えている。
    **セキュリティ上、匿名テキストなので T36（発信源の信頼度）を必ず通す。**
  evidence_tier: T3
  references:
    - "https://faculty.haas.berkeley.edu/odean/papers%20current%20versions/allthatglitters_rfs_2008.pdf"
    - "https://pages.stern.nyu.edu/~rwhitela/papers/max%20jfe.pdf"
  markets: [JP, US]
  review: {status: verified}

O07:
  formula: "言及の感情スコアの平均と分散（LLM 判定）"
  inputs: [social_mentions, LLM]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "言及数が少ない（例: 10未満）と統計にならないので欠損にする。"
  missing_bias: >-
    O06 と同じ取得元の偏り。加えて **LLM の感情判定は皮肉・逆張り投稿を誤判定しやすい**。
    日本語の掲示板は特にその傾向が強い。
  nonlinear: "abs_dev(x_star=sector_median)"
  correlated_with: [O06, T01, T03, I06]
  economic_rationale: >-
    ∩型。**全員が強気ということは、これから買う人がもういないということ。**
    分散（意見の割れ）は情報の非対称性の代理で、N11（アナリスト予想の分散）と同型。
    ただし O06 と同じくインジェクション耐性が低いので重みは小さく保つ。
  evidence_tier: T3
  references:
    - "https://arxiv.org/html/2510.03195v5"
    - "https://faculty.haas.berkeley.edu/odean/papers%20current%20versions/allthatglitters_rfs_2008.pdf"
  markets: [JP, US]
  review: {status: verified}

O08:
  formula: "-log( mean(VOLUME, 20d) / mean(VOLUME, 250d) )"
  inputs: [VOLUME]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "250日平均がゼロなら J10 で既に除外されている。ゼロ時は欠損。"
  missing_bias: 上場250営業日未満で欠損。分割時の出来高調整漏れで飛ぶ（spec §9-4）。
  correlated_with: [H07, J09, J14, J22, O04, O15]
  economic_rationale: >-
    「誰も見ていない」を価格側から検証する。O01/O03/O04 は情報の供給側（アナリスト・機関・報道）を
    測るのに対し、これは需要側の静けさを測る。**両者が一致したときにネグレクトの確度が上がる**ので、
    O10（複合スコア）の構成要素として使う。H06（悲観の極み）の入力でもある。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP VolumeTrend t=3.0 / zerotrade 系との関連"
  markets: [JP, US]
  review: {status: verified}

O09:
  formula: "説明会の開催頻度・IR資料の更新頻度から LLM が 0-10 で採点"
  inputs: [LLM, IR_pages]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: >-
    **IR ページの構造が企業ごとにバラバラでスクレイピングの成否が偏る。**
    大企業ほど整備されており取得しやすいので、小型株が不当に低評価になる方向。
    取得失敗と「活動が無い」を区別する必要がある（O01 と同型）。
  correlated_with: [O17, O18, E17, T10, N30]
  economic_rationale: >-
    「無名だが発信意欲がある企業」を選り分ける。ネグレクト銘柄の中には
    (a) 本当に誰も知らないだけの優良企業と、(b) 情報を出す気がない企業がある。
    後者は永遠にネグレクトのままで、バリュエーションの是正が起きない。
    **O カテゴリで加点した銘柄が「万年割安」で終わらないためのフィルタ。**
  evidence_tier: T3
  references:
    - "構造的判断。O11/O16（発見トリガー）と組で使う前提"
  markets: [JP, US]
  review: {status: verified}

O10:
  formula: "mean( z(-O01), z(-O03), z(-O04), z(-J05) )"
  inputs: [O01, O03, O04, J05]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "構成要素が2つ未満しか計算できない場合は欠損。"
  missing_bias: >-
    構成要素の欠損を継承する。**O01 が62%欠損する日本では実質 O03/O04/J05 の3変数になる。**
    市場によって中身が変わる複合指標なので、日米で別々に構築して比較すること。
  correlated_with: [O01, O03, O04, O12, J05, J06]
  economic_rationale: >-
    **加算ではなく乗数として使うのが本来の姿。** OSAP の RIO_* 系（O20-O23）が示す通り、
    ネグレクトは単独のリターン源というより、**他のアノマリーの効き目を増幅する条件**である
    （LAW-50 限定的裁定）。§5 の初期重み表で O に 0.11 を与えているが、
    それは加算分であって、本命は N06（注目度調整PEAD）のような交互作用項。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.osam.com/Commentary/microcaps-factor-spreads-structural-biases-and-the-institutional-imperative"
  markets: [JP, US]
  review: {status: verified}

O11:
  formula: "1 if O10 が上位分位 かつ (O02 or M08 or N07 or K23 のいずれか) else 0"
  inputs: [O10, O02, M08, N07, K23]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: 構成要素の欠損を継承。M08（大量保有報告）は日本、K23（13F変化）は米国に偏る。
  correlated_with: [O10, O16, O02, M08, M11, N07]
  economic_rationale: >-
    **「無名 × 発見の芽」が 263AT の理想形。** 単独の無名は永遠に無名かもしれない（O09 の議論）。
    誰かが動き始めた証拠（新規カバー・大量保有報告・上方修正・機関保有増）と組み合わせて
    初めて、バリュエーション是正のタイミングが読める。
    ただし**ブール値なので情報量が少なく、閾値の設定が結果を大きく左右する。**
  evidence_tier: T3
  references:
    - "構造的判断。O02/M08/N07/K23 の各実証を組み合わせた合成仮説であり、複合としての実証は無い"
  markets: [JP, US]
  review: {status: verified}

O12:
  formula: "1 - sigmoid( 円換算時価総額と J01 から推定した『機関が投資可能』な確率 )"
  inputs: [J05, J01, J06]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: "J01/J05 の欠損を継承。上場20営業日未満で欠損。"
  correlated_with: [J01, J02, J05, J06, O03, O13]
  economic_rationale: >-
    **LAW-79「大手が入れない場所を探せ」の直接実装であり、263AT のコアユニバース定義そのもの。**
    O03（実際に機関が持っていない）が結果を測るのに対し、これは原因（構造的に持てない）を測る。
    ファンドには最低投資額と流動性の制約があり、時価総額が小さすぎる銘柄は
    **たとえ割安だと分かっていても買えない。** この構造は運用資産が増えない限り解消しないので、
    他のアノマリーと違って裁定で消えにくい。
    OQ-17 の実測（マイクロキャップ除外でも残存率61%）は、この前提を支持している。
  evidence_tier: T2
  references:
    - "https://www.osam.com/Commentary/microcaps-factor-spreads-structural-biases-and-the-institutional-imperative"
    - "https://acuitasinvestments.com/wp-content/uploads/2025/09/Acuitas-The-Case-for-Microcap_2025.pdf"
  markets: [JP, US]
  review: {status: verified}

O13:
  formula: "指数連動ファンドの推定保有株数 / 浮動株数"
  inputs: [index_membership, fund_AUM, SHARES]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "浮動株数がゼロなら J07 で既に除外されている。"
  missing_bias: >-
    **推定でしか出せない**（各 ETF の構成比 × AUM の積み上げ）。
    小型株ほど組入 ETF が少なく推定精度が落ちる。日本は GPIF 経由の間接保有もあり、より不透明。
  correlated_with: [O03, O12, K12, K13, K26, K46]
  economic_rationale: >-
    パッシブ保有が多い銘柄は、個別の材料より指数フローで動く。
    価格発見が個別要因で行われないので、ファンダメンタル分析の効き目が落ちる。
    **K12（TOPIX 構成銘柄の縮小）と組み合わせると、
    「これからパッシブ需給が消える銘柄」＝価格発見が個別要因に戻る銘柄が特定できる。**
  evidence_tier: T3
  references:
    - "https://www.jpx.co.jp/english/equities/follow-up/02.html"
  markets: [JP, US]
  review: {status: verified}

O14:
  formula: "決算説明会で質問した固有アナリストの実人数"
  inputs: [LLM, earnings_call_transcript]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（カウント）"
  missing_bias: >-
    **書き起こしが手に入る企業に強く偏る。** 米国はほぼ全社取得可能だが、
    日本の小型株はほぼ取得不能（03_data_feasibility.md）。**日本では事実上使えない。**
  correlated_with: [O01, O02, T05, T06, N30]
  economic_rationale: >-
    O01（カバレッジ数）の実質版。予想を出しているだけで実際には見ていないアナリストを除ける。
    **「形式的なカバー」と「本当に関心を持たれている」を区別する**という点で
    O01 より情報量が多いが、データ制約で日本では使えないのが痛い。
  evidence_tier: T3
  references:
    - "https://www.tandfonline.com/doi/full/10.1080/09638180.2023.2244009"
  markets: [US]
  review: {status: verified}

O15:
  formula: "count(ニュース記事, 90d) / 実現ボラティリティ(90d)"
  inputs: [O04, I01]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "ボラがゼロ（値が動いていない）銘柄は流動性ゲートで既に除外される。"
  missing_bias: O04 と I01 の欠損を継承。
  correlated_with: [O04, O05, I01, L03, L04]
  economic_rationale: >-
    **「動いているのに報じられていない」の検出。** 価格が動くには何か理由があるはずで、
    報道が無いのに動いているなら、情報が一部の参加者にしか届いていない可能性がある。
    L03-L05（価格遅延）と同じ現象を、価格ではなく情報供給側から見ている。
  evidence_tier: T3
  references:
    - "構造的判断。L カテゴリ（情報伝播）の実証と整合するが、この形での実証は無い"
  markets: [JP, US]
  review: {status: verified}

O16:
  formula: "1 if 出来高・株主数・カバレッジ・機関保有 のうち2つ以上が同時に上昇 else 0"
  inputs: [J14, K34, O01, O03]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: >-
    株主数（K34）は年1回開示なので**判定の解像度が年単位**になる。
    構成要素の更新頻度がバラバラ（出来高は日次、13F は四半期、株主数は年次）で、
    「同時」の定義が曖昧。**時間窓を明示的に決める必要がある（暫定: 12ヶ月）。**
  correlated_with: [O02, O10, O11, O17, O18, J14, K34, K51]
  economic_rationale: >-
    O11 の具体化。**無名から発見への遷移点**を複数の独立な証拠の一致で捉える。
    単一指標だとノイズだが、性質の違う4つが同時に動くのは偶然では起きにくい。
    ただし**構成要素の更新頻度差により、実際には「同時」を観測できていない可能性がある**
    のが弱点。Phase 1 で時間窓を較正する。
  evidence_tier: T3
  references:
    - "構造的判断。合成仮説であり、この形での実証は無い"
  markets: [JP, US]
  review: {status: verified}

O17:
  formula: "1 if 過去24ヶ月に英文の決算資料・適時開示を新規に開始した else 0"
  inputs: [IR_pages, LLM]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: >-
    **日本株専用。** 米国株では常に真になるので情報量がゼロ。markets を JP に限定する。
    過去の IR ページの状態を遡って知る手段が無いので、**今日から記録を始めるしかない**
    （T/X カテゴリと同じ前向き記録の問題）。
  correlated_with: [M17, O09, O18, K11, E17]
  economic_rationale: >-
    **外国人投資家がアクセスできるようになった瞬間**を捉える。
    日本の小型株の外国人保有比率が低い（K11）理由の一つは、単に英語の情報が無いこと。
    英文開示の開始は、企業が海外投資家を意識し始めた行動の証拠であり、
    需給の変化に先行する。東証も英文開示を要請しており制度的な追い風がある。
  evidence_tier: T3
  references:
    - "https://www.jpx.co.jp/english/equities/follow-up/02.html"
    - "https://corpgov.law.harvard.edu/2025/10/21/tokyo-stock-exchange-initiative-on-cost-of-capital-and-stock-price-conscious-management/"
  markets: [JP]
  review: {status: verified}

O18:
  formula: "1 if 個人投資家向け説明会・スモールミーティングを新規に開始した else 0"
  inputs: [IR_pages, LLM]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: >-
    O09 と同じくスクレイピング依存。**過去に遡れないので前向き記録が必要**（O17 と同型）。
  correlated_with: [O09, O16, O17, M16, N30]
  economic_rationale: >-
    O09（IR活動の水準）の変化版。**企業が「発見される準備」を始めた行動証拠。**
    水準より変化の方が情報量が多いのは B18/B29/D26 と同じ構図。
    ただしブール値かつ取得が不安定なので、単独では弱い。O16 の構成要素として使う。
  evidence_tier: T3
  references:
    - "構造的判断。O09 と同じ論拠"
  markets: [JP, US]
  review: {status: verified}

O19:
  formula: "1 if アナリスト数が前年同期比で減少 else 0（または減少数）"
  inputs: [EST_analyst_count]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "前年のカバレッジが0なら減少は定義できない。欠損にする。"
  missing_bias: >-
    O01 と同じ62%問題。加えて**ベンダーがカバー対象を絞った場合も「減少」に見える**。
    証券会社の撤退・統合による減少と、個別企業への関心低下による減少を区別できない。
  correlated_with: [O01, O02, O14, N10, N12]
  economic_rationale: >-
    **符号に注意。O02（カバレッジ開始）が正なら、対称に考えると減少は負のはずだが、
    OSAP の `ChNAnalyst` は t=3.3 で「減少した銘柄が上昇する」向きに効く。**
    解釈は、カバレッジ減少が O01（ネグレクト）を強める方向に働くから。
    つまり O02（発見の始まり）と O19（忘れられていく）は**どちらも正のリターンを予測しうる**
    という一見矛盾した関係にある。これは§1.9 が「相関する変数も両方残す」と決めている
    理由の実例で、統合せず両方持って縮小に任せる。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP ChNAnalyst — Decline in Analyst Coverage, t=3.3"
  markets: [JP, US]
  review: {status: verified}

O20:
  formula: "residual( 機関保有比率 ~ log(MCAP) ) × (EQ / MCAP)"
  inputs: [O03, J05, A03]
  period_convention: POINT
  consolidation: consolidated
  accounting_standard_note: "A03（B/P）の会計基準差を継承する。IFRS ののれん非償却で B/P が高く出る点に注意。"
  zero_denominator_policy: "MCAP > 0。EQ<0（債務超過）は D02/D08 のゲートで除外される。"
  missing_bias: "O03 と A03 の欠損を継承。13F の45日遅れが効く。"
  correlated_with: [O03, O10, O21, O22, O23, A03, K22]
  economic_rationale: >-
    **サイズで調整した残差機関保有 × バリュー。** 機関保有が低いのは単に小型だからではなく、
    「同じサイズの他社と比べても持たれていない」ことを測る。それを B/P に掛けると、
    **裁定が効きにくい場所にあるバリュー株**が特定される（LAW-50）。
    OSAP で t=4.9 と、O カテゴリで最も強い実証を持つ。
    **263AT が O10 を「加算ではなく乗数」として設計した判断の、最も直接的な裏づけ。**
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP RIO_MB — Inst Own and Market to Book, t=4.9"
  markets: [JP, US]
  review: {status: verified}

O21:
  formula: "residual( 機関保有比率 ~ log(MCAP) ) × IdioVol"
  inputs: [O03, J05, I04]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: "O03 と I04 の欠損を継承。上場60営業日未満で IdioVol が計算できない。"
  correlated_with: [O03, O20, O22, O23, I04, I29]
  economic_rationale: >-
    **符号の解釈が難しい変数。** I04（特異ボラ）は単独では負の符号（高IVOLは劣後）だが、
    機関保有が低い銘柄に限ると正になる、というのが OSAP `RIO_Volatility`（t=4.4）の主張。
    理屈は、高IVOL は裁定の障害であり、機関がいない場所ではミスプライシングが残るため。
    **単独の I04 と符号が食い違うので、必ず交互作用項として持ち、I04 単独と併存させる。**
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP RIO_Volatility — Inst Own and Idio Vol, t=4.4"
  markets: [JP, US]
  review: {status: verified}

O22:
  formula: "residual( 機関保有比率 ~ log(MCAP) ) × 回転率"
  inputs: [O03, J05, J23]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: "O03 と J23 の欠損を継承。"
  correlated_with: [O03, O20, O21, O23, J23, J24]
  economic_rationale: >-
    O20/O21 と同じ構造で、掛ける相手が回転率。OSAP `RIO_Turnover` t=2.7 で
    RIO_* 系の中では弱い。**4つの RIO 変数はほぼ同じ「機関不在」成分を共有するので、
    相関が高く、縮小をかけると1本にまとまる可能性が高い**（Z12 の主成分分析で確認する）。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP RIO_Turnover t=2.7"
  markets: [JP, US]
  review: {status: verified}

O23:
  formula: "residual( 機関保有比率 ~ log(MCAP) ) × アナリスト予想の分散"
  inputs: [O03, J05, N11]
  period_convention: GUIDE_CONS
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "予想が2件未満だと分散が定義できない。欠損にする。"
  missing_bias: >-
    **N11（予想分散）を使うので、日本の小型株では計算できない。**
    O カテゴリなのに、ネグレクトが最も強い銘柄で欠損するという自己矛盾を抱える。
    日本では K33（四季報予想と会社予想の乖離）で代替できないか検討する（OQ-22 と同根）。
  correlated_with: [O03, O20, O21, O22, N11, N10]
  economic_rationale: >-
    予想の割れは情報の非対称性の代理。機関不在と組み合わせると、
    「誰も見ておらず、見ている少数も意見が割れている」＝価格発見が最も不完全な状態を指す。
    OSAP `RIO_Disp` t=2.5。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP RIO_Disp — Inst Own and Forecast Dispersion, t=2.5"
  markets: [JP, US]
  review: {status: verified}

O24:
  formula: "(現在日 - 上場日) / 365.25"
  inputs: [listing_date]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: >-
    上場日は銘柄マスタから取れるが、**再上場・市場変更・持株会社化で上場日が変わる**ため、
    実質的な企業年齢と一致しないことがある。日本の持株会社移行は特に多い。
  correlated_with: [N24, N25, G34, O01, J05]
  economic_rationale: >-
    **符号が N24（上場後経過年数、正）と逆に見えるが、両者は別の概念。**
    N24 は「IPO 直後の長期劣後（LAW-48）」を捉えるので若い企業を減点する。
    O24（OSAP `FirmAge` t=2.5）は「若い企業ほど情報が少なく劣後する」を捉える。
    実は同じ方向で、**カタログで O24 を negative としているのは
    「年齢が大きいほど売り」ではなく「年齢が小さいほど劣後」の意**。
    符号の記述が紛らわしいので、Phase 1 の実測で向きを確定させる（要注意項目）。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP FirmAge t=2.5"
  markets: [JP, US]
  review: {status: verified}

# =============================================================================
# B カテゴリ（収益性・クオリティ）の buy=main、未検証12件
# 初期重み 0.20 で全カテゴリ中最大。長期複利の本体（LAW-43）。
# =============================================================================

B01:
  formula: "NI_TTM / EQ_AVG"
  inputs: [NI, EQ]
  period_convention: AVG
  consolidation: consolidated
  accounting_standard_note: >-
    **分母は期首期末平均（AVG）。** 増資・自社株買いで期中に自己資本が大きく動く企業では、
    期末値を使うと ROE が歪む。日本基準はのれん償却後の NI なので IFRS 企業より低く出る。
  zero_denominator_policy: >-
    **EQ<=0（債務超過）では ROE が意味を失う。** 負の自己資本で負の利益だと ROE が正になる
    という符号の逆転が起きるため、EQ<=0 は必ず欠損にする。D02 のゲートでも除外されるが、
    スコア計算側でも二重に防ぐ。
  missing_bias: 債務超過企業で欠損。つまり欠損自体が強いネガティブ情報を持つ（Z01 で拾う）。
  correlated_with: [B02, B03, B05, B16, B40, C09, A34]
  economic_rationale: >-
    株主資本1円あたりいくら稼ぐか。**ただしレバレッジで水増しできる**のが最大の弱点で、
    B05（デュポン分解）で利益率・回転率・レバレッジに分けないと、
    借金を増やしただけの企業を「高クオリティ」と誤判定する。
    B03（ROIC）が資本構成に中立なのに対し、B01 は株主目線という違いがある。両方持つ。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP RoE t=4.5"
    - "http://www.econ.yale.edu/~shiller/behfin/2013_04-10/asness-frazzini-pedersen.pdf"
  markets: [JP, US]
  review: {status: verified}

B03:
  formula: "EBIT_TTM * (1 - TAXR) / IC_AVG"
  inputs: [EBIT, TAXR, IBD, EQ, CASH]
  period_convention: AVG
  consolidation: consolidated
  accounting_standard_note: >-
    **ROIC は定義の揺れが最も大きい指標。** IC を「IBD + EQ - CASH」に固定する（spec §2）。
    「超過現金のみ控除」版も別に持って比較する（spec §2 の注）。
    IFRS16 でリース負債が IBD に入ると IC が膨らみ ROIC が下がるので、Z07 の年は注意。
  zero_denominator_policy: >-
    **IC がゼロ・負になる企業が実在する**（ネットキャッシュが自己資本を超える）。
    その場合 ROIC は意味を失うので欠損にし、A16/A17（実質PER）で評価する。
  missing_bias: ネットキャッシュ潤沢な小型株で欠損しやすい。**それは 263AT が狙う銘柄と重なる**。
  correlated_with: [B01, B04, B12, B13, B40, C08, A14, A42]
  economic_rationale: >-
    **長期複利の本体。** `長期リターン ≈ ROIC × 再投資率`（C08、LAW-43）の第1項。
    資本構成に中立なので、B01 と違ってレバレッジで水増しできない。
    Buffett の超過収益が QMJ で説明できる（LAW-119）という実証も、
    突き詰めれば「高 ROIC を安く買う」に還元される。
  evidence_tier: T2
  references:
    - "http://www.econ.yale.edu/~shiller/behfin/2013_04-10/asness-frazzini-pedersen.pdf"
    - "https://www.nber.org/system/files/working_papers/w19681/w19681.pdf"
    - "https://mysimon.rochester.edu/novy-marx/research/OSoV.pdf"
  markets: [JP, US]
  review: {status: verified}

B04:
  formula: "B03 - WACC"
  inputs: [B03, WACC]
  period_convention: AVG
  consolidation: consolidated
  accounting_standard_note: "B03 の会計基準差を継承。WACC の推定にはベータ（I05）が要るので株価データにも依存する。"
  zero_denominator_policy: "na（差分）。WACC の推定が不能なら欠損。"
  missing_bias: >-
    **WACC の推定が最大の不確実性。** ベータ・株式リスクプレミアム・負債コストの
    どれも推定値で、業種平均で代用すると個社の実態から離れる。
    日本は東証が「資本コストを意識した経営」を要請しており、**企業自身が開示した WACC がある場合は
    それを優先する**（F22 と連携）。
  correlated_with: [B03, B12, C07, C08, C39, A42, F22]
  economic_rationale: >-
    **正なら成長が価値を生み、負なら成長するほど価値を壊す。**
    C カテゴリ（成長性）の符号を決める条件変数であり、
    **成長率を単独で加点してはいけない理由そのもの。** C07（再投資率）、C39（投資/売上）、
    N33（大型設備投資）はすべて B04 との交互作用で符号が変わる。
    LAW-32（資産成長アノマリー）が「投資しすぎは劣後」を示すのは、
    平均的な企業の B04 が小さいからだと解釈できる。
  evidence_tier: T2
  references:
    - "https://images.aqr.com/-/media/AQR/Documents/Insights/Journal-Article/The-Limits-to-Arbitrage-Revisited-The-Accrual-and-Asset-Growth-Anomalies.pdf"
    - "https://www.jpx.co.jp/english/equities/follow-up/02.html"
  markets: [JP, US]
  review: {status: verified}

B09:
  formula: "(CFO_TTM - CAPEX_TTM) / REV_TTM"
  inputs: [CFO, CAPEX, REV]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    IFRS16 適用企業はリース料が CFO から財務CFへ移り FCF が嵩上げされる。
    基準変更年（Z07）は不連続。A09（FCF利回り）と同じ注意。
  zero_denominator_policy: "REV<=0（売上ゼロのバイオ等）は欠損。C16/U34 で評価する。"
  missing_bias: 四半期CF開示のない企業で欠損。日本の小型株にやや偏る。
  correlated_with: [A09, B10, B28, C05, B08]
  economic_rationale: >-
    売上1円からいくら現金が残るか。**利益率（B08）が会計上の概念なのに対し、これは現金。**
    成長投資期の企業では低く出るので、C07（再投資率）と B04 とセットで解釈しないと
    優良な成長企業を排除する（A09 と同じ注意）。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP CBOperProf — Cash-based operating profitability, t=3.2"
    - "https://mysimon.rochester.edu/novy-marx/research/OSoV.pdf"
  markets: [JP, US]
  review: {status: verified}

B12:
  formula: "(NOPAT_t - NOPAT_{t-3}) / (IC_t - IC_{t-3})"
  inputs: [EBIT, TAXR, IBD, EQ, CASH]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "B03 の会計基準差を継承。3年差分なので Z06/Z07 のフラグ年を跨ぐと壊れる。"
  zero_denominator_policy: >-
    **分母（IC の3年変化）がゼロ近傍だと発散する。** 投資をしていない企業で頻発する。
    `abs(delta_IC) < 総資産の1%` なら欠損にする。これを忘れると無投資企業が異常値で上位に来る。
  missing_bias: 上場3年未満で欠損。M&A で IC が跳ねた企業では意味を持たない（C10/C28 と併読）。
  correlated_with: [B03, B04, B29, C07, C08, C36]
  economic_rationale: >-
    **最も前向きなクオリティ指標。** B03（平均 ROIC）は過去の蓄積を含むが、
    B12 は**直近に投じた資本の生産性**を測る。高 ROIC 企業が新規投資で稼げなくなっている場合、
    B03 は高いまま B12 が落ちる。C08（ROIC × 再投資率）の第1項を「限界」で見る版。
    ノイズが大きいので3年移動で平滑化する。
  evidence_tier: T3
  references:
    - "https://www.forbes.com/sites/bill_stone/2026/06/13/how-to-find-multibagger-stocks-before-they-soar/"
    - "実務家の指標であり、査読論文での直接の実証は確認できていない"
  markets: [JP, US]
  review: {status: verified}

B13:
  formula: "mean(ROIC, 5y) - k * sd(ROIC, 5y)、k は 0.5 を暫定"
  inputs: [B03]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "B03 を継承。5年間に会計基準変更（Z07）があると分散が過大になる。"
  zero_denominator_policy: "5年分の ROIC が3期未満しか計算できない場合は欠損。"
  missing_bias: >-
    **5年の履歴が要るので、上場5年未満の企業が丸ごと欠損する。**
    F02 と同じ問題で、ユニバースが暗黙に成熟企業へ偏る（Z03 で監視）。
  correlated_with: [B03, B14, B16, B39, B40]
  economic_rationale: >-
    **経済的堀（LAW-43、T14）の定量的な裏取り。** 高 ROIC が続くのは競争優位がある証拠で、
    続かないのは一時的な追い風だったということ。T14（LLM による堀の採点）と突合し、
    **矛盾したら LLM の物語ではなく実測を信じる**（catalog §8-5 の「物語への過剰適合」対策）。
    k の値は暫定で、Phase 1 で較正する。
  evidence_tier: T2
  references:
    - "http://www.econ.yale.edu/~shiller/behfin/2013_04-10/asness-frazzini-pedersen.pdf"
    - "https://www.nber.org/system/files/working_papers/w19681/w19681.pdf"
  markets: [JP, US]
  review: {status: verified}

B17:
  formula: "9項目の 0/1 合計（収益性4・レバレッジ流動性3・効率性2）"
  inputs: [NI, CFO, TA, IBD, EQ, REV, GP, SHARES]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    9項目のうち複数が前期比を取るため、**決算期変更（Z06）・会計基準変更（Z07）の年は
    スコアが無意味になる。** 該当年は欠損にする。
  zero_denominator_policy: "各項目の判定はブール値なので発散しないが、比率の分母がゼロの項目は0点として扱わず欠損にする。"
  missing_bias: 2期分のデータが要るので上場2年未満で欠損。9項目のうち3項目以上が計算不能なら全体を欠損。
  correlated_with: [B16, B41, B39, D23, E01, F01, A03]
  economic_rationale: >-
    **低PBR群の中で財務が改善している企業を選ぶ。** 単体で全銘柄に適用すると効果が薄まり、
    A03（低B/P）で絞ってから使うと最大化するというのが原論文の設計。
    「安い株の中から、安い理由が解消しつつあるものを選ぶ」というバリュートラップ回避の古典。
    **B41（Mohanram G-score）が成長株向けなのに対し、こちらはバリュー株向け**で用途が違う。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP PS — Piotroski F-score, t=5.6"
    - "https://link.springer.com/article/10.1007/s11156-024-01331-y"
  markets: [JP, US]
  review: {status: verified}

B18:
  formula: "GP_TTM/REV_TTM - mean(GP/REV, t-1..t-3)"
  inputs: [GP, REV]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    売上原価と販管費の区分変更があると粗利率が不連続になる。
    **区分変更は会計方針の変更（E21）として開示されるので、そのフラグが立つ年は欠損にする。**
  zero_denominator_policy: "REV<=0 は欠損。過去3年の平均が計算できない場合も欠損。"
  missing_bias: 上場4年未満で欠損。金融業は粗利率の概念が無いので常に欠損（U カテゴリで代替）。
  correlated_with: [B06, B07, B31, B36, B44, C25]
  economic_rationale: >-
    **水準（B07）より方向が効く**という、このカテゴリで繰り返し現れる構図。
    粗利率の改善は価格決定力の向上か原価低減の成功を意味し、どちらも持続しやすい。
    逆に悪化は競争激化の早期警告で、**売り判定で特に価値が高い**（sell=main にしている理由）。
    B36（価格転嫁力）と組み合わせると、改善が値上げ由来かコスト由来かを分離できる。
  evidence_tier: T2
  references:
    - "https://mysimon.rochester.edu/novy-marx/research/OSoV.pdf"
    - "https://www.openassetpricing.com/"
  markets: [JP, US]
  review: {status: verified}

B28:
  formula: "mean(FCF_t / NI_t, 過去5年)"
  inputs: [CFO, CAPEX, NI]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "A09/B09 と同じ IFRS16 の注意。5年間に基準変更があると比較不能。"
  zero_denominator_policy: >-
    **NI<=0 の年が含まれると比率が壊れる。** 各年の比率を計算してから平均するのではなく、
    **5年合計の FCF / 5年合計の NI** で計算する。5年合計 NI<=0 なら欠損。
  missing_bias: 上場5年未満で欠損（B13 と同じ偏り）。
  correlated_with: [A09, B09, B10, E01, E10, D23]
  economic_rationale: >-
    **B10（単年の現金化率）の長期版。** 単年は運転資本の振れで大きく動くが、
    5年平均で1を超える企業は本当に現金を生んでいる。
    E01（アクルーアル）が「利益の質が低い」を検出するのに対し、
    これは「利益の質が高い」を長期で確認する。長期保有（6M〜5Y）の設計と相性が良い。
  evidence_tier: T2
  references:
    - "https://images.aqr.com/-/media/AQR/Documents/Insights/Journal-Article/The-Limits-to-Arbitrage-Revisited-The-Accrual-and-Asset-Growth-Anomalies.pdf"
    - "https://www.openassetpricing.com/"
  markets: [JP, US]
  review: {status: verified}

B29:
  formula: "slope( ROIC, 過去5年 )"
  inputs: [B03]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "B03 を継承。"
  zero_denominator_policy: "5年分の ROIC が3期未満なら欠損。"
  missing_bias: B13 と同じ（上場5年未満で欠損）。
  correlated_with: [B03, B12, B13, B44, C06]
  economic_rationale: >-
    B13（水準と安定性）と直交する情報を持つ。**平均が高くても下降トレンドなら堀が崩れつつある。**
    B12（増分ROIC）が「直近の投資の生産性」を測るのに対し、B29 は全体の趨勢。
    ★1（実証が限定的）なので、§1.9 の事前スケール 0.15 で強く縮小される。
    **強い証拠がなければ 0 から動かない設計になっているので、残しても害は小さい。**
  evidence_tier: T3
  references:
    - "構造的判断。B13（ROIC持続性）の実証から派生した仮説であり、この形での直接の実証は無い"
  markets: [JP, US]
  review: {status: verified}

B41:
  formula: "8項目の 0/1 合計（ROA・CFO/TA・アクルーアル・収益の安定性・成長の安定性・R&D/TA・設備投資/TA・広告/TA）"
  inputs: [NI, CFO, TA, REV, RD, CAPEX, AdExp]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    R&D と広告費を独立開示しない企業が多く、**日本は特に広告費の開示が少ない。**
    8項目のうち3項目が計算できない銘柄が日本では多数出る。
  zero_denominator_policy: "TA>0。計算可能な項目が5項目未満なら全体を欠損にする。"
  missing_bias: >-
    **R&D・広告を開示する企業に偏る。** 日本の小型製造業では R&D 開示が薄く、
    B17（Piotroski）は計算できるが B41 は計算できない、という非対称が起きる。
  correlated_with: [B16, B17, B06, B25, C33, B39]
  economic_rationale: >-
    **B17 が低PBR（バリュー）群向けなのに対し、B41 は高PBR（成長）群向け。**
    成長株は現在の収益性が低いことが多く、Piotroski の基準では全滅する。
    G-score は代わりに「成長の安定性」と「無形投資の水準」を評価する。
    OSAP で t=9.1 と、複合会計指標では最上位。
    **バリューとグロースで別の品質指標を使うという発想自体が、263AT に欠けていた視点。**
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP MS — Mohanram G-score, t=9.1"
  markets: [JP, US]
  review: {status: verified}

B44:
  formula: "REV_TTM/TA_AVG - REV_{TTM,t-1}/TA_{AVG,t-1}"
  inputs: [REV, TA]
  period_convention: AVG
  consolidation: consolidated
  accounting_standard_note: >-
    IFRS16 でリース資産が TA に乗ると回転率が下がるので、**基準変更年は必ず不連続になる**。
    Z07 のフラグ年は欠損にする。
  zero_denominator_policy: "TA>0。前期の回転率が計算できない場合は欠損。"
  missing_bias: 上場2年未満で欠損。M&A で TA が跳ねた年は意味を持たない（C10 と併読）。
  correlated_with: [B11, B18, B29, B34, B35, C36]
  economic_rationale: >-
    **B11（水準）は業種特性に支配されるが、変化は個社の実力を反映する。**
    資産効率の改善は、既存資産からより多くの売上を上げているということで、
    追加投資なしの成長を意味する。B18（粗利率トレンド）と組み合わせると、
    デュポン分解（B05）の2成分の変化を同時に見られる。OSAP `ChAssetTurnover` t=5.1。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP ChAssetTurnover — Change in Asset Turnover, t=5.1"
  markets: [JP, US]
  review: {status: verified}

# =============================================================================
# A カテゴリ（バリュエーション）主力16件 + C カテゴリ（成長性）主力20件
#
# C の検証で最も重要だったのは、**カテゴリ内で符号が真っ二つに割れている**ことの整理。
#
#   C02-C15  売上・利益・FCF・受注残の成長  → positive（成長は良い）
#   C29-C38  資産・設備・自己資本・従業員の成長 → negative（成長は悪い）
#
# これは矛盾ではなく、**アウトプットの成長は良く、インプットの成長は悪い**という区別である。
# 同じ「成長」という語で呼んでいたために、カタログ上は矛盾して見えていた。
#
#   アウトプット（売上・利益・現金） が増える   → 価値が増える
#   インプット（資産・資本・人員）  が増える   → 資本が拘束される。ROIC が薄まる
#   両者の比 の改善                          → B44（総資産回転率の変化）
#
# そして C08（ROIC × 再投資率）だけがこの2つを橋渡しする。
# **再投資率が高いことは、B04（ROIC - WACC）が正の企業でのみ良い。**
# 負の企業の再投資は C35（資産成長アノマリー）が示す通り価値破壊であり、
# だから C07/C29/C39/N33 はすべて B04 との交互作用が必須になる。
# =============================================================================

# --- A バリュエーション -------------------------------------------------------

A02:
  formula: "EPS_GUIDE / PRICE"
  inputs: [EPS_guidance, PRICE]
  period_convention: GUIDE_CO
  consolidation: consolidated
  accounting_standard_note: >-
    **日本は会社予想が義務開示、米国のガイダンスは任意。** 同じ「予想益回り」でも
    日本は全銘柄で会社予想が取れ、米国は出さない企業が多くコンセンサスで代替することになる。
    **同一 ID で日米の中身が違うのは危険**なので、GUIDE_CO 版と GUIDE_CONS 版を
    別 ID に分けるべき（OQ-22 と同根）。現状は GUIDE_CO を割り当てている。
  zero_denominator_policy: "PRICE>0。予想が赤字なら負のまま保持（A01 と同じく E/P の向きで持つ）。"
  missing_bias: >-
    **米国では予想を出さない企業が体系的に欠損する。** 出さないのは不確実性が高い企業に
    偏るので、欠損自体が弱いネガティブ情報を持つ。日本では義務開示なのでほぼ欠損しない
    — **これは日本株を扱う数少ない構造的な優位**（LAW-114）。
  correlated_with: [A01, A17, A26, N09, N31, N10]
  economic_rationale: >-
    A01（実績益回り）が過去を見るのに対し、これは市場が織り込むべき将来を見る。
    日本では会社予想が保守的に出される傾向があり（N09）、**予想益回りが高い銘柄の中には
    「保守的な予想を出す企業」が混じる**。N09（予想の保守性）で調整して初めて実力が見える。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP sfe — Earnings Forecast to price, t=5.0"
    - "https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf"
  markets: [JP, US]
  review: {status: verified}

A10:
  formula: "(DIV_PAID_TTM + BUYBACK_TTM) / MCAP"
  inputs: [DIV_PAID, BUYBACK, MCAP]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    自社株買いは**キャッシュフロー計算書の実額**を使う（発表額ではない。F03/F04 参照）。
    日本は月次で自己株式取得状況が開示されるので合算が要る。米国は 10-Q から直接取れる。
  zero_denominator_policy: "MCAP>0。無配・無買戻しはゼロで正当（欠損にしない）。"
  missing_bias: >-
    **日本は自社株買いの実額集計に月次開示のスクレイピングが要る**ので、
    取得が不安定な小型株で欠損しやすい。欠損を「還元ゼロ」と扱うと過小評価になる。
  correlated_with: [A11, A32, F03, F04, F10, F26, F31]
  economic_rationale: >-
    配当単独（A11）より予測力が高い。理由は、企業が株主に現金を返す方法は配当と自社株買いの
    2つあり、片方だけ見ると還元姿勢を測り損ねるから。O'Shaughnessy の大規模検証では
    1928-2009 で大型株を年1.18%上回り、自社株買いを加えるとさらに1.92%上乗せされた（LAW-120）。
    **F26（純外部資金調達）と符号が逆の同じ概念**で、企業が現金を出しているか入れているかを測る。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP NetPayoutYield t=2.8 / PayoutYield t=3.9"
    - "https://mebfaber.com/wp-content/uploads/2023/05/Shareholder-Yield.pdf"
  markets: [JP, US]
  review: {status: verified}

A16:
  formula: "(CASH - IBD) / MCAP"
  inputs: [CASH, IBD, MCAP]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    CASH に短期有価証券を含め、IBD にリース負債を含める（spec §2）。
    **IFRS16 適用でリース負債が乗ると、同じ企業のネットキャッシュが突然マイナスに転じる。**
    Z07 のフラグ年は判定を保留する。
  zero_denominator_policy: "MCAP>0。負値（ネットデット）はそのまま保持する。"
  missing_bias: "有利子負債の内訳を開示しない企業で欠損。小型株にやや多い。"
  correlated_with: [A17, A15, A29, D01, D07, M10, N14]
  economic_rationale: >-
    **日本の小型株の代表的な歪み。** 時価総額を超える現金を持つ企業が実在する。
    M10（アクティビスト標的スコア）と N14（TOB期待）の主要な構成要素でもある。
    ただし裏面があり、**現金を貯め込むこと自体は資本効率が悪い**（B04 が薄まる）。
    「安いから買う」だけでは、万年割安のまま放置される可能性が高い。
    **東証の資本コスト要請（LAW-47）とアクティビスト圧力（LAW-44）という
    是正メカニズムが働き始めた今だから意味を持つ、時限的な性格のパラメータ。**
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP Cash — Cash to assets, t=2.1"
    - "https://corpgov.law.harvard.edu/2025/10/21/tokyo-stock-exchange-initiative-on-cost-of-capital-and-stock-price-conscious-management/"
  markets: [JP, US]
  review: {status: verified}

A17:
  formula: "NI_TTM / (MCAP - (CASH - IBD))"
  inputs: [NI, MCAP, CASH, IBD]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "A01 と A16 の会計基準差を継承。"
  zero_denominator_policy: >-
    **分母（実質事業価値）がゼロ・負になる企業が実在する** — ネットキャッシュが時価総額を
    超える場合。そのとき比率は意味を失うので**欠損にし、A16 で評価する**。
    負のまま保持すると「実質PER が極端にマイナス＝超割安」という誤判定になる。
  missing_bias: ネットキャッシュ潤沢な小型株で欠損しやすい。**263AT が狙う銘柄と重なる**（B03 と同型）。
  correlated_with: [A01, A16, A37, A06]
  economic_rationale: >-
    A16 を反映した「本当の事業価値ベースの益回り」。現金は事業リスクを負っていないので、
    事業の収益力を測るなら控除すべきという発想。
    **ただし控除しすぎると、現金を持つこと自体のコスト（B04 の希薄化）を無視することになる。**
    A01 と A17 を両方持ち、乖離が大きい銘柄を「現金が論点の銘柄」として識別するのが実務的。
  evidence_tier: T3
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP EntMult / Cash との関連。この形での直接の実証は無い"
  markets: [JP, US]
  review: {status: verified}

A22:
  formula: "percentile( 現PER, 過去5年の自社PER の分布 )"
  inputs: [A01, PRICE]
  period_convention: TTM
  consolidation: consolidated
  normalization: rank_all
  accounting_standard_note: >-
    5年間に会計基準変更（Z07）や決算期変更（Z06）があると、過去の PER と現在の PER が
    別物になる。**フラグ年を含む期間は欠損にする。**
  zero_denominator_policy: >-
    赤字期は PER が定義できないので、**E/P の分布でパーセンタイルを取る**（A01 と同じ向き）。
    5年間に計算可能な四半期が10未満なら欠損。
  missing_bias: >-
    **上場5年未満で丸ごと欠損する。** F02/B13/B28 と同じ偏りで、ユニバースが暗黙に
    成熟企業へ寄る（Z03 で監視）。IPO 後の若い企業には別の評価軸が要る。
  correlated_with: [A01, A23, A24, A33]
  economic_rationale: >-
    **業種を跨いだ比較を可能にする最重要の変換。** 銀行の PER が低いのは業種特性であって
    割安ではない、という問題を、自分自身の過去と比べることで回避する。
    時系列バリューは断面バリューより頑健という報告があり、A25（業種内相対）と
    別の角度から同じ問題に対処している。**両方持って縮小に任せる。**
    normalization を `rank_all` にしているのは、パーセンタイル自体は既に自己履歴で
    正規化済みなので、あとは他パラメータと足せるよう断面で z 化するだけでよいため。
  evidence_tier: T3
  references:
    - "構造的判断。時系列バリューの実証はあるが、この具体形での検証は未実施"
  markets: [JP, US]
  review: {status: verified}

A23:
  formula: "percentile( 現PBR, 過去5年の自社PBR の分布 )"
  inputs: [A03, PRICE]
  period_convention: TTM
  consolidation: consolidated
  normalization: rank_all
  accounting_standard_note: "A03 と A22 の注意を継承。IFRS ののれん非償却で自己資本が趨勢的に増えると、PBR が趨勢的に下がる点に注意。"
  zero_denominator_policy: "債務超過期は PBR が負になるため、その期を除いて分布を作る。除外後に10四半期未満なら欠損。"
  missing_bias: A22 と同じ（上場5年未満で欠損）。
  correlated_with: [A03, A22, A24, A34]
  economic_rationale: >-
    A22 の PBR 版。PBR は PER より安定（赤字でも定義できる、自己資本は利益より滑らか）なので、
    **自己履歴との比較にはこちらの方が向いている。**
    日本では東証の PBR1倍割れ改革（LAW-47）があり、**「自社の過去と比べて安い」ことが
    実際に是正される制度的な後押しがある**という点で、他国より意味を持つ。
  evidence_tier: T3
  references:
    - "https://corpgov.law.harvard.edu/2025/10/21/tokyo-stock-exchange-initiative-on-cost-of-capital-and-stock-price-conscious-management/"
    - "構造的判断。この具体形での検証は未実施"
  markets: [JP, US]
  review: {status: verified}

A26:
  formula: "現株価を DCF で正当化する永久成長率 g を逆算する"
  inputs: [PRICE, FCF, WACC, SHARES]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "FCF の定義（spec §2）と WACC の推定（B04）に依存する。"
  zero_denominator_policy: >-
    **FCF<=0 または g >= WACC のとき解が存在しない。** その場合は欠損にする。
    解が存在しないこと自体が「現在の株価はDCFでは説明できない」という情報だが、
    数値としては表現できないのでフラグで持つ。
  missing_bias: FCF が負の成長企業で欠損。**成長株ほど欠損する**ので、バリュー株に偏った指標になる。
  correlated_with: [A27, A28, A42, C26, N47, B04]
  economic_rationale: >-
    **「市場は年 X% の永久成長を織り込んでいる」を数値化する。**
    それが現実的かを問うのが本質で、10%を超えていれば永久には続かない。
    **売り判定で特に強力**（sell=main）で、保有中に g が非現実的な水準まで上がったら
    テーゼの成否と無関係に高すぎるということ。
    C26（平均回帰調整済み成長率）と N47（長期成長率予想は劣後する）と同じ思想。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP fgr5yrLag t=4.9 — 長期成長率予想が高い銘柄は劣後する"
  markets: [JP, US]
  review: {status: verified}

A27:
  formula: "DCF内在価値（下限・中央・上限） / 株価"
  inputs: [FCF, WACC, growth_assumptions, LLM]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "FCF の定義に依存。IFRS16 の CFO 嵩上げが直接効く。"
  zero_denominator_policy: "PRICE>0。FCF<=0 なら DCF が組めないので欠損。"
  missing_bias: >-
    **仮定を LLM に置かせるので、LLM が知っている有名企業ほど「もっともらしい」仮定が出る。**
    無名銘柄では仮定の質が落ちる — つまり O カテゴリ（ネグレクト）と逆方向に偏る。
    さらに §6.5 のルックアヘッド（LLM が結末を知っている）のリスクが最も高い項目の一つ。
  correlated_with: [A26, A28, A29, A30, T29]
  economic_rationale: >-
    LAW-60（安全域）の実装。**ただし点推定を信じてはいけない。**
    仮定に極めて敏感で、成長率を1%変えるだけで内在価値が数十%動く。
    **必ず幅（下限/中央/上限）で持ち、下限を Gate 的に使う**のが実務的な使い方。
    A28（RIM）の方がターミナル依存度が低く安定するので、A27 単独では判断しない。
  evidence_tier: T3
  references:
    - "構造的判断。DCF 自体の実証研究ではなく評価手法。LLM 依存部分は §6.4 の検証が必要"
  markets: [JP, US]
  review: {status: verified}

A28:
  formula: "(EQ + SUM_t (ROE_t - r) * EQ_{t-1} / (1+r)^t) / MCAP"
  inputs: [EQ, B01, WACC, SHARES]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    **クリーンサープラス関係（純資産の変化 = 利益 - 配当）を前提にするが、
    その他の包括利益があると崩れる。** E28（実質ダーティサープラス）が大きい企業では
    RIM の前提が成立しない。IFRS 企業では OCI が大きくなりやすい。
  zero_denominator_policy: "MCAP>0。EQ<=0（債務超過）では RIM が組めないので欠損。"
  missing_bias: 債務超過企業と OCI の大きい企業で信頼度が落ちる。
  correlated_with: [A03, A27, A34, B01, B13]
  economic_rationale: >-
    **A27（DCF）よりターミナル依存度が低く、実務的に安定する。**
    現在の簿価から出発し、資本コストを超える ROE の超過分だけを積む構造なので、
    **B01（ROE）と A03（B/P）を同時に使っていることになる。**
    A34（理論PBR乖離）と数学的に近い関係にあるので、Z12 の主成分分析で
    まとまる可能性が高い。
  evidence_tier: T3
  references:
    - "構造的判断。Ohlson (1995) の残余利益モデルに基づくが、この形での予測力の実証は未確認"
  markets: [JP, US]
  review: {status: verified}

A33:
  formula: "予想PER(t) / 予想PER(t-63営業日) - 1"
  inputs: [A02]
  period_convention: GUIDE_CO
  consolidation: consolidated
  accounting_standard_note: "A02 を継承。予想の出所が期中に変わると不連続になる。"
  zero_denominator_policy: "3ヶ月前の予想PERが負（赤字予想）なら比率が意味を失うので欠損。"
  missing_bias: A02 の欠損を継承。米国では予想を出さない企業で計算できない。
  correlated_with: [A02, A01, G01, N10, N07]
  economic_rationale: >-
    **株価の変化を「利益予想の変化」と「倍率の変化」に分解する。**
    株価が上がっても、利益予想がそれ以上に上がっていれば倍率は下がっている（＝まだ割安）。
    G01（価格モメンタム）と N10（業績モメンタム）の差分を、バリュエーション側から見た形。
    G18（両モメンタムの一致）と表裏の関係。
  evidence_tier: T3
  references:
    - "構造的判断。G18 の実証と整合するが、この形での直接の実証は無い"
  markets: [JP, US]
  review: {status: verified}

A34:
  formula: "実PBR / 予測PBR - 1。予測PBR は PBR ~ ROE + 成長 + ボラ + log(MCAP) の断面回帰"
  inputs: [A03, B01, C02, I01, J05]
  period_convention: TTM
  consolidation: consolidated
  normalization: rank_sector
  accounting_standard_note: "A03 と B01 の会計基準差を継承。"
  zero_denominator_policy: >-
    予測PBR が負・ゼロになる場合は欠損。**回帰は必ず時点 t までのデータのみで推定する**
    — 全期間で回帰すると典型的なルックアヘッド（Z14 が検出する）。
  missing_bias: >-
    回帰の説明変数（ROE・成長・ボラ・サイズ）がすべて揃う銘柄でのみ計算できるので、
    **欠損が多い小型株で計算できず、A03（素のB/P）しか使えない**という逆転が起きる。
  correlated_with: [A03, A23, A28, B01, B40]
  economic_rationale: >-
    **「ROE が低いから安い」を除いた純粋な割安度。** 素の低PBRは、
    低収益・高リスク・低成長という「安い理由」を含んでいる。それを回帰で説明し、
    残った部分だけをミスプライシングとみなす。素の A03 より頑健という報告がある。
    ただし**説明変数の選び方で結果が変わる**ので、変数選択自体が多重検定になる点に注意（§8-3）。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP AccrualsBM / BPEBM など、B/P の分解系との関連"
  markets: [JP, US]
  review: {status: verified}

A36:
  formula: "SUM_seg( セグメント利益 × 同業種の中央値倍率 ) / EV"
  inputs: [V03, V10, sector_multiples, EV]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    **セグメント区分は企業が自由に決められる**（マネジメント・アプローチ）ので、
    企業間で粒度が揃わない。セグメント変更があった年は前年比が壊れる（V06 で検出）。
  zero_denominator_policy: >-
    赤字セグメントに倍率を掛けると負の価値になる。**赤字セグメントは価値ゼロとして扱うか、
    売上倍率で評価するかを明示的に決める必要がある**（暫定: 売上倍率で評価）。
  missing_bias: >-
    **単一セグメント企業では A06（EV/EBITDA）と同じ値になり、情報量がゼロ。**
    多角化企業でのみ意味を持つので、V01（セグメント数）が2未満なら欠損にする。
  correlated_with: [A06, A07, V01, V03, V04, V10, N15]
  economic_rationale: >-
    **コングロマリット・ディスカウントの定量化。** 全社を1つの倍率で評価すると、
    高収益事業が低収益事業に隠される。分けて評価した合計より時価総額が小さければ、
    **事業売却・スピンオフ（N15）で価値が顕在化する余地がある。**
    V04（価値破壊セグメントの構成比）と組み合わせると、アクティビストの標的（M10）になりやすい
    企業が特定できる。日本の東証改革の文脈で実際に再編が進んでいる領域。
  evidence_tier: T3
  references:
    - "https://corpgov.law.harvard.edu/2025/10/21/tokyo-stock-exchange-initiative-on-cost-of-capital-and-stock-price-conscious-management/"
    - "構造的判断。SOTP は実務手法であり、この形での予測力の実証は未確認"
  markets: [JP, US]
  review: {status: verified}

A38:
  formula: "A09 - 長期国債利回り"
  inputs: [A09, MACRO_10y]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "A09 を継承。"
  zero_denominator_policy: "na（差分）。A09 が欠損なら欠損。"
  missing_bias: >-
    **日米で使う国債が違う**（日本10年 / 米国10年）ので、同じ尺度にならない。
    円建て・ドル建ての金利差（P21）がそのまま乗る。**日米統合ランクを取ってはいけない
    パラメータ**で、市場内ランク（rank_market）にすべき可能性が高い（要検証）。
  correlated_with: [A09, A12, A39, P01, P02]
  economic_rationale: >-
    **金利レジームを跨いだ比較を可能にする。** FCF利回り5%は、金利0%の時代と
    金利5%の時代では全く意味が違う。日本の金利正常化局面（P05）では、
    このスプレッドが縮小することで**同じ株価でも割安度が下がる**。
    A12（益回りスプレッド）の FCF 版で、より操作されにくい。
  evidence_tier: T3
  references:
    - "構造的判断。イールドスプレッドは実務標準だが、断面での予測力の実証は限定的"
  markets: [JP, US]
  review: {status: verified}

A41:
  formula: "自社の A32 の z値 - 同業種内で最も安い銘柄の z値"
  inputs: [A32, sector_classification]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "A32 を継承。"
  zero_denominator_policy: "na（差分）。同業種の銘柄数が5未満なら比較にならないので欠損。"
  missing_bias: "業種分類の欠損で計算不能。GICS が日本株に付与できるかは未解決（spec SP-03）。"
  correlated_with: [A25, A32, Q09, Q10, T21]
  economic_rationale: >-
    **「この業種に賭けるなら、この銘柄が最善か」という問い。** Q09（業種内相対順位）と
    同じ発想だが、順位ではなく最安値との距離を測るので、
    **「2位だが1位とほぼ同じ」と「2位だが1位から大きく離れている」を区別できる。**
    売り判定（sell=main）で価値が高く、保有銘柄より明確に安い同業他社が現れたら
    乗り換えを検討する材料になる（R11 機会費用の業種内版）。
  evidence_tier: T3
  references:
    - "構造的判断。Q09/R11 と同じ論拠。この形での実証は無い"
  markets: [JP, US]
  review: {status: verified}

A42:
  formula: "現株価を残余利益モデルで正当化する ROIC を逆算する"
  inputs: [PRICE, EQ, WACC, SHARES]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "A28 と同じくクリーンサープラスを前提にする。E28 が大きいと崩れる。"
  zero_denominator_policy: "解が存在しない場合（債務超過など）は欠損。"
  missing_bias: A28 と同じ。債務超過企業で計算不能。
  correlated_with: [A26, A28, B03, B04, B13]
  economic_rationale: >-
    A26（インプライド成長率）の資本効率版。**市場が要求している ROIC が、
    企業の実力（B03 の実績、B13 の持続性）を超えていないかを問う。**
    超えていれば、成長率の仮定を変えなくても株価が正当化できないということ。
    A26 と A42 の両方が非現実的なら、株価はどう転んでも高い。
  evidence_tier: T3
  references:
    - "構造的判断。逆算アプローチは実務手法であり、断面での実証は未確認"
  markets: [JP, US]
  review: {status: verified}

A47:
  formula: "z_sector(A03) を E01（アクルーアル）の分位で層別した複合"
  inputs: [A03, E01]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "A03 と E01 の会計基準差を継承。IFRS16 で E01 の分母（TA）が膨らむ点に注意。"
  zero_denominator_policy: "A03 と E01 のいずれかが欠損なら欠損。"
  missing_bias: 四半期CF開示のない企業で E01 が欠損するため、日本の小型株で計算できないことがある。
  correlated_with: [A03, A25, A32, E01, B17]
  economic_rationale: >-
    **A03 と E01 の交互作用。単体より強い（OSAP `AccrualsBM` t=5.5）。**
    「安い」だけでは不十分で、「安くて利益の質が良い」が本命という、
    B17（低PBR × Piotroski）と同じ構図をアクルーアル1本で実現している。
    **§1.9 が交互作用項を残す理由の実例**で、A03 単独・E01 単独と統合せず3本すべて持つ。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP AccrualsBM — Book-to-market and accruals, t=5.5"
  markets: [JP, US]
  review: {status: verified}

# --- C 成長性・再投資 ---------------------------------------------------------

C02:
  formula: "(REV_t / REV_{t-n})^(1/n) - 1、n = 3 / 5 / 10 の3本を別々に持つ"
  inputs: [REV]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    **10年 CAGR は会計基準変更（Z07）と決算期変更（Z06）をほぼ確実に跨ぐ。**
    IFRS 移行前後で売上の認識基準（総額/純額）が変わると、成長率が架空に生まれる。
    商社・EC で特に問題になる。3年 CAGR を主軸にし、10年は参考に留める。
  zero_denominator_policy: "REV_{t-n} <= 0 なら欠損。負の売上は通常ないが、返品調整で発生しうる。"
  missing_bias: >-
    **10年 CAGR が取れる企業は10年生き延びた企業**であり、生存者バイアスそのもの。
    ユニバース側で廃止銘柄を含めていても、この変数の欠損パターン自体が偏る（Z03）。
  correlated_with: [C01, C03, C04, C05, C22, C26, C35]
  economic_rationale: >-
    成長の実績。ただし**成長率をそのまま加点してはいけない**（C26）。
    高成長は必ず減速するので、平均回帰を織り込まないと高値を掴む。
    OSAP `MeanRankRevGrowth` として収録されている。
    **B04（ROIC-WACC）が負の企業の売上成長は価値破壊**なので、必ず交互作用で見る。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP MeanRankRevGrowth — Revenue Growth Rank"
  markets: [JP, US]
  review: {status: verified}

C04:
  formula: "(OP_t / OP_{t-n})^(1/n) - 1"
  inputs: [OP]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    **日本基準はのれん償却後の OP なので、M&A を重ねる企業の成長率が構造的に低く出る。**
    IFRS 企業と直接比較できない。EBITDA 成長で補完する。
  zero_denominator_policy: >-
    **OP_{t-n} <= 0 のとき CAGR が定義できない。** 赤字から黒字化した企業が
    最も価値ある変化なのに計算できないという逆転が起きる。
    その場合は絶対額の変化（OP_t - OP_{t-n}）/ REV_t で代替する。
  missing_bias: 赤字期を含む企業で欠損。**ターンアラウンド銘柄が体系的に落ちる。**
  correlated_with: [C01, C02, C03, C05, C06, B18]
  economic_rationale: >-
    EPS 成長（C03）より操作されにくい。自社株買いで水増しできず、
    金融収支・税率の変動にも影響されない。**事業そのものの成長を測る。**
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "https://mysimon.rochester.edu/novy-marx/research/OSoV.pdf"
  markets: [JP, US]
  review: {status: verified}

C05:
  formula: "(FCF_t / FCF_{t-n})^(1/n) - 1"
  inputs: [CFO, CAPEX]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "IFRS16 で CFO が嵩上げされるため、基準変更年を跨ぐと架空の成長が出る。"
  zero_denominator_policy: >-
    **FCF は符号が変わりやすいので CAGR が最も壊れやすい。** FCF_{t-n} <= 0 なら
    欠損にし、代わりに（FCF_t - FCF_{t-n}）/ REV_t を使う。
  missing_bias: 成長投資期に FCF が負になる企業で欠損。**優良な成長企業ほど落ちる**という逆転。
  correlated_with: [C02, C04, A09, B09, B28]
  economic_rationale: >-
    最も信頼できる成長だが、**最もノイズが大きい。** 設備投資のタイミング1つで
    符号が変わる。3年移動平均で平滑化してから使う。
    B28（5年の現金転換効率）と組み合わせると、成長が現金を伴っているかが分かる。
  evidence_tier: T2
  references:
    - "https://mysimon.rochester.edu/novy-marx/research/OSoV.pdf"
    - "https://www.openassetpricing.com/"
  markets: [JP, US]
  review: {status: verified}

C06:
  formula: "成長率(直近1年) - mean(成長率, 過去3年)"
  inputs: [C01, C02]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "C02 を継承。4年分の履歴が要るので Z06/Z07 のフラグ年を跨ぐ確率が高い。"
  zero_denominator_policy: "na（差分）。過去3年の成長率が2期未満しか計算できないなら欠損。"
  missing_bias: 上場4年未満で欠損。
  correlated_with: [C01, C02, C04, C21, N08, G18]
  economic_rationale: >-
    **水準より加速が効く**という、B18/B29/B44/D26 と同じ構図がここでも現れる。
    市場は水準を織り込んでいるが、変化の二階微分までは織り込みきれていない。
    **減速は強い売りシグナル**（sell=main）で、成長株が減速したときの下落は
    バリュー株の下落より遥かに大きい（バリュエーションが高いぶん落差が大きい）。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP EarningsStreak t=9.5 / EarningsConsistency t=2.7 との関連"
  markets: [JP, US]
  review: {status: verified}

C08:
  formula: "B03 × C07"
  inputs: [B03, C07]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "B03 と C07 の会計基準差を継承。IFRS16 が両方に効く。"
  zero_denominator_policy: "B03 または C07 が欠損なら欠損。C07 の分母（NOPAT）が負なら欠損。"
  missing_bias: >-
    ネットキャッシュ企業で B03 が欠損、無投資企業で C07 が不安定。
    **成熟した無投資の優良企業が落ちる**方向の偏り。
  correlated_with: [B03, B04, B12, C07, C35, C36]
  economic_rationale: >-
    **本カタログの中核式（LAW-43）。長期複利 ≈ ROIC × 再投資率。**
    高 ROIC でも再投資できなければ複利は回らず（配当で返すしかない）、
    再投資しても ROIC が低ければ価値を壊す。**両方が高い企業だけが長期複利の本体。**

    **ここが C カテゴリの符号の分裂を橋渡しする唯一の変数である。**
    C35（資産成長）は再投資を減点し、C08 は再投資を加点する。矛盾ではなく、
    **B04（ROIC - WACC）が正の企業でのみ再投資が正しい**という条件付きの関係。
    平均的な企業は B04 が薄いので、無条件に平均すれば C35 の符号（負）が勝つ。
    **だから C07/C29/C39/N33 はすべて B04 との交互作用が必須になる。**
  evidence_tier: T3
  references:
    - "https://www.forbes.com/sites/bill_stone/2026/06/13/how-to-find-multibagger-stocks-before-they-soar/"
    - "https://www.nber.org/system/files/working_papers/w19681/w19681.pdf"
    - "実務家の中核概念だが、この積の形での断面実証は未確認"
  markets: [JP, US]
  review: {status: verified}

C11:
  formula: "受注残高_t / 受注残高_{t-1} - 1"
  inputs: [order_backlog]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    **受注残の定義が企業ごとに違う**（受注時点か契約締結時点か、キャンセル可能分を含むか）。
    開示している業種も限られる（機械・建設・IT・造船）。
  zero_denominator_policy: "前期の受注残がゼロなら比率が定義できない。絶対額の変化で代替する。"
  missing_bias: >-
    **開示企業に強く偏る。** 業種が偏るだけでなく、同じ業種内でも開示する企業としない企業が
    混在するため、**業種内ランクの母集団が歪む。** 欠損を中立（z=0）にすると、
    開示企業だけで順位がつくことになる。U21（受注残/月商）と併せて業種限定で使うべき。
  correlated_with: [C12, C16, U21, U22, U44, N16]
  economic_rationale: >-
    **開示している業種では最強クラスの先行指標。** 受注は売上に先行するので、
    決算に出る前に業績の方向が分かる。OSAP `OrderBacklog` t=2.4、
    `OrderBacklogChg` も収録されている。
    **U21（受注残/月商）に正規化した方が企業規模の影響を除ける。**
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP OrderBacklog t=2.4 / OrderBacklogChg"
  markets: [JP, US]
  review: {status: verified}

C12:
  formula: "契約負債_t / 契約負債_{t-1} - 1"
  inputs: [deferred_revenue]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    **IFRS15 / ASC606 で「前受収益」が「契約負債」に統一された。**
    移行前後で科目名も範囲も変わるので、Z07 のフラグ年は不連続になる。
  zero_denominator_policy: "前期の契約負債がゼロなら欠損。サブスク以外の業種では常にゼロに近い。"
  missing_bias: >-
    **SaaS・サブスク企業に強く偏る。** それ以外の業種ではノイズしか出ないので、
    業種限定（U-5）で使うべき変数。汎用の C カテゴリに置いているのは分類上の妥協。
  correlated_with: [C11, C15, C16, U27, U28, U29]
  economic_rationale: >-
    **売上計上に先行して現金が入る**ビジネスモデルの成長を捉える。
    契約負債の増加は、まだ売上になっていない将来の収益が積み上がっているということ。
    OSAP `DelDRC`（Deferred Revenue）t=3.6。
    B21（負の CCC）と同じく、前受金モデルの強さの現れでもある。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP DelDRC — Deferred Revenue, t=3.6"
  markets: [JP, US]
  review: {status: verified}

C13:
  formula: "同一店舗ベースの売上 YoY"
  inputs: [LLM, monthly_disclosure]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: >-
    **「既存店」の定義が企業ごとに違う**（開店後12ヶ月か13ヶ月か、改装休業の扱い）。
    企業間比較は同一業態内に限る。
  zero_denominator_policy: "na（YoY）。開示が無い月は欠損。"
  missing_bias: >-
    **月次開示をする企業に偏る**（小売・外食の一部のみ）。日本は比較的多いが米国は少ない。
    LLM でテキストから抽出するので、開示フォーマットが非定型な企業で取りこぼす。
  correlated_with: [U15, U16, U18, C01, X11, X14]
  economic_rationale: >-
    **月次開示なので決算より遥かに速い。** 出店による成長（見かけ）と
    既存店の実力を分離できる。**U16（客数×客単価の分解）と組で使わないと、
    値上げによる一時的な既存店増を実力と誤認する。**
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "構造的判断＋実務標準。小売業のアナリストが最重視する指標"
  markets: [JP, US]
  review: {status: verified}

C15:
  formula: "ARR の YoY、および NRR（既存顧客売上の前年比）"
  inputs: [LLM, IR_disclosure]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: >-
    **ARR も NRR も会計基準の定義ではなく企業の自主開示。** 定義が企業ごとに違い、
    しかも**企業に有利な定義に変更されることがある**（チャーンした顧客の扱い等）。
    定義変更は E21（会計上の見積りの変更）と同種のリスクとして扱う。
  zero_denominator_policy: "開示が無ければ欠損。"
  missing_bias: "開示企業に強く偏る。U-5（SaaS）以外では常に欠損。"
  correlated_with: [C12, C16, U27, U28, U29, U30]
  economic_rationale: >-
    **NRR 120%超は極めて強い** — 既存顧客だけで年20%成長するということで、
    新規獲得コストなしに複利が回る。C08（ROIC × 再投資率）が高くなる構造そのもの。
    ただし**自主開示なので操作の余地があり**、E17（開示の透明性）と併せて見る。
  evidence_tier: T3
  references:
    - "構造的判断。SaaS 業界の実務標準だが、断面での予測力の学術的実証は限定的"
  markets: [JP, US]
  review: {status: verified}

C19:
  formula: "累計実績(Q1..Qn) / 通期会社予想"
  inputs: [OP_cumulative, OP_guidance]
  period_convention: GUIDE_CO
  consolidation: consolidated
  accounting_standard_note: >-
    分子は累計の実績、分母は通期の会社予想。**期中に予想が修正されたら、
    修正後の予想を使うか修正前を使うかで意味が変わる。** 修正前（期初予想）を使うと
    N07（上方修正）と情報が重複するので、**直近の予想を使う**ことにする。
  zero_denominator_policy: "通期予想が0または未定なら欠損（N32 の「未定」企業）。"
  missing_bias: >-
    **米国は会社予想が任意なので、ほぼ日本専用の指標。**
    日本では義務開示なので全銘柄で取れる — LAW-114 の構造的優位。
  correlated_with: [C20, N07, N08, N09, N31, N02]
  economic_rationale: >-
    **日本固有の強力指標。** 会社が期初に立てた計画に対して、どこまで来ているか。
    進捗が過去平均より良ければ上方修正の確率が高い（C20）。
    米国のコンセンサスに依存する N02/N10 が日本の小型株で使えない（OQ-22）ぶん、
    **これが日本側の PEAD 相当の主力になる。**
  evidence_tier: T2
  references:
    - "https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf"
    - "https://www.jstage.jst.go.jp/article/jbef/3/0/3_0_1/_pdf/-char/ja"
  markets: [JP]
  review: {status: verified}

C20:
  formula: "C19(t) - mean(C19(同じ四半期), 過去5年)"
  inputs: [C19]
  period_convention: GUIDE_CO
  consolidation: consolidated
  accounting_standard_note: "C19 を継承。5年分の履歴が要るので Z06 のフラグ年を跨ぐと壊れる。"
  zero_denominator_policy: "na（差分）。過去の同四半期が3期未満しか無いなら欠損。"
  missing_bias: >-
    **上場5年未満で欠損。** C19 は使えるが C20 が使えない銘柄が出る。
    季節性の強い業種では、同じ四半期どうしで比べないと意味がない点に注意。
  correlated_with: [C19, N07, N08, N09, N31, C06]
  economic_rationale: >-
    **上方修正の先行指標。** C19 の絶対水準は季節性に支配されるので、
    自社の過去の同四半期と比べて初めて「今年は進捗が良い」が分かる。
    A22/A23（自己バリュエーション位置）と同じ「自分の過去と比べる」という発想。
    N07（実際の上方修正）が出る前に検出できれば、その分だけ早く動ける。
  evidence_tier: T2
  references:
    - "https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf"
    - "構造的判断＋日本のPEAD実証。この具体形での検証は未実施"
  markets: [JP]
  review: {status: verified}

C21:
  formula: "季節調整済み四半期売上の QoQ を年率換算"
  inputs: [REV_quarterly]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: "四半期開示が前提。日本の一部企業は四半期開示が簡素化されている。"
  zero_denominator_policy: "前四半期の売上が0なら欠損。"
  missing_bias: >-
    **季節調整には最低3年（12四半期）の履歴が要る**ので、上場3年未満で欠損。
    季節性が不規則な企業（大型案件依存）では調整自体が機能しない。
  correlated_with: [C01, C06, C19, C20, C25]
  economic_rationale: >-
    **YoY より早く転換点を捉える。** YoY は12ヶ月前と比べるので、
    直近3ヶ月で起きた変化を検出するのに1年近くかかる。
    QoQ 年率なら3ヶ月で分かるが、季節性を除かないとノイズだらけになる。
    C06（成長の加速度）を四半期解像度で見る版。
  evidence_tier: T3
  references:
    - "構造的判断。マクロ統計の標準手法を個社に適用したもの"
  markets: [JP, US]
  review: {status: verified}

C25:
  formula: "売上成長を単価要因と数量要因に分解（LLM が開示テキストから抽出）"
  inputs: [LLM, IR_disclosure, T32]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "会計数値ではなく開示テキストからの抽出。企業が分解を開示していないと推定になる。"
  zero_denominator_policy: "na（分解）。分解できなければ欠損。"
  missing_bias: >-
    **開示している企業に強く偏る。** しかも「値上げで成長した」ことを積極的に開示する企業は
    少ないので、**都合の悪い分解ほど開示されない**という方向の偏りがある。
    LLM の推定に頼る部分が大きく、§6.4 のカットオフ後検証が必要。
  correlated_with: [C01, C02, B36, B18, U16, T32]
  economic_rationale: >-
    **数量成長のほうが質が高い。値上げだけの成長は続かない。**
    インフレ局面では名目売上が増えるので、分解しないと実力を見誤る。
    U16（小売の客数×客単価）を全業種に一般化したもので、
    B36（価格転嫁力）とは逆の視点 — B36 は値上げできることを評価し、
    C25 は値上げ「しか」できていないことを警戒する。
  evidence_tier: T3
  references:
    - "構造的判断。LLM 由来のため §6.4 の前向き記録による検証が必要"
  markets: [JP, US]
  review: {status: verified}

C28:
  formula: "買収完了から3年後の B03 - 買収前の B03"
  inputs: [B03, M&A_history, LLM]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    **日本基準はのれんを償却するので、買収後の ROIC が構造的に下がる。**
    IFRS 企業と比較する場合は償却前で揃える必要がある。E11（のれん比率）と併読。
  zero_denominator_policy: "買収履歴が無ければ欠損（多数派）。"
  missing_bias: "M&A を行った企業のみ。買収の特定を LLM に頼るので、小型の買収を取りこぼす。"
  correlated_with: [C10, C40, E11, B03, B12, V06]
  economic_rationale: >-
    **M&A 巧者と下手を区別する。** 買収は資本配分の最も大きな意思決定であり、
    T41（経営陣の資本配分の質）の最も検証しやすい部分。
    C10（オーガニック比率）が「M&A に頼っているか」を測るのに対し、
    C28 は「頼った結果うまくいったか」を測る。3年待たないと分からないので
    保有期間 6M〜5Y の設計と相性が良い。
  evidence_tier: T3
  references:
    - "構造的判断。M&A のパフォーマンス研究は多いが、この形での断面実証は未確認"
  markets: [JP, US]
  review: {status: verified}

C29:
  formula: "CAPEX_t / CAPEX_{t-2} - 1"
  inputs: [CAPEX]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "設備投資の範囲（無形資産を含むか）が企業により異なる。spec §2 で有形のみに固定。"
  zero_denominator_policy: >-
    **2年前の CAPEX がゼロ近傍だと発散する。** 設備投資をほとんどしない業種
    （ソフトウェア・サービス）で頻発する。`CAPEX_{t-2} < 総資産の0.5%` なら欠損。
  missing_bias: 資本集約的でない業種で欠損。**業種によって使える/使えないが分かれる。**
  correlated_with: [C30, C31, C36, C39, C07, B32, C35]
  economic_rationale: >-
    **LAW-32（資産成長アノマリー）の設備投資版。投資しすぎた企業は劣後する。**
    理由の候補は (a) 経営者の過剰楽観、(b) 好況期のピークで投資して不況期に減価償却が残る、
    (c) 投資機会が枯渇しているのに無理に投資している。
    **B04（ROIC-WACC）が正なら符号が反転しうる**ので、必ず交互作用で見る（C08 の議論）。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP grcapx t=5.0 / grcapx3y t=4.7"
  markets: [JP, US]
  review: {status: verified}

C32:
  formula: "従業員数_t / 従業員数_{t-1} - 1"
  inputs: [employee_count]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: >-
    **連結従業員数か単体かで大きく違う。** 日本は有報で両方開示されるが、
    臨時雇用者の扱いが企業ごとに違う。spec §2 に従い連結・正社員ベースで統一する。
  zero_denominator_policy: "前期の従業員数がゼロなら欠損（通常ありえない）。"
  missing_bias: >-
    **日本は有報で年1回の開示なので解像度が粗い**（W カテゴリ全体の制約）。
    米国は 10-K の記載だが定義が緩い。
  correlated_with: [W01, B37, C35, C37, B24]
  economic_rationale: >-
    **W01 では符号を「?」にしていたが、実証では負（採用しすぎは劣後）。**
    OSAP `hire` t=5.8。LAW-32（資産成長アノマリー）の人員版であり、
    「インプットの成長は悪い」という C カテゴリ後半の原則がここにも当てはまる。
    人員は最も削りにくい固定費なので、増やしすぎた企業は不況期に苦しむ。
    B37（1人当たり売上の成長）と組で見ると、増員が生産性を伴っているかが分かる。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP hire — Employment growth, t=5.8"
  markets: [JP, US]
  review: {status: verified}

C35:
  formula: "TA_t / TA_{t-1} - 1"
  inputs: [TA]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    **IFRS16 適用年はリース資産が乗って TA が跳ねるので、架空の資産成長が生まれる。**
    Z07 のフラグ年は必ず欠損にする。これを忘れると2019年前後の全企業が
    「資産急増＝売り」と判定される。
  zero_denominator_policy: "TA>0。前期の TA が取れなければ欠損。"
  missing_bias: 上場2年未満で欠損。M&A で TA が跳ねた年は本来の意味を持たない（C10/C28 と併読）。
  correlated_with: [C29, C36, C37, C38, C07, E03, C08]
  economic_rationale: >-
    **最も頑健なアノマリーの一つ（LAW-32、OSAP t=8.4）。** v0.3 までこの★★★の法則に
    対応するパラメータが1つも存在しなかった、というカタログ最大の抜け漏れだった。

    解釈は3つ競合する。(a) 経営者の過剰投資（行動）、(b) 投資が多い企業は
    リスクが低く期待リターンも低い（q理論・投資ファクター）、(c) 会計上の歪み。
    **どれが正しいかは決着していないが、符号は頑健。**

    **C08（ROIC × 再投資率、正）と正面から矛盾するように見えるが、
    B04（ROIC - WACC）が条件変数である。** 平均的な企業は B04 が薄いので、
    無条件で平均すれば負の符号が勝つ。高 ROIC 企業に限れば逆転しうる。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "https://images.aqr.com/-/media/AQR/Documents/Insights/Journal-Article/The-Limits-to-Arbitrage-Revisited-The-Accrual-and-Asset-Growth-Anomalies.pdf"
    - "OSAP AssetGrowth t=8.4"
  markets: [JP, US]
  review: {status: verified}

C36:
  formula: "(delta_有形固定資産 + delta_在庫) / TA_{t-1}"
  inputs: [PPE, INV, TA]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "IFRS16 のリース資産を有形固定資産に含めるかで結果が変わる。含めない版を既定とする。"
  zero_denominator_policy: "TA_{t-1} > 0。"
  missing_bias: 有形固定資産と在庫を独立開示しない企業で欠損。金融業では意味を持たない。
  correlated_with: [C29, C35, C37, B22, B32, B34]
  economic_rationale: >-
    **C35（総資産成長）を実物投資に絞った版。** 総資産には現金や金融資産の増加も含まれるが、
    こちらは工場・設備・在庫という「事業に拘束される資産」だけを見る。
    OSAP `InvestPPEInv` t=7.1。**在庫を含むのが重要で、
    在庫の増加は需要減速のサイン（B22）でもある。**
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP InvestPPEInv — change in ppe and inv/assets, t=7.1"
  markets: [JP, US]
  review: {status: verified}

C37:
  formula: "EQ_t / EQ_{t-1} - 1"
  inputs: [EQ]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    その他の包括利益（OCI）の変動で EQ が動くので、**事業の成果でない増減が混じる。**
    IFRS 企業は OCI が大きくなりやすい。E28（実質ダーティサープラス）と併読。
  zero_denominator_policy: "EQ_{t-1} <= 0（債務超過）なら欠損。"
  missing_bias: 債務超過から回復した企業で計算不能。
  correlated_with: [C35, C38, F01, F27, B01]
  economic_rationale: >-
    **自己資本の成長は、増資（F01、悪材料）と内部留保（利益、好材料）の合計。**
    両方が混じるので単独では解釈しにくいが、実証では負（OSAP `ChEQ` t=5.4）。
    理由は、増資による増加が内部留保による増加を上回る局面が多いからと考えられる。
    **F01（純株式発行）と組み合わせて、どちらの要因かを分離すべき。**
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP ChEQ — Growth in book equity, t=5.4"
  markets: [JP, US]
  review: {status: verified}

C38:
  formula: "(EQ_t / TA_t) - (EQ_{t-1} / TA_{t-1})"
  inputs: [EQ, TA]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "C35 と C37 の注意を継承。IFRS16 で TA が跳ねると比率が下がる。"
  zero_denominator_policy: "TA>0。EQ<0 の期間を含むと解釈できないので欠損。"
  missing_bias: C37 と同じ。
  correlated_with: [C35, C37, D02, D03, F01]
  economic_rationale: >-
    **符号に注意。自己資本比率の「上昇」が劣後を予測する**（OSAP `DelEqu` t=6.2）。
    直感に反するが、増資で自己資本比率が上がる場合が多いためと解釈できる。
    D02（自己資本比率の水準）はゲートとして高い方が良いのに、
    **その変化は高い方が悪い**という、水準と変化で符号が逆転する珍しい例。
    **この符号の逆転は誤実装を誘発しやすいので、Phase 1 で必ず実測確認する。**
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP DelEqu — Change in equity to assets, t=6.2"
  markets: [JP, US]
  review: {status: verified}

# =============================================================================
# M（株主構成・ガバナンス）主力14件 + N（カタリスト）主力20件
#
# このレビューで確認された、カテゴリ横断の重要事項が2つある。
#
# (1) **インサイダー情報の鮮度が日米で桁違いに違う。**
#     米国 Form 4 は取引から2営業日以内。日本の「役員又は主要株主の所有株券等の
#     売買報告書」は翌月15日までで、**最長45日以上遅れる。**
#     同じ M02-M04 でも、米国では速報性のあるシグナル、日本では遅行指標になる。
#     日米で別 ID にするか、pit_lag_days を市場別に持つ必要がある（未解決）。
#
# (2) **M10 と N14（買収の予測）は DF-01 により検証できない。**
#     yfinance で買収廃止銘柄の株価取得率は 0/15 = 0%（docs/03_data_feasibility.md §7.0）。
#     **買収を予測するパラメータのバックテストから、成功例だけが系統的に削除される。**
#     これらは「実装するが検証できない」という特殊な状態に置かれる。
#     有料データを入れるか、これらを諦めるかの判断が要る。
# =============================================================================

# --- M 株主構成・ガバナンス ---------------------------------------------------

M01:
  formula: "(役員保有株数 + 創業家保有株数) / SHARES"
  inputs: [officer_holdings, SHARES]
  period_convention: FY
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "SHARES>0。"
  nonlinear: "abs_dev(x_star=sector_median)"
  missing_bias: >-
    **「創業家」の判定が機械的にできない。** 大株主リストの氏名と役員名の突合で
    近似するしかなく、姓が同じだけの他人や、資産管理会社経由の保有を取りこぼす。
    日本は資産管理会社（〇〇興産など）経由が非常に多いので、**過小評価に偏る。**
  correlated_with: [M07, M15, M22, M29, J07, K35, K36]
  economic_rationale: >-
    ∩型。**利害一致（スキン・イン・ザ・ゲーム）と支配の弊害のトレードオフ。**
    低すぎると経営陣が株主価値に無関心になり、高すぎると少数株主が軽視され
    浮動株が枯れる（J07）。最適点は業種と企業規模で違うので業種内中央値を暫定 x* とするが、
    **理論的な最適点があるわけではないので Phase 1 で分布を見て決め直す。**
  evidence_tier: T3
  references:
    - "構造的判断。日本のコーポレートガバナンス・コードは利害一致を推奨するが、最適水準の実証は無い"
  markets: [JP, US]
  review: {status: verified}

M02:
  formula: "SUM(買付額) - SUM(売却額)、直近6ヶ月、自社株報酬の定期売却を除外"
  inputs: [insider_transactions, K42]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "取引が1件も無ければゼロで正当（欠損にしない）。"
  pit_lag_days: 2
  missing_bias: >-
    **日米で鮮度が桁違い。米国 Form 4 は取引から2営業日、日本の売買報告書は翌月15日まで
    （最長45日超）。** 同じ指標でも米国は速報、日本は遅行指標になる。
    さらに**米国は 10b5-1 プラン（K42）を除外しないと情報量がゼロに近づく**
    — 事前計画売買は情報を含まない。
  correlated_with: [M03, M04, M05, M06, M30, K42, F03]
  economic_rationale: >-
    **経営陣は自社の内実を最もよく知っている。** そして自腹で買うのは、
    株価が安いと本気で考えているとき以外にほとんど無い（売る理由は分散・納税・生活など
    多数あるが、買う理由は基本的に1つしかない）。だから M05（売り）より M02（買い）の方が
    情報量が多いという非対称が生まれる。**マイクロキャップで特に強い**という報告があり、
    O カテゴリ（ネグレクト）との相乗が期待できる。
  evidence_tier: T2
  references:
    - "https://www.sciencedirect.com/science/article/abs/pii/S092753982500088X"
    - "https://arxiv.org/html/2602.06198"
    - "https://www.acadian-asset.com/investment-insights/owenomics/firms-are-the-smart-money"
  markets: [JP, US]
  review: {status: verified}

M03:
  formula: "過去3年の取引パターンから外れた取引のみを抽出した純買い額"
  inputs: [insider_transactions, K42]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "ルーティン判定に3年の履歴が要る。履歴不足なら欠損。"
  pit_lag_days: 2
  missing_bias: >-
    **3年の取引履歴が要るので、上場3年未満と、そもそも取引が少ない企業で判定不能。**
    小型株は役員の取引自体が稀なので、「ルーティンか非ルーティンか」の判定に必要な
    サンプルが集まらない。**O カテゴリと逆方向に偏る。**
  correlated_with: [M02, M04, M05, M30, K42, K49]
  economic_rationale: >-
    **学術的には非ルーティン取引だけが予測力を持つ。** 毎年同じ月に同じ量を売買する
    役員の取引は、分散や納税のスケジュールであって情報ではない。
    ルーティンを混ぜると効果が薄まるので、**M02 より M03 を主軸にすべき**だが、
    判定に履歴が要るぶん適用範囲が狭まるというトレードオフがある。
    米国では K42（10b5-1 フラグ）が使えるので判定が容易。
  evidence_tier: T2
  references:
    - "https://www.sciencedirect.com/science/article/abs/pii/S092753982500088X"
    - "https://www.sciencedirect.com/science/article/abs/pii/S0929119918308824"
  markets: [JP, US]
  review: {status: verified}

M04:
  formula: "SUM( 純買い額 × 役職重み )、CEO=3 CFO=3 社内取締役=2 社外=1"
  inputs: [insider_transactions, officer_titles]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "取引が無ければゼロで正当。"
  pit_lag_days: 2
  missing_bias: >-
    **役職の正規化が必要。** 日本は「取締役常務執行役員」のような複合肩書が多く、
    米国は Form 4 の officer title が自由記述。**LLM で正規化する前提だが、
    その誤りがそのまま重みの誤りになる。** 重み自体（3/3/2/1）にも実証的根拠は無い。
  correlated_with: [M02, M03, M06, M30]
  economic_rationale: >-
    情報優位の階層を反映する。**CFO の買いが最も情報量が多い**という報告がある
    — 決算の着地を最初に知る立場にあるため。社外取締役は情報も少なく、
    形式的に買う場合もあるので重みを下げる。
    **ただし重み付けは仮説であり、Phase 1 で役職別の予測力を実測して較正する。**
  evidence_tier: T3
  references:
    - "https://www.sciencedirect.com/science/article/abs/pii/S092753982500088X"
    - "重み 3/3/2/1 は仮説であり、この配分の実証は無い"
  markets: [JP, US]
  review: {status: verified}

M05:
  formula: "SUM(売却額) - SUM(買付額)、自社株報酬の定期売却を除外"
  inputs: [insider_transactions, K42, SBC]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "取引が無ければゼロ。"
  pit_lag_days: 2
  missing_bias: >-
    **自社株報酬の売却を除外できないと、株式報酬の多い企業（米国テック）が
    体系的に「インサイダー売り」と判定される。** SBC（E07/F07）が大きい企業ほど
    誤検出が増えるので、**業種・地域に強く偏る。**
  correlated_with: [M02, M03, M04, F07, K42]
  economic_rationale: >-
    **M02（買い）と対称に扱ってはいけない。** 売る理由は分散・納税・住宅購入・離職など
    非情報的なものが多数あり、買う理由は基本的に「安い」の1つしかない。
    したがって**売りは弱いシグナルとして扱い、重みを買いより小さくする。**
    符号を対称にすると、株式報酬の多い成長企業を体系的に減点することになる。
  evidence_tier: T3
  references:
    - "https://www.sciencedirect.com/science/article/abs/pii/S092753982500088X"
    - "非対称性は広く指摘されるが、最適な重み配分の実証は無い"
  markets: [JP, US]
  review: {status: verified}

M06:
  formula: "1[F04 自社株買い実行あり] × 1[M02 > 0]"
  inputs: [F04, M02]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール積）"
  missing_bias: "F04（自社株買いの実額）と M02 の欠損を継承。日本は月次開示の集計が要る。"
  correlated_with: [M02, M30, F03, F04, F15, A10]
  economic_rationale: >-
    **会社と経営者が同じ方向に賭けている**という二重の確認。
    会社の自社株買いには「EPS を嵩上げしたい」「余剰資金の使い道が無い」といった
    情報以外の動機もありうるが、**経営者が同時に自腹で買っているなら、
    その動機は「安い」である蓋然性が高まる。**
    Acadian の "Firms are the smart money" の主張を個人レベルで裏取りする形。
  evidence_tier: T2
  references:
    - "https://www.acadian-asset.com/investment-insights/owenomics/firms-are-the-smart-money"
    - "https://www.sciencedirect.com/science/article/abs/pii/S0929119913000278"
  markets: [JP, US]
  review: {status: verified}

M08:
  formula: "1 if 既知アクティビストによる大量保有報告書の提出あり（直近24ヶ月） else 0"
  inputs: [EDINET_5pct, SEC_13D]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  pit_lag_days: 0
  missing_bias: >-
    **「既知アクティビスト」のリストを保持する必要があり、そのリスト自体が
    後知恵バイアスの温床になる。** 今アクティビストとして知られている主体を
    過去に遡って適用すると、当時は無名だった主体を「既知」として扱うことになる。
    **リストにも as-of 日付を持たせる必要がある**（未実装）。
  correlated_with: [M09, M10, M11, M24, K18, N13, N14]
  economic_rationale: >-
    **日本株で特に有効。** NRI の分析では、コーポレートアクションを契機とせず
    アクティビストの買い集めで提出された報告について、義務発生日から公表日にかけて
    累積超過リターンが増加する。日本は 5% 超で5営業日以内の提出義務があり、
    **米国の 13D（10日以内、2024年から5日）より情報が速い時期があった。**
    2024年の「重要提案行為」記載は133件で前年比+55%と、活動自体が増えている。
  evidence_tier: T2
  references:
    - "https://www.nri.com/jp/media/column/osaki/20230509.html"
    - "https://www.nikkei.com/article/DGXZQOTG139ZP0T11C24A2000000/"
    - "https://www.businesslawyers.jp/articles/1536"
  markets: [JP, US]
  review: {status: verified}

M09:
  formula: "1 if 大量保有報告書の保有目的欄に「重要提案行為」を含む else 0"
  inputs: [EDINET_5pct]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  pit_lag_days: 0
  missing_bias: >-
    **日本固有の制度。** 米国では 13D（経営関与目的）と 13G（純投資）の区別が対応するが、
    粒度が違う。日本の「重要提案行為」は具体的な行為類型が列挙されており、より明確。
    **markets を JP に限定し、米国は K48（13D/G）で扱う。**
  correlated_with: [M08, M10, M11, M24, K48]
  economic_rationale: >-
    **通常の投資目的より遥かに強いシグナル。** 「重要提案行為」を記載すると
    保有報告の特例（機関投資家の簡易報告）が使えなくなるため、
    **記載するのは本気で経営に介入する意思がある場合に限られる。**
    制度設計上、コストを払ってでも意思表示しているという点で情報量が高い。
  evidence_tier: T2
  references:
    - "https://www.nri.com/jp/media/column/osaki/20230509.html"
    - "https://www.businesslawyers.jp/articles/1536"
    - "金融商品取引法 第27条の23（大量保有報告制度）"
  markets: [JP]
  review: {status: verified}

M10:
  formula: "z(-A03) + z(A16) + z(-B01) + z(政策保有株比率) + 1[K18 親会社比率 50-90%]"
  inputs: [A03, A16, B01, K17, K18]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "構成要素の会計基準差を継承。政策保有株の開示は日本固有。"
  zero_denominator_policy: "構成要素が3つ未満しか計算できないなら欠損。"
  missing_bias: >-
    政策保有株比率は**日本の有報でのみ開示**されるので、米国では構成要素が1つ減る。
    日米で中身が違う複合指標になる。
  correlated_with: [A03, A16, B01, K17, K18, M08, M09, N13, N14]
  economic_rationale: >-
    **保有報告が出る「前」に先回りする。** M08/M09 は既に公表された事実なので、
    その時点で価格は動いている。アクティビストが狙う条件
    （低PBR・現金過多・低ROE・政策保有多・親子上場）を先に満たす銘柄を拾う。
    東証の資本コスト要請（LAW-47）が同じ条件の企業に圧力をかけているので、
    **アクティビストが来なくても企業自身が動く可能性がある**という二重の期待。

    **ただし DF-01 により検証できない。** 成功シナリオ（TOB・非公開化）で
    廃止された銘柄は無料の株価データから消える（取得率 0/15）。
    **バックテストすると勝ち筋だけが削除される**ので、この指標の有効性は
    有料データを入れるまで測定不能。
  evidence_tier: T3
  references:
    - "https://note.com/tatsuya_sabato/n/n035f8265adb9"
    - "https://www.nri.com/jp/media/column/osaki/20230509.html"
    - "https://corpgov.law.harvard.edu/2025/10/21/tokyo-stock-exchange-initiative-on-cost-of-capital-and-stock-price-conscious-management/"
    - "合成仮説であり、この形での実証は無い。加えて DF-01 により検証手段が無い"
  markets: [JP]
  review: {status: verified}

M21:
  formula: "社長交代の有無と背景を LLM が分類（内部昇格 / 外部招聘 / 引責 / 定年）"
  inputs: [LLM, TD_disclosure]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（分類）"
  missing_bias: >-
    **「引責」は開示文言に現れない。** 「一身上の都合」「本人の申し出」と書かれるので、
    LLM が業績推移や不祥事（Y06）と突き合わせて推定するしかない。
    **推定の誤りが符号を反転させる**（引責交代は変化の期待、定年は現状維持）。
  correlated_with: [M14, M15, M22, W13, T41, N18]
  economic_rationale: >-
    符号は文脈依存。**外部招聘と引責交代は変化のカタリスト**で、
    低 ROE・低 PBR の企業では改善期待になる。一方、好業績企業での交代は
    継続性のリスクになる。**B04（ROIC-WACC）の水準で符号が変わる**ので、
    単独で符号を固定してはいけない。T41（資本配分の質）の評価が交代でリセットされる点も重要。
  evidence_tier: T3
  references:
    - "構造的判断。CEO交代の株価影響の研究は多いが、文脈依存で符号が定まらない"
  markets: [JP, US]
  review: {status: verified}

M24:
  formula: "1 if 株主総会に株主提案が提出された else 0（提案者と議案内容を付す）"
  inputs: [LLM, TD_disclosure, AGM_notice]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: >-
    **招集通知は PDF で、機械抽出が不安定。** 日本は東証の適時開示に載らない場合もあり、
    企業サイトからの取得になる。取りこぼしは「提案なし」に倒れる。
  correlated_with: [M08, M09, M25, M13, K18]
  economic_rationale: >-
    M08/M09 と並ぶアクティビスト圧力の直接証拠。**大量保有報告を出さずに
    株主提案だけを行う主体もいる**（5%未満でも提案権はある）ので、
    M08 では捕捉できない圧力を拾える。可決されなくても、
    **提案が出ること自体が経営陣への圧力**になり、企業側の自主的な改善を促す。
  evidence_tier: T3
  references:
    - "https://www.nikkei.com/article/DGXZQOTG139ZP0T11C24A2000000/"
    - "会社法 第303条（株主提案権）"
  markets: [JP, US]
  review: {status: verified}

M25:
  formula: "取締役選任議案（特に社長）の賛成率"
  inputs: [TD_disclosure, AGM_results]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "議案が無ければ欠損。"
  missing_bias: >-
    日本は臨時報告書で議決権行使結果が開示される（義務）。**米国は 8-K で開示されるが
    形式が非定型。** 日本の方が機械抽出しやすいという珍しい例。
  correlated_with: [M24, M12, M13, M26, M27, K36]
  economic_rationale: >-
    **賛成率80%割れは機関投資家の不信任。** 議決権行使助言会社の反対推奨が出ると
    賛成率が下がるので、**外部の専門家がガバナンスに問題ありと判断した証拠**になる。
    賛成率の低下が続くと経営陣の交代（M21）や、企業側の自主的な資本政策変更（F20）に
    つながることがある。**売り判定で価値が高い**（sell=main）。
  evidence_tier: T3
  references:
    - "金融商品取引法 第24条の5第4項（臨時報告書：議決権行使結果）"
    - "構造的判断。賛成率と将来リターンの断面実証は未確認"
  markets: [JP, US]
  review: {status: verified}

M28:
  formula: "関連当事者取引の金額 / REV"
  inputs: [related_party_transactions, REV]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: >-
    **開示基準に重要性の閾値があるので、小規模な取引は開示されない。**
    日本は連結財務諸表規則、米国は Reg S-K Item 404 で基準が違う。
  zero_denominator_policy: "REV>0。関連当事者取引が無ければゼロで正当。"
  missing_bias: "注記からの抽出なので、開示形式が非定型な企業で取りこぼす。取りこぼしは「取引なし」に倒れる。"
  correlated_with: [K18, M23, M10, N14, E25]
  economic_rationale: >-
    **親子上場での利益移転（トンネリング）リスクの直接測定。**
    K18（親会社の保有比率が高い）は TOB 期待という上side を持つが、
    同時に**少数株主から親会社へ利益が移転される downside** も持つ。
    M28 が大きい企業では後者が現実に起きている可能性が高く、
    **K18 の符号を反転させうる条件変数**として機能する。
  evidence_tier: T3
  references:
    - "連結財務諸表規則 第15条の4の2（関連当事者との取引）"
    - "米国: Regulation S-K Item 404"
    - "構造的判断。トンネリングの実証研究は新興国中心で、日米では限定的"
  markets: [JP, US]
  review: {status: verified}

M30:
  formula: "同一90日間に買い付けを行った役員の実人数"
  inputs: [insider_transactions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（カウント）"
  pit_lag_days: 2
  missing_bias: >-
    **役員数が少ない小型株では、そもそも「複数人」が発生しにくい。**
    大企業の方がクラスタが観測されやすいので、O カテゴリ（小型株重視）と逆方向に偏る。
    役員数で正規化すべきかは要検討。
  correlated_with: [M02, M03, M04, M06]
  economic_rationale: >-
    **単独の買いより複数人の同時買いが遥かに強い。** 1人なら個人的な事情
    （自社株買付制度への参加、住宅ローン完済など）で説明できるが、
    複数人が同時に動くのは共通の情報を持っている蓋然性が高い。
    M06（会社との一致）と同じく、**独立な意思決定の一致**に情報を見出す構造。
  evidence_tier: T2
  references:
    - "https://www.sciencedirect.com/science/article/abs/pii/S092753982500088X"
    - "https://arxiv.org/html/2602.06198"
  markets: [JP, US]
  review: {status: verified}

# --- N カタリスト・イベント ---------------------------------------------------

N04:
  formula: "決算発表日を含む ±1営業日の市場調整後累積リターン"
  inputs: [PRICE, market_return, announcement_datetime]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  pit_lag_days: 0
  missing_bias: >-
    **発表時刻の精度が結果を左右する。** 引け後発表なら翌日が反応日、場中発表なら当日。
    日本は15時以降の発表が大半だが例外がある（N29）。**時刻を間違えると、
    反応日を1日ずらして CAR がノイズになる。** 米国は寄り前・引け後の両方があり、
    Form 8-K のタイムスタンプで判定できる。
  correlated_with: [N02, N03, N05, N06, N29, G04]
  economic_rationale: >-
    **市場の初期反応そのものが最良の「サプライズ」推定である。**
    SUE（N02）は予想との差を測るが、予想の質に依存する。N04 は市場全体が
    どう驚いたかを直接測るので、**予想データが無い日本の小型株でも計算できる**
    という決定的な利点がある（OQ-22 の回避策になりうる）。
    SUE より頑健という報告があり、OSAP `AnnouncementReturn` t=9.2 は
    earnings event カテゴリで最上位。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP AnnouncementReturn t=9.2"
    - "https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf"
  markets: [JP, US]
  review: {status: verified}

N06:
  formula: "N02 × (1 - z_rank(O01))"
  inputs: [N02, O01]
  period_convention: GUIDE_CONS
  consolidation: consolidated
  accounting_standard_note: "N02 を継承。"
  zero_denominator_policy: "N02 または O01 が欠損なら欠損。"
  missing_bias: >-
    **致命的な自己矛盾を抱える。** N02（SUE）はコンセンサス予想が要り、O01（カバレッジ数）も
    予想データベースが要る。**注目度が最も低い銘柄では両方とも欠損する。**
    つまり「注目度が低いほど強い」という仮説を、注目度が低い銘柄で検証できない。
    **回避策は N02 を N04（決算発表日リターン）に置き換えること** — N04 は価格だけで
    計算でき、O01 の代わりに O04（ニュース数）や O08（出来高枯渇）を使えば
    予想データ非依存の版が作れる。**この代替版を別 ID として作るべき（未実施）。**
  correlated_with: [N02, N04, N05, O01, O10, O04]
  economic_rationale: >-
    **LAW-27（ネグレクト）× LAW-28（PEAD）の交互作用で、263AT の目玉候補。**
    注目度が低い銘柄ほど決算情報の織り込みが遅く、ドリフトが長く強いことは
    日本の実証でも確認されている。O カテゴリを「乗数として使う」という設計思想
    （O10 の議論）の最も具体的な実装例。
  evidence_tier: T2
  references:
    - "https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf"
    - "https://www.jstage.jst.go.jp/article/jbef/3/0/3_0_1/_pdf/-char/ja"
    - "https://www.openassetpricing.com/"
  markets: [JP, US]
  review: {status: verified}

N07:
  formula: "(修正後の通期営業利益予想 - 修正前) / abs(修正前)"
  inputs: [OP_guidance, TD_disclosure]
  period_convention: GUIDE_CO
  consolidation: consolidated
  accounting_standard_note: "会社予想の開示。日本は義務、米国は任意。"
  zero_denominator_policy: >-
    修正前予想がゼロ近傍だと発散する。**分母に下限（売上の1%）を置く。**
    赤字予想から黒字予想への転換は比率が意味を失うのでフラグで別に持つ。
  pit_lag_days: 0
  missing_bias: >-
    **米国はガイダンスを出さない企業が多く、体系的に欠損。**
    日本は義務開示なのでほぼ全銘柄で取れる（LAW-114）。**markets を JP 主体にすべき。**
  correlated_with: [N08, N09, N31, C19, C20, N10]
  economic_rationale: >-
    **日本固有の強力なイベント。** 米国のコンセンサス改定（N10）に相当するが、
    会社自身が出すので情報源が一次であり、しかも義務開示なので全銘柄で取れる。
    **N10 が日本の小型株で使えない（OQ-22）ぶん、これが代替の主力になる。**
    C19/C20（四半期進捗率）は N07 の先行指標。
  evidence_tier: T2
  references:
    - "https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf"
    - "https://www.jstage.jst.go.jp/article/jbef/3/0/3_0_1/_pdf/-char/ja"
  markets: [JP]
  review: {status: verified}

N08:
  formula: "過去4期における上方修正の回数（0-4）"
  inputs: [N07]
  period_convention: GUIDE_CO
  consolidation: consolidated
  accounting_standard_note: "N07 を継承。"
  zero_denominator_policy: "na（カウント）。4期分の履歴が無ければ欠損。"
  missing_bias: "上場1年未満で欠損。米国では N07 と同じ理由で欠損が多い。"
  correlated_with: [N07, N09, N31, C19, C20, C06, G37]
  economic_rationale: >-
    **上方修正を出した企業は次も上方修正しやすい（LAW-29）。**
    理由の候補は (a) 会社予想が構造的に保守的（N09）、(b) 業績の系列相関、
    (c) 経営陣が段階的に情報を出している。どれでも符号は正。
    OSAP の `EarningsStreak` t=9.5、`NumEarnIncrease` に対応し、
    G37（収益サプライズの連続性）と同じ現象を会社予想側から見ている。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP EarningsStreak t=9.5 / NumEarnIncrease"
    - "https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf"
  markets: [JP]
  review: {status: verified}

N14:
  formula: "z(1[K18 が 50-90%]) + z(-A03) + z(A16) + 1[M13 買収防衛策なし]"
  inputs: [K18, A03, A16, M13]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "構成要素の会計基準差を継承。"
  zero_denominator_policy: "構成要素が3つ未満なら欠損。"
  missing_bias: "K18（親会社比率）は大株主開示から。日本は年1回なので解像度が粗い。"
  correlated_with: [K18, A03, A16, M10, M13, M28, N13, N34]
  economic_rationale: >-
    **親子上場の解消（完全子会社化）を先回りする。** 東証は親子上場の
    ガバナンス問題を問題視しており、アクティビストの標的にもなりやすい（M10）。
    親会社にとっては、低PBR で現金を持つ子会社を買い取るのは資本効率上も合理的。

    **ただし M10 と同じく DF-01 により検証不能。** TOB が成立すると銘柄は上場廃止になり、
    無料の株価データから消える（取得率 0/15）。**成功例だけが消えるバックテストからは、
    この指標が機能したかどうかを知る方法がない。**
    さらに M28（支配株主との取引）が大きい企業では、親会社が
    利益移転で済ませて買い取らない可能性があり、符号が反転しうる。
  evidence_tier: T3
  references:
    - "https://note.com/tatsuya_sabato/n/n035f8265adb9"
    - "https://corpgov.law.harvard.edu/2025/10/21/tokyo-stock-exchange-initiative-on-cost-of-capital-and-stock-price-conscious-management/"
    - "合成仮説。DF-01 により検証手段が存在しない"
  markets: [JP]
  review: {status: verified}

N18:
  formula: "中期経営計画の目標に対する実績の達成率"
  inputs: [LLM, TD_disclosure]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "計画の指標（売上・営業利益・ROE）が企業ごとに違うので統一が要る。"
  zero_denominator_policy: "計画目標がゼロ・未開示なら欠損。"
  missing_bias: >-
    **中計を出さない企業がある**（特に米国）。日本は東証の要請もあり出す企業が多い。
    また**未達が見込まれると計画を撤回・改訂する企業がある**ため、
    「達成率が低い企業」が母集団から消える生存者バイアスが働く。
  correlated_with: [T11, T41, M21, F13, F22, N31]
  economic_rationale: >-
    **T11（経営陣の約束履行率）の定量版。計画未達が続く企業は経営を信用しない。**
    売り判定で価値が高い（sell=main）。逆に達成率が高い企業は、
    次の計画も信頼でき、**将来の業績予想の確度が上がる**という形で
    他のパラメータの信頼度に波及する。
  evidence_tier: T3
  references:
    - "https://www.jpx.co.jp/english/equities/follow-up/02.html"
    - "構造的判断。中計達成率と株価の断面実証は未確認"
  markets: [JP, US]
  review: {status: verified}

N20:
  formula: "係争中の訴訟の請求額 / MCAP、および行政処分の有無"
  inputs: [LLM, EDINET_notes, SEC_legal_proceedings]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: >-
    **偶発債務の開示基準が国で違う。** 米国は ASC 450 で「reasonably possible」まで
    開示するが、日本は「発生可能性が高い」ものが中心。**米国の方が開示が広い。**
  zero_denominator_policy: "MCAP>0。請求額が不明な訴訟は件数で代替。"
  missing_bias: >-
    **米国はクラスアクションが多く、日本は少ない。** 制度差がそのまま数値差になるので、
    **日米統合ランクを取ってはいけない**（rank_market にすべき）。
  correlated_with: [Y07, Y10, D21, E12, N36, N37]
  economic_rationale: >-
    構造的制約に近い。訴訟は (a) 直接の金銭的損失、(b) 経営リソースの消費、
    (c) レピュテーション毀損の3つの経路で価値を削る。
    **請求額が時価総額に対して大きい訴訟は、事実上の破綻リスク**になる。
    Y07（訴訟の履歴）が過去を見るのに対し、これは現在進行形。
  evidence_tier: T3
  references:
    - "米国: ASC 450 Contingencies / Reg S-K Item 103"
    - "日本: 財務諸表等規則 第58条（偶発債務）"
  markets: [JP, US]
  review: {status: verified}

N21:
  formula: "顧客集中度 × 主要顧客企業の業績変化"
  inputs: [LLM, customer_disclosure, X15]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    **主要顧客の開示基準が違う。** 米国は売上の10%以上の顧客の開示が義務（ASC 280）。
    日本は「主要な顧客ごとの情報」として開示するが、顧客名を伏せる企業も多い。
  zero_denominator_policy: "顧客が特定できなければ欠損。"
  missing_bias: >-
    **顧客名を開示する企業に強く偏る。** 日本は「A社」等の匿名開示が多く、
    LLM で推定するしかない。**推定の誤りがそのまま符号の誤りになる。**
  correlated_with: [T18, X15, I25, L06, L07, V02]
  economic_rationale: >-
    **サプライチェーンの上流を先読みできる数少ない手段。**
    主要顧客の業績が悪化すれば、発注が減るのは数四半期後。
    L07（顧客モメンタム、OSAP `iomom_cust` t=4.1）が価格で捉える現象を、
    ファンダメンタルで捉える版。小型株では単独で株価を決めることがある（I25 一本足リスク）。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP CustomerMomentum t=3.8 / iomom_cust t=4.1"
    - "米国: ASC 280-10-50-42（主要顧客の開示）"
  markets: [JP, US]
  review: {status: verified}

N22:
  formula: "市場区分の変更（プライム↔スタンダード↔グロース）の有無と方向"
  inputs: [TD_disclosure, exchange_designation]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（分類）"
  missing_bias: "日本固有の制度。米国は取引所間の移行（NASDAQ↔NYSE）が対応するが意味が違う。"
  correlated_with: [N23, N44, K12, K39, O13, J06]
  economic_rationale: >-
    **降格はパッシブ売り、昇格は買い。** TOPIX の構成銘柄縮小（K12、2028年に1,200銘柄へ）
    と連動しており、**今後数年は制度要因で需給が動く時限的なテーマ**。
    ただし降格は上場維持基準への抵触（N23/N44）と相関するので、
    **需給要因と信用リスク要因が混在する。** 分離するには N44 で条件付けする必要がある。
    OSAP `ExchSwitch` t=3.6（米国）。
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP ExchSwitch t=3.6"
    - "https://www.jpx.co.jp/english/equities/follow-up/02.html"
  markets: [JP, US]
  review: {status: verified}

N25:
  formula: "IPO時のロックアップ契約の解除日までの営業日数"
  inputs: [IPO_prospectus, LLM]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（日数）"
  nonlinear: "abs_dev(x_star=sector_median)"
  missing_bias: >-
    **目論見書からの抽出が必要で、過去に遡るのが難しい。**
    日本はロックアップ期間が90日/180日と、価格条件付き解除（公開価格の1.5倍等）の
    2種類があり、**後者は株価次第で解除日が変わる**ので日数で表現できない。
  correlated_with: [N24, F05, F06, J07, K34]
  economic_rationale: >-
    ∩型。**解除前は需給が締まり、解除直後に売り圧力が出る。**
    日本の新興市場では顕著で、ベンチャーキャピタルの持分が一斉に放出されることがある。
    N24（上場後経過年数、LAW-48 IPO後の長期劣後）と併せて、
    **IPO後3年程度は構造的な需給悪化要因が続く**と考えるべき。
  evidence_tier: T3
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP IndIPO t=4.0 / AgeIPO との関連"
  markets: [JP, US]
  review: {status: verified}

N28:
  formula: "同一日に決算発表を行う銘柄数"
  inputs: [earnings_calendar]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（カウント）"
  missing_bias: >-
    決算発表予定日は事前に開示されるが、**変更されることがある。**
    予定日で計算するか実績日で計算するかで値が変わる。**PIT を守るなら
    「その時点で公表されていた予定日」を使う**べきで、実績日を使うとルックアヘッド。
  correlated_with: [N01, N02, N04, N05, N06, N29, O01]
  economic_rationale: >-
    **注目が分散する日の決算はドリフトが強く長い。**
    日本は決算発表が特定日に極端に集中する（3月期決算が5月上旬に数百社）ため、
    米国より効果が大きい可能性がある。
    **LAW-27（ネグレクト）× LAW-28（PEAD）を、企業属性ではなくタイミングで捉える別ルート。**
    N06 が予想データ依存で日本の小型株で使えないのに対し、
    **N28 は決算カレンダーだけで計算でき、欠損しない**という実務上の大きな利点がある。
  evidence_tier: T3
  references:
    - "https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf"
    - "投資家の注意力の限界に関する研究群に基づく。日本での定量的実証は未確認"
  markets: [JP, US]
  review: {status: verified}

N31:
  formula: "期初の通期営業利益予想 / 前期実績営業利益 - 1"
  inputs: [OP_guidance, OP]
  period_convention: GUIDE_CO
  consolidation: consolidated
  accounting_standard_note: "会社予想。日本は義務開示。"
  zero_denominator_policy: >-
    前期の営業利益がゼロ・負なら比率が意味を失う。**売上比（(予想OP - 実績OP)/REV）で代替する。**
  missing_bias: "米国はガイダンスが任意なので欠損が多い。日本は義務でほぼ全銘柄。"
  correlated_with: [N07, N08, N09, C19, C20, N32]
  economic_rationale: >-
    **日本固有。期初予想が保守的すぎる企業は上方修正の宝庫。**
    日本企業は期初に控えめな予想を出す傾向があり（N09 で測る）、
    N31 が低い企業ほど後で上方修正する余地が大きい。**符号が直感と逆に見える**
    — 「期初予想が弱気＝悪い会社」ではなく「期初予想が弱気＝保守的＝上振れ余地」。
    ただし本当に業績が悪い企業も低くなるので、**N09（過去の保守性）で条件付けないと
    単に業績が悪い企業を買うことになる。**
  evidence_tier: T3
  references:
    - "https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf"
    - "構造的判断。日本企業の予想の保守性は広く指摘されるが、この形での実証は未確認"
  markets: [JP]
  review: {status: verified}

N36:
  formula: "リコール・製品事故の発生と、対象製品の売上比率"
  inputs: [NEWS, LLM, TD_disclosure]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "対象製品の売上が不明なら件数と報道量で代替。"
  missing_bias: >-
    **報道量に依存するので、大企業ほど検出されやすい。**
    小型株のリコールは報道されず見逃す。**O カテゴリと逆方向に偏る**（ネグレクト銘柄で
    悪材料を見逃す）という、リスク管理上まずい形の偏り。
  correlated_with: [N20, N37, N38, Y06, Y07, U19]
  economic_rationale: >-
    自動車・食品・医療機器で致命的になりうる。直接の費用（回収・賠償）に加え、
    ブランド毀損が長期に効く。**Y06（不祥事の履歴）が示す通り再発率が高い**ので、
    1件目を組織文化の問題の兆候として扱う。
  evidence_tier: T3
  references:
    - "構造的判断。個別事象なので断面での実証は困難"
  markets: [JP, US]
  review: {status: verified}

N37:
  formula: "サイバー攻撃・情報漏洩の発生と、影響範囲（件数・停止日数）"
  inputs: [NEWS, LLM, TD_disclosure]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: >-
    **米国は SEC のサイバーセキュリティ開示規則（2023年施行）で、重要なインシデントは
    4営業日以内の 8-K 開示が義務。日本には同等の義務が無い。**
    したがって**米国の方が検出が速く確実**という制度差がある。
  zero_denominator_policy: "na"
  missing_bias: >-
    N36 と同じく報道依存。加えて**日本は開示義務が無いので、中小型株は
    公表せずに済ませることがある。** 検出できないこと自体がリスク。
  correlated_with: [N36, N20, Y06, Y09, W14]
  economic_rationale: >-
    近年増加している。直接被害（復旧費用・賠償）より、**事業停止の期間**が効く。
    サプライチェーン攻撃では取引先にも波及するので、L06/L07（仕入先・顧客モメンタム）
    との連動を見る価値がある。**中小型株は開示が遅れがちで、後から発覚する。**
  evidence_tier: T3
  references:
    - "米国: SEC Cybersecurity Disclosure Rules（17 CFR 229.106、2023年施行）"
    - "構造的判断。個別事象なので断面での実証は困難"
  markets: [JP, US]
  review: {status: verified}

N38:
  formula: "拠点の被災・サプライチェーン寸断の影響を LLM が -5〜0 で採点"
  inputs: [LLM, NEWS, facility_locations]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: >-
    **拠点の所在地情報が必要だが、開示が粗い。** 有報の「主要な設備の状況」から
    抽出できるが、サプライヤーの所在地までは分からない。**間接的な被害を捉えられない。**
  correlated_with: [N36, N37, Y11, V07, V08, T19]
  economic_rationale: >-
    日本は地震・水害リスクが構造的に高い。Y11（気候・地震の物理リスク）が
    平時の潜在リスクを測るのに対し、N38 は実際に起きた事象の影響を測る。
    **短期の生産停止は数四半期で回復するが、顧客を失うと戻らない**ので、
    N41（大口顧客の喪失）への波及を見る必要がある。
  evidence_tier: T3
  references:
    - "構造的判断。個別事象なので断面での実証は困難"
  markets: [JP, US]
  review: {status: verified}

N39:
  formula: "主力製品の特許満了までの残存年数（売上加重）"
  inputs: [LLM, patent_data, segment_revenue]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "主力製品が特定できなければ欠損。"
  missing_bias: >-
    **医薬・素材以外ではほぼ意味を持たない。** 実質的に U-6（医薬）専用で、
    汎用の N カテゴリに置いているのは分類上の妥協（C11/C12 と同じ問題）。
    特許の特定は LLM に頼るので、**製品と特許の紐付けの誤りが直接効く。**
  correlated_with: [U35, U36, U37, X07, X08, T16]
  economic_rationale: >-
    **医薬では決定的。特許満了で後発品が出ると売上が数割落ちる。**
    **保有期間 6M〜5Y という設計では、5年以内に満了する特許は必ず影響する**ので、
    無視できない。PER が低く見える医薬企業の多くは、
    パテントクリフを市場が織り込んでいるだけである可能性が高い
    — **A カテゴリのバリュートラップの業種特有の形。**
  evidence_tier: T3
  references:
    - "構造的判断。パテントクリフの株価影響は実務上自明だが、断面パラメータとしての実証は未確認"
  markets: [JP, US]
  review: {status: verified}

N41:
  formula: "大口顧客の獲得・喪失の開示と、対象売上 / REV"
  inputs: [LLM, TD_disclosure, customer_disclosure]
  period_convention: POINT
  consolidation: consolidated
  accounting_standard_note: "N21 と同じ開示基準の日米差。"
  zero_denominator_policy: "REV>0。金額が不明なら定性スコアで代替。"
  missing_bias: >-
    **獲得は開示され、喪失は開示されにくい**という非対称がある。
    企業は良い知らせを積極的に出すので、**N41 は正の方向に偏る。**
    喪失は N21（顧客の業績変化）や X15（顧客の株価）から推定するしかない。
  correlated_with: [N21, X15, I25, V02, T18, C11]
  economic_rationale: >-
    **小型株では単独で株価を決める。** 売上の30%を占める顧客を失えば、
    それだけで事業が成立しなくなる。I25（単一要因への依存度）と T18（顧客集中リスク）が
    静的なリスクを測るのに対し、N41 はそれが現実化したイベントを捉える。
    **開示の非対称性があるので、喪失側は X15（顧客の株価）で先回りする方が確実。**
  evidence_tier: T3
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP CustomerMomentum t=3.8 との関連。イベントとしての実証は未確認"
  markets: [JP, US]
  review: {status: verified}

N45:
  formula: "LLM が「想定カタリストが顕在化するまでの月数」を推定"
  inputs: [LLM, T23]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  nonlinear: "abs_dev(x_star=sector_median)"
  zero_denominator_policy: "na（月数）"
  missing_bias: >-
    **完全に LLM 依存で、過去に遡れない**（T カテゴリと同じ制約。§6.4 の前向き記録が必要）。
    さらに **LLM の期間推定は較正されていない** — 「6ヶ月」と言ったものが
    実際に6ヶ月で起きる頻度は未知。T44（較正記録）が貯まるまで信用度は不明。
  correlated_with: [T23, T24, T29, T30, R18, R19, N14]
  economic_rationale: >-
    ∩型。**保有期間 6M〜5Y の設計では「いつ起きるか」が決定的。**
    3ヶ月で起きるカタリストは既に価格に入っている可能性が高く、
    10年後のカタリストは待つコストが大きすぎる。
    §1.5 の h*（想定保有期間）の直接の入力になり、R19（カタリストの期限超過）で
    事後検証される。**「いつまでも起きないカタリスト」が最も資本効率を毀損する。**
  evidence_tier: T3
  references:
    - "構造的判断。LLM 由来のため §6.4 のカットオフ後検証・前向き記録が必要"
  markets: [JP, US]
  review: {status: verified}

N46:
  formula: "長期(3-5年)EPS成長率予想 - 短期(1年)EPS成長率予想"
  inputs: [EST_long_term_growth, EST_short_term_growth]
  period_convention: GUIDE_CONS
  consolidation: consolidated
  accounting_standard_note: "コンセンサス。ベンダーごとに長期成長率の定義が違う。"
  zero_denominator_policy: "na（差分）。いずれかが欠損なら欠損。"
  missing_bias: >-
    **長期成長率予想を出すアナリストは短期より少ない**ので、
    N10 よりさらに欠損が多い。日本の小型株ではほぼ使えない（OQ-22 と同根）。
  correlated_with: [N10, N11, N47, A26, C26, A42]
  economic_rationale: >-
    **長期だけ強気なのは、実現しない期待の兆候。**
    短期は検証されるが長期は検証されないので、アナリストは長期に楽観を逃がす。
    N47（長期成長率予想が高い銘柄は劣後、OSAP `fgr5yrLag` t=4.9）と、
    A26（インプライド成長率）、C26（平均回帰調整）が同じ現象を別角度から捉えている。
    **「高成長の物語」に高い値段が付いているときに買わないための装置。**
  evidence_tier: T2
  references:
    - "https://www.openassetpricing.com/"
    - "OSAP EarningsForecastDisparity t=5.1 / fgr5yrLag t=4.9"
  markets: [JP, US]
  review: {status: verified}

N49:
  formula: "z(コンセンサス推奨) × z(空売り残高比率)"
  inputs: [N48, K19]
  period_convention: GUIDE_CONS
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "N48 または K19 が欠損なら欠損。"
  missing_bias: >-
    **K19（空売り残高）は米国の制度（月2回公表）。日本は K09（0.5%以上の個別報告）で
    粒度が違う。** N48（推奨）も日本の小型株では欠損。**実質的に米国大型株専用。**
  correlated_with: [N48, N12, K19, K20, K21, K52]
  economic_rationale: >-
    **アナリストが強気で空売りも多い銘柄は特に危険。**
    情報を持つ空売り筋とセルサイドの見解が正面から対立している状態で、
    実証では空売り側が正しい（OSAP `Recomm_ShortInterest` t=4.1）。
    N48（推奨が高い銘柄ほど劣後、t=3.2）を空売り情報で増幅した形。
    **セルサイドの推奨を逆張り指標として使う**という、直感に反するが頑健な関係。
  evidence_tier: T1
  references:
    - "https://www.openassetpricing.com/"
    - "https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf"
    - "OSAP Recomm_ShortInterest t=4.1 / ConsRecomm t=3.2"
  markets: [US]
  review: {status: verified}
