# --- Q セクター・相関・ポートフォリオ文脈 --------------------------------------

Q01:
  formula: "max_j corr( r_i, r_j )、j は保有銘柄、日次252日"
  inputs: [PRICE, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "共通観測が60日未満なら欠損。"
  missing_bias: "上場1年未満で欠損。売買停止日が多い銘柄で推定が歪む。"
  correlated_with: [Q02, Q06, Q13, Q16, Q03]
  economic_rationale: >-
    **0.7超なら実質同じ銘柄。** §1.6 で集中設計（rho 高）を採るほど、
    残す銘柄間の相関管理が重要になる。ただし**平時の相関は危機時に役に立たない**
    （Q13）ので、これだけで分散できたと考えてはいけない。
  evidence_tier: T2
  references: ["構造的判断。分散の数学 LAW-06"]
  markets: [JP, US]
  review: {status: verified}

Q02:
  formula: "mean_j corr( r_i, r_j )"
  inputs: [PRICE, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "Q01 と同じ。"
  missing_bias: "Q01 と同じ。"
  correlated_with: [Q01, Q13, Q14, Q04]
  economic_rationale: >-
    ポートフォリオ全体の分散度。Q01（最大）が個別の重複を見るのに対し、
    Q02（平均）は全体の凝集度を見る。**実効銘柄数（Q14）と併せて、
    「20銘柄持っているが実質5銘柄」という状態を検出する。**
  evidence_tier: T2
  references: ["構造的判断。LAW-06"]
  markets: [JP, US]
  review: {status: verified}

Q03:
  formula: "SUM( セクター別ウェイト^2 )"
  inputs: [SELF_positions, sector_classification]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: "業種分類の欠損で計算不能。"
  correlated_with: [Q01, Q02, Q11, Q14, V13]
  economic_rationale: >-
    セクター集中度。**追加後の HHI を計算して閾値超過なら減点する**という
    後段補正に使う。ただし 263AT は小型株中心なので、
    **そもそもセクターが偏りやすい**（小型株が多い業種と少ない業種がある）。
    厳しく管理しすぎるとユニバースを失う。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Q04:
  formula: "d(sigma_p) / d(w_i)"
  inputs: [PRICE, SELF_positions, I03]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "ポートフォリオのボラがゼロなら欠損。"
  missing_bias: "共分散行列の推定に依存。保有銘柄数が少ないと不安定。"
  correlated_with: [Q01, Q02, Q05, Q12, I03, I16]
  economic_rationale: >-
    **単独リスクではなくポートフォリオへの寄与で判断する。**
    高ボラでも既存保有と負相関なら、全体のリスクは下がる。
    §1.6 の Kelly サイジングは単独の sigma を使うが、
    **本来は限界リスク寄与で調整すべき**（未実装。次の改訂候補）。
  evidence_tier: T2
  references: ["構造的判断。LAW-06 / §1.6"]
  markets: [JP, US]
  review: {status: verified}

Q05:
  formula: "d(E[U_p]) / d(w_i)"
  inputs: [mu_hat, Q04, lambda]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: "期待リターン推定（§1.4）に依存。**b_h が有意でなければこの値も無意味。**"
  correlated_with: [Q04, Q12, R11, S12]
  economic_rationale: >-
    **Q04 との比が実質的な採用基準。** 期待効用の増加をリスクの増加で割った値が
    高い順に組み入れる。**§1.4 の較正（スコア → 期待リターン）ができていないと
    計算できない**ので、Phase 3 までは使えない。
  evidence_tier: T3
  references: ["構造的判断。§1.4 / §1.6"]
  markets: [JP, US]
  review: {status: verified}

Q06:
  formula: "LLM による既存保有とのテーマ類似度 0-1"
  inputs: [LLM, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: "LLM 依存。過去に遡れない（§6.4）。"
  correlated_with: [Q01, Q02, Q13, Q16, R22, T21]
  economic_rationale: >-
    **相関では見えない「同じ賭け」を検出する。**
    半導体 × AI × 電力インフラは、過去の相関が低くても同じシナリオに依存している。
    **LLM を使うと「今の物語」に引っ張られて集中しやすい**（§8-5）ので、
    LLM 自身にその重複を検出させるという構造にしている。
  evidence_tier: T3
  references: ["構造的判断。LLM 由来のため前向き記録が必要"]
  markets: [JP, US]
  review: {status: verified}

Q07:
  formula: "SUM( w_i × P08_i )"
  inputs: [P08, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  nonlinear: "abs_dev(x_star=0)"
  missing_bias: "P08（銘柄別為替感応度）の推定に依存。"
  correlated_with: [P07, P08, P21, Q15, S18, V07]
  economic_rationale: >-
    ∩型（ゼロが最適とは限らないが、意図しない大きな露出は避ける）。
    **日米両方に投資するので二重に効く** — 米国株を持つこと自体がドル露出であり、
    さらに日本の輸出企業もドル感応度を持つ。**気づかないうちに為替に大きく賭けている**
    という状態が起きやすい。Q08（投信部分）まで含めて見ないと全体が分からない。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Q08:
  formula: "保有投信の組入上位銘柄と個別株保有の重複ウェイト"
  inputs: [SELF_fund_holdings, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: >-
    **投信の組入銘柄は月次開示で、しかも上位10銘柄程度しか出ない。**
    インデックス投信なら構成銘柄が分かるが、アクティブ投信は不透明。
    **全体像は原理的に把握できない。**
  correlated_with: [Q01, Q06, Q07, Q15, Q11]
  economic_rationale: >-
    **全体ポートフォリオの90%が投信である以上、これを見ないのは片手落ち。**
    §1.8 のバーベル構造（90%投信 + 10%個別株）が成立する前提は、
    両者が独立であること。個別株が投信と同じ銘柄なら、
    **バーベルではなく単なる集中になっている。**
    ただし上記の通り把握には限界があるので、**セクター・地域レベルで近似する**のが現実的。
  evidence_tier: T3
  references: ["構造的判断。catalog §1.8 のバーベル前提"]
  markets: [JP, US]
  review: {status: verified}

Q09:
  formula: "業種内での S_buy の順位"
  inputs: [S_buy, sector_classification]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "業種内の銘柄数が5未満なら欠損。"
  missing_bias: "業種分類の欠損。T21（LLM による真の競合特定）で母集団を置き換える案がある。"
  correlated_with: [A25, A41, R22, T21, Q10]
  economic_rationale: >-
    **「この業種に賭けるなら、この銘柄が最善か」。**
    業種の追い風で全銘柄が上がっている局面では、
    銘柄選択の巧拙が見えなくなる。業種内順位で見れば、
    **業種要因を除いた選択能力が分かる。** A41（同業最安値スプレッド）と対。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Q10:
  formula: "r_i(6ヶ月) - median( r_同業(6ヶ月) )"
  inputs: [PRICE, sector_classification]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "業種内の銘柄数が3未満なら欠損。"
  missing_bias: "業種分類の欠損。"
  correlated_with: [G11, G27, Q09, L01, L09]
  economic_rationale: >-
    **一社だけ下がっているなら個社要因。** 業種全体が下がっているなら
    マクロかセクター要因で、意味が全く違う。
    **LLM で理由を調べるトリガーにする**という使い方が本質で、
    スコアへの直接寄与より、調査リソースの配分に使う（LAW-14 情報の価値）。
  evidence_tier: T2
  references: ["https://www.openassetpricing.com/", "OSAP IndMom / IndRetBig との関連"]
  markets: [JP, US]
  review: {status: verified}

Q11:
  formula: "ポートフォリオのファクター露出（バリュー/クオリティ/サイズ/モメンタム）"
  inputs: [SELF_positions, factor_loadings]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  nonlinear: "abs_dev(x_star=target_exposure)"
  missing_bias: "ファクター・ローディングの推定に Ken French データが要る（無料で取得可能）。"
  correlated_with: [Q03, Q07, Q08, Q13, P17, P23]
  economic_rationale: >-
    ∩型。**意図しないファクター賭けの検出。**
    銘柄単位で選ぶと必ずどこかに偏る。バリュー重視で選んだつもりが
    小型株ばかりになっている、といった事態を検出する。
    P23（ファクター混雑度）と組み合わせると、**混雑したファクターに
    知らないうちに全張りしている**という最悪の状態を防げる。
  evidence_tier: T2
  references: ["https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Q12:
  formula: "delta( mu_p / sigma_p ) 追加前後"
  inputs: [Q04, Q05, mu_hat]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "sigma_p がゼロなら欠損。"
  missing_bias: "期待リターン推定に依存。"
  correlated_with: [Q04, Q05, Q13, R10, R11]
  economic_rationale: >-
    Q04（限界リスク）と Q05（限界期待値）の統合。
    **採用可否の最終判断はこれで行う。** 単独のスコアが高くても、
    ポートフォリオのシャープを下げるなら入れない。
    OQ-24 の実測（合成シャープ 0.6〜1.0）を踏まえると、
    **1銘柄の追加でシャープが下がるなら、それは組み入れる価値がない。**
  evidence_tier: T3
  references: ["構造的判断。research/findings §7"]
  markets: [JP, US]
  review: {status: verified}

Q13:
  formula: "市場下落上位5%の日に限定した銘柄間相関"
  inputs: [PRICE, market_return, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "下落上位5%の日が20未満なら欠損。"
  missing_bias: "危機を含む長期の履歴が要る。**上場5年未満では危機を経験していない可能性がある。**"
  correlated_with: [Q01, Q02, I10, I16, I18, I28]
  economic_rationale: >-
    **平時の相関は危機時に役に立たない。** 危機では相関が1に近づき、
    分散効果が消える。Q01/Q02 で分散できたと思っていても、
    **本当に必要なときに機能しない**という致命的な誤算が起きる。
    I18（危機時パフォーマンス）と併せて、**ストレス下での実際の分散度**を測る。
  evidence_tier: T2
  references: ["構造的判断。危機時の相関上昇は広く観測される"]
  markets: [JP, US]
  review: {status: verified}

Q14:
  formula: "1 / SUM(w_i^2)"
  inputs: [SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "ポジションが無ければ欠損。"
  nonlinear: "abs_dev(x_star=N_target)"
  missing_bias: "na"
  correlated_with: [Q02, Q03, Q13, R10]
  economic_rationale: >-
    ∩型。**見かけの銘柄数ではなく実質的な分散度。**
    20銘柄でも1銘柄が50%なら実効銘柄数は約4。
    §1.8.3 で N_target を実測IC から導くと決めたので、
    **その目標値との乖離**を測るのがこの変数の役割。
    Bessembinder（4%の銘柄が全リターンを生む）を踏まえると、
    実効銘柄数が小さすぎると右裾を掴む確率が下がる。
  evidence_tier: T2
  references: ["https://www.zeninvestor.org/wp-content/uploads/2025/11/Do-stocks-outperform-T-bills.pdf", "catalog §1.8.3"]
  markets: [JP, US]
  review: {status: verified}

Q15:
  formula: "国別・通貨別のウェイト分布"
  inputs: [SELF_positions, J19]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  nonlinear: "abs_dev(x_star=target_allocation)"
  missing_bias: "na"
  correlated_with: [Q07, Q08, P07, P21, P22, S18]
  economic_rationale: >-
    ∩型。Q07（為替感応度の合計）が統計的な露出を測るのに対し、
    Q15 は名目的な配分を測る。**日米の配分比率は P22（相対バリュエーション）で
    動的に決めるべきだが、それはマクロ予測になるので §1.9 の
    「マクロで銘柄を選ばない」（LAW-78）と衝突する。**
    暫定的には固定比率（例: 50/50）にして、Q15 で乖離を監視するのが安全。
  evidence_tier: T3
  references: ["構造的判断。catalog LAW-78"]
  markets: [JP, US]
  review: {status: verified}

Q16:
  formula: "保有銘柄間の顧客・仕入先の重複度（LLM 判定）"
  inputs: [LLM, N21, L06, L07, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: "LLM 依存。顧客・仕入先の開示が薄い日本では推定精度が落ちる。"
  correlated_with: [Q01, Q06, Q13, L06, L07, N21]
  economic_rationale: >-
    **Q06（テーマ）でも相関でも見えない連鎖リスク。**
    同じ最終顧客に依存する2社は、テーマも業種も違って見えても
    同じ需要ショックで同時に沈む。L06/L07（サプライチェーン・モメンタム）が
    リターン予測に使う関係を、**リスク管理側から使う。**
  evidence_tier: T3
  references: ["https://www.openassetpricing.com/", "OSAP iomom_cust / iomom_supp と同根"]
  markets: [JP, US]
  review: {status: verified}

Q17:
  formula: "現金 / 個別株予算"
  inputs: [SELF_cash, PORTFOLIO_JPY]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "予算>0。"
  nonlinear: "abs_dev(x_star=target_cash)"
  missing_bias: "na"
  correlated_with: [P16, P10, Q14, R10, S05]
  economic_rationale: >-
    ∩型。**下落時の買い増し余地を確保する。**
    P16（市場ドローダウン）と連動させ、市場が下がったときに
    使える現金を持っておく。ただし**現金を持つこと自体は期待リターンを下げる**ので、
    タイミングを計ろうとすると LAW-78 に反する。
    **NISA 枠の年間上限（S05、240万円）があるので、
    そもそも一度に全額投入できない**という制度的な制約が、
    結果的にドルコスト平均法的な効果を生む点は指摘しておく価値がある。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Q18:
  formula: "NISA 保有銘柄の期待リターン順位 vs 全保有の期待リターン順位"
  inputs: [S04, S05, mu_hat, SELF_positions]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: "期待リターン推定に依存。日本固有。"
  correlated_with: [S04, S05, S06, S14, S10, S16]
  economic_rationale: >-
    **期待値が高い順に NISA を埋める**という原則の、ポートフォリオ全体での測定。
    ただし S06 で述べた通り単純な期待値順ではなく、
    **(a) NISA は損切りが救済されないので分散の小さい銘柄が向く、
    (b) 高配当米国株は外国税額控除が使えず不利（S10）**という
    2つの修正が要る。**税制の最適化は 263AT で最も日本固有かつ
    確実にリターンを改善できる領域**で、しかも予測不要なので確度が高い。
  evidence_tier: T3
  references: ["https://faq.sbisec.co.jp/answer/5ee86c0b144d40001145db08/", "構造的判断"]
  markets: [JP]
  review: {status: verified}

# --- Y ESG・非財務リスク -------------------------------------------------------

Y01:
  formula: "主要評価機関の ESG スコア"
  inputs: [ESG_rating]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: >-
    **カバレッジが大型株に強く偏る。** 日本の小型株はほぼ未評価。
    さらに**評価機関間の相関が低い**（同じ企業に真逆の評価が付く）ので、
    どの機関のスコアを使うかで結果が変わる。
  correlated_with: [Y02, Y03, Y12, W07, M27]
  economic_rationale: >-
    **単独のアルファ源としては証拠が弱い。** 評価機関間の不一致が大きいこと自体が、
    「ESG」という概念が測定可能な単一の量ではないことを示唆する。
    263AT では**需給要因（Y12 指数採用）とテールリスク（Y06/Y10）としてのみ扱い、
    水準はほぼ使わない。** ★1 の事前スケール 0.15 で強く縮小される。
  evidence_tier: T3
  references: ["構造的判断。ESG スコアの機関間不一致は広く報告されている"]
  markets: [JP, US]
  review: {status: verified}

Y02:
  formula: "Y01 の前年比変化"
  inputs: [Y01]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "前年のスコアが無ければ欠損。"
  missing_bias: "Y01 を継承。評価方法の変更でスコアが動くと誤検出する。"
  correlated_with: [Y01, Y04, Y12]
  economic_rationale: >-
    **水準よりモメンタムの方がまだ証拠がある。** 理由は需給
    — ESG 資金が改善企業に流入するため。因果ではなくフローの話。
    ただし評価機関が算定方法を変えただけでもスコアが動くので、
    **変化の原因を確認しないと誤検出する。**
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Y03:
  formula: "(Scope1 + Scope2 排出量) / REV"
  inputs: [emissions, REV]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: >-
    **算定基準（GHG プロトコル）は共通だが、集計範囲が企業判断。**
    Scope2 のマーケット基準とロケーション基準で数値が変わる。
  zero_denominator_policy: "REV>0。排出量の開示が無ければ欠損。"
  missing_bias: "**開示企業に偏る。** 日本は東証プライムで実質義務化されているが、スタンダード・グロースは任意。"
  correlated_with: [Y04, Y05, Y10, V07, P30]
  economic_rationale: >-
    **炭素税・排出量取引が導入されれば直接コストになる。**
    5年ホライズンでは制度変更（P30）の確率が無視できないので、
    アルファではなく**将来コストの現在価値**として扱う。
    排出量原単位が業種中央値の数倍なら、制度変更時の打撃が大きい。
  evidence_tier: T3
  references: ["GHG プロトコル", "https://www.jpx.co.jp/english/equities/follow-up/02.html"]
  markets: [JP, US]
  review: {status: verified}

Y04:
  formula: "排出削減目標に対する実績の進捗率"
  inputs: [Y03, emission_targets, LLM]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "目標が無ければ欠損。"
  missing_bias: "目標を掲げる企業に偏る。**目標を掲げない企業を評価できない。**"
  correlated_with: [Y03, Y02, N18, T11]
  economic_rationale: >-
    **目標だけの企業と実行企業の区別。** N18（中計の達成率）と
    T11（経営陣の約束履行率）の環境版で、**同じ「約束を守るか」という
    企業文化の指標**として見る方が、環境そのものより情報量が多いかもしれない。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Y05:
  formula: "1 if 化石燃料・武器・たばこ・ギャンブル等に該当 else 0"
  inputs: [LLM, sector_classification, REV_breakdown]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（ブール値）"
  missing_bias: "該当業種の判定に売上構成が要る。副業として該当事業を持つ企業を取りこぼす。"
  correlated_with: [Y01, Y12, O13, K26]
  economic_rationale: >-
    **符号が相殺する厄介な変数。** 機関のダイベストメントで売り圧力を受ける（負）が、
    **その結果として割安になる**（正）。OSAP `sinAlgo` t=2.0 は正の符号
    — つまり**避けられる銘柄の方が儲かる**という結果。
    これは O カテゴリ（ネグレクト）と同じ構造で、
    **「機関が持てない」ことが個人の機会になる**典型例。
    ただし本人の価値観で除外したい場合は、これをゲートにする選択もありうる。
  evidence_tier: T1
  references: ["https://www.openassetpricing.com/", "OSAP sinAlgo t=2.0"]
  markets: [JP, US]
  review: {status: verified}

Y06:
  formula: "過去5年の重大な不祥事の件数"
  inputs: [NEWS, LLM]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（カウント）"
  missing_bias: >-
    **報道依存なので小型株で見逃す**（N36/N37/W14 と同型）。
    O カテゴリと逆方向で、**ネグレクト銘柄で悪材料を見逃す**という
    リスク管理上まずい偏りが、Y カテゴリにも共通して現れる。
  correlated_with: [Y07, Y09, W14, N36, N37, E12, E08]
  economic_rationale: >-
    **再発率が高い。組織文化の指標として実用的。**
    1件目を「不運」と見るか「兆候」と見るかで判断が変わるが、
    実務的には兆候と見るべき。E08/E12（会計上の問題）、W14（労務）、
    N36/N37（製品・情報）と合わせて、**組織の統制の弱さを横断的に測る。**
  evidence_tier: T3
  references: ["構造的判断。不祥事の再発率に関する体系的な実証は未確認"]
  markets: [JP, US]
  review: {status: verified}

Y07:
  formula: "訴訟・行政処分の件数と規模 / MCAP"
  inputs: [LLM, EDINET, SEC_legal, MCAP]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "N20 と同じ日米の開示基準差（米国の方が広い）。"
  zero_denominator_policy: "MCAP>0。"
  missing_bias: "N20 と同じ。米国はクラスアクションが多く制度差が数値差になる。"
  correlated_with: [N20, Y06, Y10, D21, E12]
  economic_rationale: >-
    N20（現在係争中）が現在を見るのに対し、Y07 は履歴を見る。
    **訴訟の多い企業は訴訟を招く事業慣行を持っている**可能性が高く、
    Y06（不祥事）と同じ「再発する」性質を持つ。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Y08:
  formula: "強制労働懸念地域への調達・生産依存度"
  inputs: [LLM, V08, supply_chain]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: "**サプライチェーンの2次以降が見えない。** 直接取引先しか分からず、過小評価に偏る。"
  correlated_with: [V08, T19, Y10, N38, P30]
  economic_rationale: >-
    **米国 UFLPA 等で輸入差止のリスク。** 実際に発動されると
    売上が即座に止まるので、テールリスクとして無視できない。
    V08（中国エクスポージャー）と重なるが、
    **こちらは規制リスクという具体的な発現経路を持つ。**
  evidence_tier: T3
  references: ["米国: Uyghur Forced Labor Prevention Act (UFLPA)", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Y09:
  formula: "個人データ取扱量とプライバシー規制への露出度"
  inputs: [LLM, V07, business_model]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: "LLM 推定。ネット企業に偏る。"
  correlated_with: [Y07, N37, T20, V07]
  economic_rationale: >-
    **GDPR の制裁金は全世界売上の最大4%**という規模なので、
    利益ではなく売上に対して科される点が特異。
    N37（情報漏洩）が事故を見るのに対し、Y09 は規制への構造的な露出を見る。
  evidence_tier: T3
  references: ["EU GDPR Art.83", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

Y10:
  formula: "環境関連の引当金 + 推定潜在債務 / EQ"
  inputs: [environmental_provisions, LLM, EQ]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: >-
    **引当計上の基準が国で違う。** 米国 ASC 410（資産除去債務）は範囲が広く、
    日本は限定的。**日本企業の方が簿外に残りやすい。**
  zero_denominator_policy: "EQ>0。債務超過なら D02 で既に除外。"
  missing_bias: "潜在債務の推定は LLM 頼み。化学・重工業以外ではほぼゼロ。"
  correlated_with: [Y03, Y07, D21, D20, E11]
  economic_rationale: >-
    **簿外の巨額債務になりうる。** 土壌汚染・アスベスト・原状回復義務は、
    発覚した時点で自己資本を大きく毀損する。
    D21（保証債務）と同じく**貸借対照表に載っていないリスク**で、
    バリュー指標（A03 PBR）を見ているだけでは絶対に気づけない。
  evidence_tier: T3
  references: ["米国: ASC 410（資産除去債務）", "日本: 資産除去債務に関する会計基準"]
  markets: [JP, US]
  review: {status: verified}

Y11:
  formula: "主要拠点の水害・地震ハザードマップ上のリスク評価"
  inputs: [LLM, facility_locations, hazard_maps]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（スコア）"
  missing_bias: >-
    **拠点の所在地は有報の「主要な設備の状況」から取れるが、粒度が粗い**
    （市区町村レベル）。サプライヤーの拠点は分からない。
  correlated_with: [N38, V07, V08, Y10, I18]
  economic_rationale: >-
    **日本は地震・水害リスクが構造的に高い。** 5年ホライズンでは
    大規模災害の発生確率が無視できない。ただし**定量化が極めて難しく、
    しかも保険でカバーされる部分がある**ので、実効的なリスクは推定値より小さい。
    ★1 で強く縮小されるのが妥当。
  evidence_tier: T3
  references: ["構造的判断。定量化手法が確立していない"]
  markets: [JP, US]
  review: {status: verified}

Y12:
  formula: "主要 ESG 指数への採用・除外イベント"
  inputs: [index_membership]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na（分類）"
  missing_bias: "指数の構成銘柄リストが必要。日本は GPIF 採用指数が公表されている。"
  correlated_with: [K12, K13, K26, O13, Y01, Y02]
  economic_rationale: >-
    **純粋な需給イベントとして扱う**（K13 の指数採用と同種）。
    日本は GPIF が ESG 指数に巨額を配分しているので、
    **採用・除外の需給インパクトが他国より大きい。**
    Y01（スコア水準）にアルファが無くても、
    **指数採用というイベントには需給効果がある**という切り分けが重要。
  evidence_tier: T3
  references: ["https://www.openassetpricing.com/", "K13（指数イベント）と同種の需給効果"]
  markets: [JP, US]
  review: {status: verified}

# =============================================================================
# U（業種固有KPI 44）+ X（オルタナデータ 16）= 60件
#
# U カテゴリに共通する4つの制約（個別に繰り返さず、ここに一度だけ書く）:
#   (1) 業種内でのみ正規化する。非該当業種は欠損（rank_industry）
#   (2) **業種判定のロジックが未実装**（spec SP-04）。GICS の日本株付与も未解決（SP-03）
#   (3) 疎（sparse）なので §1.9 の縮小では扱いにくい。業種ダミーとの交互作用にすべき（OQ-18）
#   (4) **多くが自主開示に依存**するので、開示企業に偏る（Z03 で監視）
#
# X カテゴリに共通する3つの制約:
#   (1) **過去に遡れない。** forward_log で今日から記録しないと永遠に検証できない（§6.4）
#   (2) 取得の安定性が低い（規約・レート制限・仕様変更）
#   (3) 主軸にせず、他シグナルの裏取りと早期警戒に使う
# =============================================================================

# --- U-1 金融 -----------------------------------------------------------------

U01:
  formula: "(資金運用収益 - 資金調達費用) / 平均運用資産"
  inputs: [interest_income, interest_expense, earning_assets]
  period_convention: AVG
  consolidation: consolidated
  accounting_standard_note: "銀行業のみ。運用資産の定義が国で違う（日本は貸出金+有価証券、米国は earning assets）。"
  zero_denominator_policy: "運用資産>0。銀行業以外では欠損。"
  missing_bias: "銀行業のみ。日本の地銀は全社取得可能。"
  correlated_with: [U02, U03, U04, U05, P01, P05, D25]
  economic_rationale: >-
    **日本の金利正常化で最大の追い風。** ゼロ金利下では預金金利を下げられず
    利鞘が潰れていたが、金利上昇局面では貸出金利が先に上がる。
    地銀の再評価テーマの中核で、**P05（日銀スタンス）との交互作用が本質。**
    ただし同時に U02（与信費用）が悪化するので、正味の効果は両者の差。
  evidence_tier: T3
  references: ["構造的判断。銀行分析の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U02:
  formula: "与信関係費用 / 貸出金残高"
  inputs: [credit_costs, loans]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "**IFRS9 / CECL で予想信用損失モデルに移行し、計上タイミングが前倒しになった。** 移行年は不連続。"
  zero_denominator_policy: "貸出金>0。"
  missing_bias: "銀行業のみ。"
  correlated_with: [U01, U03, D08, D09, P11, P15]
  economic_rationale: >-
    **景気後退の先行指標。** 銀行の与信費用は借り手の悪化を最初に反映するので、
    P11（クレジットスプレッド）と並んで**株式市場より早く壊れる指標。**
    急増は個別銀行の問題であると同時に、**マクロの警告**でもある。
  evidence_tier: T3
  references: ["IFRS 9 / ASC 326（CECL）", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U03:
  formula: "金融再生法開示債権 / 総与信"
  inputs: [disclosed_claims, total_credit]
  period_convention: POINT
  consolidation: consolidated
  accounting_standard_note: "**日本の金融再生法開示基準は日本固有。** 米国は non-performing loans で定義が違う。"
  zero_denominator_policy: "総与信>0。"
  missing_bias: "銀行業のみ。日本は開示義務があるので全行取得可能。"
  correlated_with: [U01, U02, D08, D09]
  economic_rationale: >-
    U02（フロー）に対するストック。**残高が積み上がっている銀行は、
    将来の与信費用が確定的に発生する。** ただし引当済みの部分は既に費用化されているので、
    引当率と併せて見ないと二重計上になる。
  evidence_tier: T3
  references: ["金融機能の再生のための緊急措置に関する法律 第6条", "構造的判断"]
  markets: [JP]
  review: {status: verified}

U04:
  formula: "経費 / 業務粗利益"
  inputs: [operating_expenses, gross_operating_profit]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "**業務粗利益は日本の銀行会計固有の概念。** 米国は efficiency ratio で近い。"
  zero_denominator_policy: "業務粗利益>0。負なら欠損。"
  missing_bias: "銀行業のみ。"
  correlated_with: [U01, U05, B08, B31]
  economic_rationale: >-
    銀行の効率性。**日本の地銀は70%超が多く、構造的に高コスト。**
    B31（販管費率のトレンド）の銀行版で、水準より改善方向が効く。
    店舗統廃合・システム共同化の進捗を反映する。
  evidence_tier: T3
  references: ["構造的判断。銀行分析の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U05:
  formula: "貸出金 / 預金"
  inputs: [loans, deposits]
  period_convention: POINT
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "預金>0。"
  nonlinear: "abs_dev(x_star=sector_median)"
  missing_bias: "銀行業のみ。"
  correlated_with: [U01, U04, D07]
  economic_rationale: >-
    ∩型。**高すぎると流動性リスク**（預金流出に耐えられない — SVB の破綻が典型）、
    **低すぎると収益機会の逸失**（預金が有価証券運用に回り、金利上昇で含み損になる）。
    日本の地銀は預貸率が低く、**その余資が国債運用に回っているので
    金利上昇が含み損を生む**という、U01（NIM改善）と逆方向の効果がある。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U06:
  formula: "(正味支払保険金 + 事業費) / 正味収入保険料"
  inputs: [claims, expenses, premiums]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "**損保のみ。** 日本と米国で事業費の範囲が違う。"
  zero_denominator_policy: "保険料>0。"
  missing_bias: "損保のみ。生保では意味を持たない（U07 を使う）。"
  correlated_with: [U07, U08, B08]
  economic_rationale: >-
    **100%未満で引受利益。これが損保の本業の成績。**
    100%を超えていても資産運用益で黒字になるが、それは本業ではない。
    **自然災害の多い年は悪化するので、Y11（気候物理リスク）が直接効く数少ない業種。**
  evidence_tier: T3
  references: ["構造的判断。損保分析の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U07:
  formula: "エンベディッド・バリュー / 時価総額"
  inputs: [embedded_value, MCAP]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: >-
    **EV の算定は各社の前提（割引率・死亡率・解約率）に依存し、監査対象外。**
    企業間比較には注意が要る。IFRS17 移行で状況が変わりつつある。
  zero_denominator_policy: "MCAP>0。EV を開示しない生保では欠損。"
  missing_bias: "生保のみ。開示は任意なので開示企業に偏る。"
  correlated_with: [U06, U08, A03, A28]
  economic_rationale: >-
    **通常の PER は生保にほぼ無意味。** 保険契約は数十年にわたるので、
    単年度利益では価値を測れない。EV は保有契約の将来利益の現在価値で、
    **A28（残余利益モデル）と同じ発想を保険業に特化させたもの。**
    EV/時価総額が1を大きく超える生保が日本には存在する。
  evidence_tier: T3
  references: ["構造的判断。EV は業界標準だが監査対象外"]
  markets: [JP, US]
  review: {status: verified}

# --- U-2 不動産・REIT ---------------------------------------------------------

U09:
  formula: "MCAP / 純資産価値（保有不動産を鑑定評価額で置き換えた自己資本）"
  inputs: [MCAP, appraisal_value, EQ, IBD]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: >-
    **日本は賃貸等不動産の時価が注記で開示される**（企業会計基準第20号）。
    米国は原価主義で時価開示が無いことが多く、**日本の方が計算しやすい。**
  zero_denominator_policy: "NAV<=0 なら欠損（債務超過相当）。"
  missing_bias: "不動産業・REIT のみ。時価注記のない企業では計算不能。"
  correlated_with: [U11, U12, U13, A03, A19, A34]
  economic_rationale: >-
    **簿価ベースの PBR より遥かに意味がある。** 不動産は取得原価で計上されるので、
    含み益が大きい企業ほど PBR が高く見えて割高に見誤る。
    **日本の老舗不動産会社の PBR が低いのは、含み益が簿価に反映されていないため。**
    A19（不動産含み益）を業種特化させた形。
  evidence_tier: T3
  references: ["企業会計基準第20号（賃貸等不動産の時価等の開示）", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U10:
  formula: "稼働面積 / 賃貸可能面積"
  inputs: [occupancy_disclosure]
  period_convention: POINT
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "賃貸可能面積>0。"
  missing_bias: "**J-REIT は月次開示が多いが、事業会社の不動産部門は年次。** 開示頻度が大きく違う。"
  correlated_with: [U09, U11, U13, C13, C11]
  economic_rationale: >-
    **月次開示されるので決算より速い。** C13（既存店売上）と同じ性格で、
    不動産の需給を直接反映する。稼働率の低下は賃料下落に先行するので、
    U11（キャップレート・スプレッド）の悪化を予告する。
  evidence_tier: T3
  references: ["構造的判断。REIT 分析の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U11:
  formula: "NOI利回り - 長期国債利回り"
  inputs: [NOI, appraisal_value, MACRO_10y]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "NOI の定義（減価償却前か後か）が企業で違う。減価償却前に統一する。"
  zero_denominator_policy: "鑑定評価額>0。"
  missing_bias: "A38 と同じく日米で使う国債が違うので、統合ランクを取ってはいけない（rank_market が妥当）。"
  correlated_with: [U09, U12, U14, A38, A12, P01, P02]
  economic_rationale: >-
    **不動産は金利上昇に最も脆弱な業種。** キャップレートが金利に連動するので、
    金利が1%上がれば不動産価格は理論上大きく下がる。
    **日本の金利正常化局面（P05）では、U01（銀行のNIM改善）と正反対の効果を受ける。**
    A38（FCF利回りスプレッド）の不動産版。
  evidence_tier: T3
  references: ["構造的判断。不動産評価の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U12:
  formula: "有利子負債 / 総資産（時価ベース）"
  inputs: [IBD, appraisal_value, TA]
  period_convention: POINT
  consolidation: consolidated
  accounting_standard_note: "分母を時価にするか簿価にするかで大きく違う。時価に統一する。"
  zero_denominator_policy: "総資産>0。"
  missing_bias: "REIT は規約で上限が定まっているので分布が狭い。事業会社では広い。"
  correlated_with: [U09, U11, D01, D02, D03]
  economic_rationale: >-
    **REIT には上限規律があり、超えると増資を迫られる。**
    D01/D02（一般的なレバレッジ指標）が業種調整を要するのに対し、
    U12 は業種固有の閾値が明確。**LTV が上限に近い REIT は、
    不動産価格が下がると強制的に増資（F05）することになる**ので、
    希薄化リスクの先行指標でもある。
  evidence_tier: T3
  references: ["投資信託及び投資法人に関する法律（REIT の借入制限）", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U13:
  formula: "(鑑定評価額 - 簿価) / 簿価"
  inputs: [appraisal_value, book_value]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "日本の時価注記から取得。米国は原価主義で開示が無いことが多い。"
  zero_denominator_policy: "簿価>0。"
  missing_bias: "**日本優位。** 米国では計算できない企業が多い。"
  correlated_with: [U09, A19, A18, A03]
  economic_rationale: >-
    A19（不動産含み益）の業種特化版。**日本の老舗企業に眠る隠れ資産。**
    ただし**顕在化しないと意味がない**ので、N43（不動産売却）や
    M08（アクティビスト保有）といったカタリストと併用する。
    東証の資本コスト要請（LAW-47）が是正圧力になっている。
  evidence_tier: T3
  references: ["企業会計基準第20号", "構造的判断"]
  markets: [JP]
  review: {status: verified}

U14:
  formula: "分配金利回り - 長期国債利回り"
  inputs: [distribution_yield, MACRO_10y]
  period_convention: TTM
  consolidation: na
  accounting_standard_note: "REIT のみ。"
  zero_denominator_policy: "na（差分）"
  missing_bias: "REIT のみ。事業会社では A12（益回りスプレッド）を使う。"
  correlated_with: [U11, U12, A11, A12, A38, P01]
  economic_rationale: >-
    REIT のバリュエーション。**利益の90%超を分配する法的構造なので、
    分配金利回りが実質的に益回りに等しい。** したがって A12（益回りスプレッド）と
    ほぼ同義だが、REIT では分配金の方が確実性が高い。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

# --- U-3 小売・外食・消費 -----------------------------------------------------

U15:
  formula: "同一店舗ベースの売上 YoY（月次）"
  inputs: [monthly_disclosure, LLM]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: "C13 と同一定義。「既存店」の定義が企業ごとに違う。"
  zero_denominator_policy: "na（YoY）"
  missing_bias: "**月次開示企業に偏る。日本は比較的多いが米国は少ない。**"
  correlated_with: [C13, U16, U18, X11, X14]
  economic_rationale: >-
    C13 と同一の量で、業種特化として重複して持つ。
    **月次開示なので決算より遥かに速く、日本の小売・外食では最重要指標。**
    U16 との分解が本質で、単独では値上げによる嵩上げを見抜けない。
  evidence_tier: T2
  references: ["構造的判断。小売分析の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U16:
  formula: "既存店売上 YoY を 客数 YoY と客単価 YoY に分解"
  inputs: [U15, monthly_disclosure]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: "客数・客単価の両方を開示する企業に限られる。"
  zero_denominator_policy: "na（分解）"
  missing_bias: "**分解を開示する企業はさらに少ない。** U15 は出すが分解は出さない企業が多い。"
  correlated_with: [U15, C25, B36, B18, U19]
  economic_rationale: >-
    **客数減を値上げで補う成長は持続しない。** 客数が減っているのに
    売上が伸びているのは、既存顧客からより多く取っているだけで、
    やがて顧客が離れる。C25（価格 vs 数量）を小売に特化させた形で、
    **C25 が全業種で推定に頼るのに対し、小売では実測値が取れる**という利点がある。
  evidence_tier: T3
  references: ["構造的判断。小売分析の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U17:
  formula: "売上 / 売場面積"
  inputs: [REV, floor_area]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "売場面積の定義（総面積か賃貸面積か）が企業で違う。"
  zero_denominator_policy: "売場面積>0。"
  missing_bias: "面積を開示する企業に偏る。業態内でのみ比較可能（コンビニと百貨店は比較不能）。"
  correlated_with: [U15, U18, B11, B44]
  economic_rationale: >-
    小売の資産効率。B11（総資産回転率）を物理的な資産で測った版。
    **業態内でのみ意味を持つ**ので、U カテゴリの中でもさらに細かい
    業態分類が要る（spec SP-04 の課題）。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U18:
  formula: "新規出店数 - 閉店数"
  inputs: [store_count, TD_disclosure]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "na（差分）"
  missing_bias: "店舗数を開示する企業に偏る。X10（地図サービスからの実測）で代替可能。"
  correlated_with: [U15, U17, C14, C29, X10, C35]
  economic_rationale: >-
    **符号は文脈依存。** 出店は成長だが、C35（資産成長アノマリー）の観点では
    投資しすぎのリスク。**U15（既存店）が良い企業の出店は加点、
    悪い企業の出店は減点**という交互作用が本質で、B04（ROIC-WACC）が条件変数。
    C カテゴリの「アウトプット vs インプット」の整理がここでも当てはまる。
  evidence_tier: T3
  references: ["構造的判断。catalog §4-C の符号整理"]
  markets: [JP, US]
  review: {status: verified}

U19:
  formula: "在庫回転日数 × 商材の陳腐化速度（LLM 判定 0-1）"
  inputs: [B22, LLM, product_category]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "在庫の評価方法（低価法の適用）が企業で違う。"
  zero_denominator_policy: "在庫がゼロなら欠損（サービス業）。"
  missing_bias: "陳腐化速度を LLM が判定するので、商材分類の誤りが直接効く。"
  correlated_with: [B22, B35, C36, U15, U16]
  economic_rationale: >-
    **アパレル・家電・PC で致命的。** 同じ在庫日数でも、
    生鮮食品と鉄鋼では意味が全く違う。B22（在庫回転日数の変化）に
    商材の性質を掛けることで、**評価損のリスクを業種横断で比較可能にする。**
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U20:
  formula: "EC売上 / 総売上 とその変化"
  inputs: [ec_revenue, REV, LLM]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "EC の定義（自社サイトのみか、モール経由を含むか）が企業で違う。"
  zero_denominator_policy: "REV>0。EC 売上を開示しない企業では欠損。"
  missing_bias: "開示企業に偏る。X01（Webトラフィック）で外部から推定できる。"
  correlated_with: [X01, X02, U15, U17, C24]
  economic_rationale: >-
    チャネル移行の進捗。EC 比率が高いほど**店舗の固定費が軽く、
    U17（坪効率）の悪化に耐えられる。** ただし EC は価格競争が激しく
    粗利率（B07）が下がるトレードオフがある。
    **X01（Webトラフィック）で外部から検証できる稀な開示項目。**
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

# --- U-4 製造・機械・電子部品・半導体 ------------------------------------------

U21:
  formula: "受注残高 / (REV_TTM / 12)"
  inputs: [order_backlog, REV]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "C11 と同じ受注残の定義問題を継承。"
  zero_denominator_policy: "REV>0。受注残を開示しない企業では欠損。"
  missing_bias: "**開示業種が限られる**（機械・建設・IT・造船）。C11 と同じ。"
  correlated_with: [C11, U22, U44, C12, N16]
  economic_rationale: >-
    **何ヶ月分の仕事が確定しているか。** C11（受注残の成長率）が変化を測るのに対し、
    U21 は水準を月商で正規化する。**企業規模の影響を除けるので企業間比較ができる。**
    3ヶ月分と12ヶ月分では業績の確実性が全く違う。
  evidence_tier: T1
  references: ["https://www.openassetpricing.com/", "OSAP OrderBacklog t=2.4"]
  markets: [JP, US]
  review: {status: verified}

U22:
  formula: "受注額 / 出荷額"
  inputs: [orders, shipments]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "出荷額>0。"
  missing_bias: >-
    **個社開示は少ないが、業界統計（SEMI 等）で取れる。**
    X14（業界統計との突合）と組み合わせると、個社の開示なしに業界サイクルが分かる。
  correlated_with: [U21, U25, X14, C11, P15]
  economic_rationale: >-
    **1を超えると拡大局面。半導体・機械のサイクル判定の標準指標。**
    受注は出荷に先行するので、売上が伸びる前に方向が分かる。
    **業界統計として公表されるので、個社より業界レベルで使う方が実用的**
    — そして業界の方向が分かれば L01（同業大型株のリターン）と同じ効果が得られる。
  evidence_tier: T3
  references: ["構造的判断。半導体・機械分析の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U23:
  formula: "実生産量 / 生産能力"
  inputs: [production, capacity]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: "生産能力の定義（定格か実効か）が企業で違う。"
  zero_denominator_policy: "生産能力>0。開示企業に限られる。"
  missing_bias: "**開示企業が非常に少ない。** 装置産業の一部のみ。"
  correlated_with: [U22, U25, B19, B20, C36]
  economic_rationale: >-
    **装置産業では利益率に直結する。** 固定費が大きいので、
    稼働率が損益分岐点（B20）を超えると急激に利益が出る
    — B19（営業レバレッジ）の物理的な裏付け。
    ただし開示が少なく、実用性は限定的。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U24:
  formula: "beta( 粗利率の変化 ~ 主要原材料指数の変化 )"
  inputs: [B07, commodity_index]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "推定に20四半期以上が要る。不足なら欠損。"
  missing_bias: "主要原材料の特定が要る。LLM 推定に頼るので誤りが入る。"
  correlated_with: [B36, P09, P20, U25, U39]
  economic_rationale: >-
    B36（価格転嫁力）の業種特化・定量版。**原材料価格の上昇を
    どれだけ価格に転嫁できるか**を回帰係数で測る。
    転嫁できない企業は、インフレ局面で構造的に利益が圧迫される。
    P09（商品価格感応度）が株価で測るのに対し、U24 は損益で測る。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U25:
  formula: "業界統計の在庫 / 出荷比率"
  inputs: [industry_statistics]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "出荷>0。業界統計が存在する業種のみ。"
  missing_bias: "統計が整備された業種（半導体・鉄鋼・化学・工作機械）のみ。"
  correlated_with: [U22, U19, B22, X14, P15]
  economic_rationale: >-
    **個社データより業界在庫が先行する。** 個社の在庫（B22）は
    自社の判断で調整できるが、業界全体の在庫は需給そのもの。
    半導体・素材のサイクル判定では、**個社決算を見るより業界統計を見る方が速い。**
    X14（業界統計との突合）の入力でもある。
  evidence_tier: T3
  references: ["構造的判断。素材・半導体分析の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U26:
  formula: "会社開示の「1円円安あたりの営業利益変化額」/ 営業利益"
  inputs: [fx_sensitivity_disclosure, OP]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "OP>0。開示が無ければ欠損。"
  missing_bias: >-
    **日本の輸出企業は決算説明資料で開示するが、義務ではない。**
    開示するのは影響が大きい企業なので、**影響の大きい企業に偏る**
    — この場合は測りたい対象と一致するので、実害は小さい。
  correlated_with: [P07, P08, V07, C23, U24]
  economic_rationale: >-
    **P08（統計推定の為替感応度）より正確。** 企業自身が
    事業構造を把握して計算した数字なので、株価の回帰から推定するより信頼できる。
    **P08 と突合して大きく食い違う銘柄は、株価が為替以外の要因で動いている**
    ことを示すので、その乖離自体が情報になる。
  evidence_tier: T3
  references: ["構造的判断。日本の輸出企業の開示慣行"]
  markets: [JP]
  review: {status: verified}

# --- U-5 IT・SaaS・インターネット ---------------------------------------------

U27:
  formula: "売上成長率(%) + FCFマージン(%)"
  inputs: [C01, B09]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "B09（FCFマージン）の IFRS16 の注意を継承。"
  zero_denominator_policy: "C01 または B09 が欠損なら欠損。"
  missing_bias: "SaaS 以外では意味を持たない。業種判定が必要。"
  correlated_with: [C01, B09, U28, U29, U30, C08]
  economic_rationale: >-
    SaaS の総合指標。**成長と収益性のトレードオフを1本にまとめる。**
    40超が目安とされる。C08（ROIC × 再投資率）と同じく
    「成長と効率の積」を測る思想だが、**赤字期の SaaS でも計算できる**点が違う。
    ただし**閾値40に理論的根拠は無く、業界の経験則。**
  evidence_tier: T3
  references: ["構造的判断。SaaS 業界の実務標準だが学術的実証は無い"]
  markets: [JP, US]
  review: {status: verified}

U28:
  formula: "既存顧客からの当期売上 / 前期売上"
  inputs: [NRR_disclosure, LLM]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: "**自主開示で定義が企業ごとに違う。** チャーンした顧客の扱いが特に違う。"
  zero_denominator_policy: "前期売上>0。開示が無ければ欠損。"
  missing_bias: "**開示企業に強く偏る。しかも良い数字の企業ほど開示する。**"
  correlated_with: [C15, U27, U29, U30, C12]
  economic_rationale: >-
    **120%超は極めて強い。** 既存顧客だけで年20%成長するということは、
    新規獲得コストなしに複利が回るということで、C08（ROIC × 再投資率）が
    構造的に高くなる。**ただし定義が企業任意なので、
    E21（会計上の見積り変更）と同種の操作リスクがある。**
  evidence_tier: T3
  references: ["構造的判断。SaaS 業界標準だが自主開示"]
  markets: [JP, US]
  review: {status: verified}

U29:
  formula: "解約率（顧客数ベースおよび金額ベース）"
  inputs: [churn_disclosure, LLM]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: "U28 と同じ定義問題。"
  zero_denominator_policy: "期首顧客数>0。"
  missing_bias: "U28 と同じ。**悪い数字は開示されにくい**という非対称。"
  correlated_with: [U28, U30, U31, C15, T38]
  economic_rationale: >-
    U28（NRR）の分解要素。**NRR が高くても、
    大口顧客の増額が小口の解約を隠している場合がある。**
    顧客数ベースと金額ベースの両方を見ないと実態が分からない。
    T38（スイッチングコスト）の実測値でもある。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U30:
  formula: "顧客生涯価値 / 顧客獲得コスト"
  inputs: [LTV_estimate, CAC_estimate, LLM]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "**両方とも推定値で、算定方法が企業ごとに違う。**"
  zero_denominator_policy: "CAC>0。"
  missing_bias: "推定に依存するので信頼度が低い。開示企業も少ない。"
  correlated_with: [U28, U29, U31, U32, B26]
  economic_rationale: >-
    3倍超が目安。**ただし LTV は将来の解約率の仮定に依存する**ので、
    企業に有利な仮定を置けばいくらでも高くできる。
    U29（実際の解約率）と突合しないと信用できない。
    **B26（R&D生産性）と同じく「投資の実り」を測る指標だが、より恣意的。**
  evidence_tier: T3
  references: ["構造的判断。推定値依存で信頼度が低い"]
  markets: [JP, US]
  review: {status: verified}

U31:
  formula: "CAC / 月次粗利"
  inputs: [CAC_estimate, GP]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "U30 と同じ推定問題。"
  zero_denominator_policy: "月次粗利>0。"
  missing_bias: "U30 と同じ。"
  correlated_with: [U30, U32, B09, D22]
  economic_rationale: >-
    12ヶ月以内が目安。**回収期間が長いほど、成長のために先に現金が出ていく**ので、
    D22（資金繰り余力）との交互作用が本質。急成長 SaaS が
    資金ショートするのはこの構造による。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U32:
  formula: "(当四半期ARR増 × 4) / 前四半期の営業マーケティング費"
  inputs: [ARR, sales_marketing_expense]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: "ARR は自主開示。営業マーケ費の区分も企業判断。"
  zero_denominator_policy: "前四半期の営業マーケ費>0。"
  missing_bias: "U28-U31 と同じ開示バイアス。"
  correlated_with: [U27, U28, U30, U31, B31]
  economic_rationale: >-
    0.75超なら投資を増やす価値がある、というのが業界の目安。
    **営業効率の限界生産性を測る**という点で B12（増分ROIC）と同じ発想。
    C08（ROIC × 再投資率）を SaaS の言語で表現したもの。
  evidence_tier: T3
  references: ["構造的判断。SaaS 業界の経験則"]
  markets: [JP, US]
  review: {status: verified}

U33:
  formula: "日次アクティブユーザー / 月次アクティブユーザー"
  inputs: [DAU, MAU, LLM]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: "**アクティブの定義が企業ごとに違う。**"
  zero_denominator_policy: "MAU>0。"
  missing_bias: "開示企業に偏る。X03/X04（アプリのDL数・レビュー）で外部推定が可能。"
  correlated_with: [C16, X03, X04, X05, U28]
  economic_rationale: >-
    ゲーム・SNS のエンゲージメント。**高いほど習慣化されており解約されにくい**ので、
    U29（解約率）の代理変数になる。
    **X03（アプリランキング）で外部から検証できる**数少ない指標で、
    開示に頼らずに追跡できる点が実務的に重要。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

# --- U-6 医薬・バイオ・医療機器 -----------------------------------------------

U34:
  formula: "SUM( 各開発品の売上ポテンシャル × フェーズ別承認確率 × 割引 ) / MCAP"
  inputs: [pipeline_disclosure, LLM, MCAP]
  period_convention: POINT
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "MCAP>0。パイプラインが無ければゼロ。"
  missing_bias: >-
    **売上ポテンシャルの推定が LLM 依存で、しかも極めて不確実。**
    フェーズ別承認確率は業界統計（フェーズ1で約10%、フェーズ3で約60%）が
    使えるが、疾患領域で大きく違う。
  correlated_with: [U35, U36, U37, N40, X07, A27]
  economic_rationale: >-
    **医薬は現在の利益ではなくパイプラインで評価される。PER は誤導的。**
    赤字のバイオ企業に高い時価総額が付くのはこのため。
    A27（DCF）と同じく仮定に敏感なので、**幅で持ち点推定を信じない。**
    5年ホライズンでは、フェーズ3の開発品が結果を出す確率が高い。
  evidence_tier: T3
  references: ["構造的判断。rNPV は業界標準手法だが推定の幅が大きい"]
  markets: [JP, US]
  review: {status: verified}

U35:
  formula: "主力製品の特許満了までの残存年数（売上加重）"
  inputs: [patent_data, segment_revenue, LLM]
  period_convention: POINT
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "主力製品が特定できなければ欠損。"
  missing_bias: "N39 と同一。特許と製品の紐付けを LLM に頼るので誤りが入る。"
  correlated_with: [N39, U34, U36, U38, X07]
  economic_rationale: >-
    N39 と同一の量で、業種特化として重複して持つ。
    **5年ホライズンでは決定的。** 満了直後に後発品が出ると売上が数割落ちる。
    **PER が低く見える医薬企業の多くは、市場がクリフを織り込んでいるだけ**で、
    A カテゴリのバリュートラップの業種特有の形。
  evidence_tier: T3
  references: ["構造的判断。パテントクリフは実務上自明"]
  markets: [JP, US]
  review: {status: verified}

U36:
  formula: "最大売上製品の売上 / REV"
  inputs: [product_revenue, REV]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "製品別売上の開示は義務ではない。"
  zero_denominator_policy: "REV>0。"
  missing_bias: "製品別開示をする企業に偏る。大手製薬は開示するが中小は少ない。"
  correlated_with: [U34, U35, V02, I25, T18]
  economic_rationale: >-
    **U35 と掛け合わせて「クリフの深さ」を推定する。**
    売上の60%を占める製品の特許が2年後に切れるなら、
    2年後に売上の3〜4割が消える。I25（単一要因への依存度）の医薬版で、
    **U35 単独では危険度が測れない**ので必ずセットで使う。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U37:
  formula: "過去10年の新薬承認数 / 累計R&D費"
  inputs: [approvals, RD]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "累計R&D>0。承認ゼロならゼロ（欠損にしない）。"
  missing_bias: "10年の履歴が要るので、若い企業で欠損。バイオベンチャーは常にゼロ。"
  correlated_with: [B26, U34, X07, X08, B25]
  economic_rationale: >-
    B26（R&D生産性）の医薬特化版。**研究開発費が実際に承認薬に
    転換されているか。** 大手製薬でも生産性は大きく違い、
    R&D 費の絶対額（B25）は実力を表さない。
    **X08（特許の被引用数）と併せると、研究の質を多角的に測れる。**
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U38:
  formula: "薬価改定率 × 対象品の売上比率"
  inputs: [drug_price_revision, product_revenue, LLM]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "REV>0。"
  missing_bias: >-
    **日本固有の制度。** 米国は市場価格なので対応する概念が無い
    （ただし IRA による価格交渉が始まっている）。
  correlated_with: [U34, U35, U36, P30, N19]
  economic_rationale: >-
    **日本は薬価改定が構造的な逆風。** かつては2年ごとだったが
    毎年改定に移行し、影響が増した。**制度で価格が下がることが確定している**
    という点で、他業種にない特異な性質を持つ。
    P30（税制・制度の変更）の監視対象として最も重要な業種。
  evidence_tier: T3
  references: ["健康保険法（薬価基準）", "構造的判断"]
  markets: [JP]
  review: {status: verified}

# --- U-7 資源・エネルギー・海運・商社 ------------------------------------------

U39:
  formula: "beta( r_i ~ 主要商品価格の変化 ) と長期契約比率の複合"
  inputs: [PRICE, commodity_index, U42]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "推定に252営業日が要る。"
  missing_bias: "主要商品の特定が要る。複数商品に跨る企業では単純化される。"
  correlated_with: [P09, U24, U40, U41, U42]
  economic_rationale: >-
    **PER が最も誤導的になる業種。ピーク PER が最安値になる。**
    商品価格がピークのとき利益もピークで PER が低く見えるが、
    そこが天井。**A22/A23（自己バリュエーション位置）や
    C26（平均回帰調整）で補正しないと、必ず高値を掴む。**
    バリュー指標を業種横断で使うことの危険が最も顕著に出る場所。
  evidence_tier: T3
  references: ["構造的判断。資源株分析の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U40:
  formula: "確認埋蔵量 / 年間生産量"
  inputs: [reserves, production]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "**埋蔵量の認定基準（SEC 基準 / SPE-PRMS）で数値が変わる。**"
  zero_denominator_policy: "生産量>0。"
  missing_bias: "資源企業のみ。日本には該当企業が少ない。"
  correlated_with: [U39, U42, C40, A29]
  economic_rationale: >-
    **資源企業の実質的な資産。** 会計上の簿価より埋蔵量の方が価値を表す。
    可採年数が短い企業は、探鉱に投資し続けないと事業が終わる
    — **C07（再投資率）が構造的に高くならざるを得ない業種。**
  evidence_tier: T3
  references: ["SEC Rule 4-10 (Reg S-X)", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

U41:
  formula: "BDI・コンテナ運賃指数・タンカー用船料の水準と変化"
  inputs: [freight_indices]
  period_convention: POINT
  consolidation: na
  accounting_standard_note: "na"
  zero_denominator_policy: "na"
  missing_bias: "海運のみ。指数は公開されているので欠損しない。"
  correlated_with: [U39, U42, P15, P09]
  economic_rationale: >-
    **極端にシクリカルで、指数が業績に先行する。**
    BDI は数ヶ月で10倍変動することがあり、海運株の利益は運賃に直結する。
    **業界指数が公開されているので、個社開示を待たずに業績が推定できる**
    という点で U25（業界在庫）と同じ性格。
    U39（PER の誤導）が最も激しく現れる業種でもある。
  evidence_tier: T3
  references: ["構造的判断。海運分析の実務標準"]
  markets: [JP, US]
  review: {status: verified}

U42:
  formula: "長期契約売上 / 総売上"
  inputs: [contract_disclosure, REV, LLM]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: "契約形態の開示は任意。"
  zero_denominator_policy: "REV>0。"
  missing_bias: "開示企業に偏る。海運・資源で LLM 推定に頼る部分が大きい。"
  correlated_with: [U39, U40, U41, C11, C12, B15]
  economic_rationale: >-
    **収益の安定性。スポット比率が高いほどボラが大きい。**
    U39（商品価格感応度）を緩和する条件変数で、
    長期契約が多い企業は商品価格が下がっても利益が守られる。
    **同じ業種内でもビジネスモデルが違うことを捉える**ので、
    業種内正規化だけでは足りない部分を補う。
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP, US]
  review: {status: verified}

# --- U-8 建設・インフラ・公益 --------------------------------------------------

U43:
  formula: "完成工事総利益 / 完成工事高"
  inputs: [construction_profit, construction_revenue]
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: >-
    **工事進行基準（IFRS15 では一定期間にわたり充足する履行義務）の適用で、
    利益の計上タイミングが変わる。** 見積総原価の変更で過去の利益が修正されることがある。
  zero_denominator_policy: "完成工事高>0。"
  missing_bias: "建設業のみ。日本は建設業会計で区分開示される。"
  correlated_with: [U44, B07, B18, C11, U21]
  economic_rationale: >-
    **受注時の採算が2〜3年後の利益に出るので、先行性がある。**
    今期の利益率は2〜3年前の受注環境を反映しているので、
    **現在の受注環境（U44）を見れば将来の利益率が予測できる。**
    B18（粗利率トレンド）の建設版だが、ラグが長い分だけ予測に使える。
  evidence_tier: T3
  references: ["建設業法施行規則（完成工事原価報告書）", "構造的判断"]
  markets: [JP]
  review: {status: verified}

U44:
  formula: "新規受注案件の想定利益率（開示または推定）"
  inputs: [order_disclosure, LLM, U43]
  period_convention: FQ
  consolidation: consolidated
  accounting_standard_note: "受注時採算は通常開示されない。LLM が説明資料から推定する。"
  zero_denominator_policy: "受注額>0。"
  missing_bias: "**ほぼ開示されないので推定精度が低い。** 経営陣の説明の定性表現に頼る。"
  correlated_with: [U43, U21, C11, T07, T32]
  economic_rationale: >-
    U43 の先行指標。**受注時の採算が悪化していれば、
    2〜3年後の利益率低下が確定している。** 建設業界は
    競争激化局面で採算を落として受注する傾向があり、
    その影響が数年後に出る。**T07（ガイダンス文言の変化）で
    経営陣の慎重さの変化を捉えるのが実務的な代替。**
  evidence_tier: T3
  references: ["構造的判断"]
  markets: [JP]
  review: {status: verified}

U45:
  formula: "規制資産ベース × 認可利回り / 時価総額"
  inputs: [regulated_asset_base, allowed_return, MCAP, LLM]
  period_convention: FY
  consolidation: consolidated
  accounting_standard_note: "na"
  zero_denominator_policy: "MCAP>0。規制産業以外では欠損。"
  missing_bias: "電力・ガス・鉄道のみ。規制の枠組みが国で全く違う。"
  correlated_with: [U39, B03, B04, A28, N19]
  economic_rationale: >-
    **規制産業では通常の ROIC 分析が効かない。**
    利益が規制で決まるので、B03（ROIC）は認可利回りに張り付く。
    **投資すればするほど規制資産ベースが増え、利益も増える**という、
    C35（資産成長アノマリー）と正反対の構造を持つ。
    U カテゴリを設けた最大の理由がこの種の構造差にある。
  evidence_tier: T3
  references: ["電気事業法（託送料金の総括原価方式）", "構造的判断"]
  markets: [JP, US]
  review: {status: verified}

