    **長期保有の副収入。** 空売り需要の強い銘柄（K19/K38）ほど金利が高い。
    ただし**配当が「配当金相当額」になり、配当控除が使えず雑所得扱いになる**ので、
    税制上は不利になることがある。**高配当株では貸株しない方が有利。**
    さらに貸株中は株主優待（F12）も受けられない。
  evidence_tier: T3
  references: ["構造的判断。証券会社の貸株サービス規約と税務上の取扱い"]
  markets: [JP, US]
