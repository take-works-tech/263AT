  - US
  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: CASH に短期有価証券を含める（spec §2）。DEBT_ST に1年内返済予定の長期借入金を含める。 区分の仕方が企業により異なるので、Z05（ソース間不一致）で監視する。
  pit_lag_days: 0
