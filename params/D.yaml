  horizon:
    label: 6M-3Y
    min_m: 6
    max_m: 36
  data_sources:
  - CALC
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T3
  markets:
  - JP
  - US
  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: 支払利息の範囲が基準で異なる（リース利息を含むか等）。IFRS16 適用企業はリース利息が 支払利息に計上されるためカバレッジが低く出る。D19 と併せて解釈する。
  pit_lag_days: 0
  zero_denominator_policy: '**実質無借金（支払利息が営業利益の1%未満）の企業では分母が小さすぎて比率が発散する。 この判定を適用せず、D01/D07 に委ねる。** これを忘れると優良な無借金企業が異常値で弾かれる。'
