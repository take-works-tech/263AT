- id: D26
  name_ja: 格下げイベント
  category: D
  category_name: 財務健全性・破綻リスク
  subsection: null
  definition: 信用格付が引き下げられたか（直近6ヶ月）
  formula: 1 if 信用格付が直近6ヶ月に引き下げられた else 0
  inputs:
  - credit_rating_history
  sign: negative
  buy_class: gate
  sell_class: main
  gate_policy: 直近6ヶ月に格下げがあれば新規建てを停止する。投資適格から投機的等級への低下は除外。 投機的等級内の1ノッチ低下はサイズ半減に留める。無格付企業（日本の小型株の大半）には適用しない。
  horizon:
    label: 3M-1Y
    min_m: 3
    max_m: 12
  data_sources:
  - 手
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T1
  markets:
  - JP
  - US
  industries: null
  period_convention: POINT
  consolidation: na
  accounting_standard_note: na
  pit_lag_days: 3
  zero_denominator_policy: na（ブール値）
  missing_policy: flag
  missing_bias: '**日本の小型株の大半は無格付**。欠損が母集団の大半を占めるため、 このゲートは実質的に大型株・米国株にしか効かない。**欠損を不合格にしてはいけない** （ユニバースが壊滅する）。Z03 で偏りを監視する。'
  normalization: rank_sector
  nonlinear: null
  winsorize: null
  correlated_with:
  - D08
  - D09
  - D10
  - D17
  - D01
  economic_rationale: OSAP `CredRatDG` の t=11.0 は Predictor 全体で最上位クラス。 格付機関は企業の非公開情報にアクセスできるため、格下げは**外部者が得られる情報の中で 最も情報量が多いイベントの一つ**。D14（格付水準）は既に価格に織り込まれているが、 格下げという**変化**には未織り込みの情報が残る（B18/B29 と同じ「水準より方向」の構図）。
  references:
  - https://www.openassetpricing.com/
  - https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf
  - OSAP CredRatDG — Credit Rating Downgrade, t=11.0
  notes: OSAP CredRatDG t=11.0。この一覧で最上位クラスの t 値。D14 は水準だけだったが、変化（格下げ）が本体
  notes_extra: null
