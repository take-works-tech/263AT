- id: D22
  name_ja: 資金繰り余力（月数）
  category: D
  category_name: 財務健全性・破綻リスク
  subsection: null
  definition: (現金 + コミットメントライン未使用枠) / 月次固定費
  formula: (CASH + 未使用コミットメントライン) / (月次固定費)
  inputs:
  - CASH
  - commitment_line
  - SGA
  - INTEREST
  sign: positive
  buy_class: gate
  sell_class: main
  gate_policy: 資金繰り余力 < 6ヶ月で除外。6〜12ヶ月はサイズを半減する。 黒字企業には適用せず、営業CF が直近2期連続で負の企業にのみ適用する。
  horizon:
    label: 3M-1Y
    min_m: 3
    max_m: 12
  data_sources:
  - CALC
  - LLM
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T3
  markets:
  - JP
  - US
  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: コミットメントラインの未使用枠は注記からの抽出になり、開示形式が定型でない。 月次固定費は販管費から変動費を分離する必要があり、推定が入る（B20 と同じ困難）。
  pit_lag_days: 0
  zero_denominator_policy: 固定費の推定がゼロ・負になる場合は判定不能として欠損にし、D07 で代替する。
  missing_policy: flag
  missing_bias: コミットメントラインの開示は大企業に偏る。**小型株ほど枠が無いのか開示が無いのか区別できない** ため、欠損を「枠なし」と扱うと小型株が不当に厳しく判定される。欠損は判定不能として扱う。
  normalization: rank_sector
  nonlinear: null
  winsorize: null
  correlated_with:
