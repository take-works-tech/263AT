- id: D01
  name_ja: Net Debt / EBITDA
  category: D
  category_name: 財務健全性・破綻リスク
  subsection: null
  definition: (有利子負債 - 現金) / EBITDA
  formula: (IBD_incl_lease - CASH) / EBITDA_TTM
  inputs:
  - IBD
  - CASH
  - EBITDA
  sign: negative
  buy_class: gate
  sell_class: main
  gate_policy: ND/EBITDA > 5.0 で除外。業種調整として不動産・リース・電力・鉄道・海運は 8.0 を閾値とする。 EBITDA <= 0 かつ ND > 0 も除外。金利上昇局面（P02 が過去3ヶ月で +0.5%超）では閾値を1段厳しくする。
  horizon:
    label: 1Y-5Y
    min_m: 12
    max_m: 60
  data_sources:
  - CALC
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T3
  markets:
  - JP
  - US
  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: 分子の IBD にリース負債を含める（spec §2 の既定）。IFRS16 / ASC842 適用前後で不連続になるため Z07 の会計基準変更フラグが立つ年は判定の信頼度を下げる。分母の EBITDA は日本基準ののれん償却を 足し戻すので、基準間で比較可能な数少ない指標（A06 と同じ理由）。
  pit_lag_days: 0
  zero_denominator_policy: EBITDA <= 0 のとき比率は無意味。**欠損にせず「ゲート不合格」として扱う**（ND>0 の場合）。 ネットキャッシュ企業（ND<0）で EBITDA<=0 の場合は D07 と D22 で判定する。
  missing_policy: flag
  missing_bias: リース負債の開示がない旧基準の期間で IBD が過小になる。**古い期間ほどレバレッジが軽く見える** ため、時系列でゲート通過率が変化する。Z07 と併せて監視する。
  normalization: rank_sector
  nonlinear: null
  winsorize: null
  correlated_with:
  - D03
  - D04
  - D19
  - D25
  - B39
  economic_rationale: 統計的エッジではなく構造的制約。過大な負債は (a) 金利上昇局面で利払いが利益を食い、 (b) 借換ができないと即座に破綻する、という二重のテールリスクを持つ。 バリュー指標（A カテゴリ）は負債の多い企業ほど低く出るため、ゲートを掛けないと 「安いのには理由がある」企業を体系的に買い集めることになる（バリュートラップ）。 LAW-40 の実装。
  references:
  - https://images.aqr.com/-/media/AQR/Documents/Insights/Journal-Article/The-Limits-to-Arbitrage-Revisited-The-Accrual-and-Asset-Growth-Anomalies.pdf
  - 構造的制約であり、単独のアノマリー論文に基づくものではない
  notes: 3超で警戒、5超で原則除外（業種調整あり）。金利上昇局面では基準を厳しく
  notes_extra: null
