- id: D08
  name_ja: Altman Z-Score
  category: D
  category_name: 財務健全性・破綻リスク
  subsection: null
  definition: 5変数の線形結合（製造業版 / 非製造業版 / 新興国版を使い分け）
  formula: 1.2*WC/TA + 1.4*RE/TA + 3.3*EBIT/TA + 0.6*MCAP/TL + 1.0*REV/TA（製造業版）
  inputs:
  - TA
  - TL
  - EQ
  - EBIT
  - REV
  - MCAP
  sign: positive
  buy_class: gate
  sell_class: main
  gate_policy: 製造業版 Z < 1.8、非製造業版 Z'' < 1.1 で除外。**業種版を必ず使い分ける**（間違えると無意味）。 日本企業への適用は係数の再推定が望ましく、それまでは D09 との合議を優先する。
  horizon:
    label: 1Y-3Y
    min_m: 12
    max_m: 36
  data_sources:
  - CALC
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T2
  markets:
  - JP
  - US
  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: 係数は米国の1960年代のデータで推定されたもの。**日本企業への適用は係数の再推定が望ましい**。 それまでは D09（Ohlson O）との合議を優先し、単独では判定しない。
  pit_lag_days: 0
  zero_denominator_policy: TA > 0、TL > 0 なので通常は問題ない。TL=0（完全無借金）は合格扱い。
  missing_policy: flag
  missing_bias: 利益剰余金（RE）の開示形式が国・基準で異なるため、抽出漏れが起きる。 **業種版を間違えると全く別の判定になる**（製造業版 1.8 / 非製造業版 Z'' 1.1）ので、 業種分類の欠損は即ゲート判定不能として扱う。
  normalization: rank_sector
  nonlinear: null
  winsorize: null
  correlated_with:
  - D01
  - D02
  - D09
  - D10
  - B39
  economic_rationale: 倒産確率の要約統計量。単独指標より複合の方が頑健という点で A32（複合バリュー）と同じ思想。 263AT では**加点ではなくゲート**に使う。低スコアの企業を「安いから買う」と体系的に バリュートラップを踏むため（LAW-40）。
  references:
  - https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf
  - '原論文: Altman (1968) Journal of Finance 23(4) 589-609'
  - https://journals.sagepub.com/doi/10.1177/21582440251386174
  notes: 1.8未満で危険圏。業種版を間違えると無意味。日本企業への適用は係数の再推定が望ましい（LAW-40）
  notes_extra: null
