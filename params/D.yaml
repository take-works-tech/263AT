  - D03
  - D25
  - D22
  economic_rationale: 構造的制約。利払いは契約上の義務であり、業績が悪化しても減らせない。 カバレッジが2倍を切ると、営業利益が半減しただけで利払いができなくなる。 **金利上昇局面で最初に壊れる指標**であり、日本の金利正常化局面では特に重要（D25 と対）。
