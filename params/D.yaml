  - D09
  economic_rationale: 構造的制約。自己資本は損失を吸収する緩衝であり、薄いほど小さな損失で債務超過に至る。 業種によって適正水準が大きく違う（銀行は数%が正常、無借金メーカーは80%超もある）ため、 絶対値ではなく業種内順位で見るのが本質。
  references:
