  - D23
  - D15
  - D04
  economic_rationale: 構造的制約。**赤字企業が何ヶ月生き延びられるか**を直接測る。 黒字企業には適用しない（営業CFが2期連続で負の企業にのみ適用）。 小型グロース株の最大の下落要因である増資（F05）の事前予測にもなる（D15 と対）。
  references:
