- id: D07
  name_ja: 現金 / 短期債務
  category: D
  category_name: 財務健全性・破綻リスク
  subsection: null
  definition: 現金同等物 / 1年内返済予定の有利子負債
  formula: CASH / DEBT_ST
  inputs:
  - CASH
  - DEBT_ST
  sign: positive
  buy_class: gate
  sell_class: main
  gate_policy: 現金/1年内返済有利子負債 < 0.5 で除外。0.5〜1.0 はサイズを半減し、D15（増資リスク）を必ず併記する。
  horizon:
