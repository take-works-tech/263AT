  sell_class: useful
  gate_policy: 業種内パーセンタイル下位5%を除外。金融・不動産を除く一般事業会社では絶対値10%未満も除外。 債務超過（EQ<0）は無条件で除外。
  horizon:
    label: 1Y-5Y
    min_m: 12
    max_m: 60
  data_sources:
  - FIN
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T3
  markets:
  - JP
  - US
  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: EQ は非支配株主持分と新株予約権を除く（spec §2）。IFRS はのれんを資産に残すため 分母 TA が大きくなり自己資本比率が低く出る。**業種内パーセンタイルで判定するので影響は限定的**。
  pit_lag_days: 0
  zero_denominator_policy: TA > 0 なので割り算は問題ない。EQ<0（債務超過）は負値のまま保持し、無条件で不合格。
  missing_policy: flag
  missing_bias: 金融・不動産は構造的に低いので、業種内判定でないと当該業種が丸ごと除外される。
