- id: A02
  name_ja: 予想益回り
  category: A
  category_name: バリュエーション
  subsection: null
  definition: EPS_会社予想 / 株価
  formula: EPS_GUIDE / PRICE
  inputs:
  - EPS_guidance
  - PRICE
  sign: positive
  buy_class: main
  sell_class: useful
  gate_policy: null
  horizon:
    label: 6M-3Y
    min_m: 6
    max_m: 36
  data_sources:
  - EST
  - TD
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T2
  markets:
  - JP
  - US
  industries: null
  period_convention: GUIDE_CO
  consolidation: consolidated
  accounting_standard_note: '**日本は会社予想が義務開示、米国のガイダンスは任意。** 同じ「予想益回り」でも 日本は全銘柄で会社予想が取れ、米国は出さない企業が多くコンセンサスで代替することになる。 **同一 ID で日米の中身が違うのは危険**なので、GUIDE_CO 版と GUIDE_CONS 版を 別 ID に分けるべき（OQ-22 と同根）。現状は GUIDE_CO を割り当てている。'
  pit_lag_days: 1
  zero_denominator_policy: PRICE>0。予想が赤字なら負のまま保持（A01 と同じく E/P の向きで持つ）。
  missing_policy: flag
  missing_bias: '**米国では予想を出さない企業が体系的に欠損する。** 出さないのは不確実性が高い企業に 偏るので、欠損自体が弱いネガティブ情報を持つ。日本では義務開示なのでほぼ欠損しない — **これは日本株を扱う数少ない構造的な優位**（LAW-114）。'
  normalization: rank_sector
  nonlinear: null
  winsorize: null
  correlated_with:
  - A01
  - A17
  - A26
  - N09
  - N31
  - N10
  economic_rationale: A01（実績益回り）が過去を見るのに対し、これは市場が織り込むべき将来を見る。 日本では会社予想が保守的に出される傾向があり（N09）、**予想益回りが高い銘柄の中には 「保守的な予想を出す企業」が混じる**。N09（予想の保守性）で調整して初めて実力が見える。
  references:
  - https://www.openassetpricing.com/
  - OSAP sfe — Earnings Forecast to price, t=5.0
  - https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf
  notes: 日本は会社予想、米国はコンセンサス。予想の出所を必ず分けて持つ
