  accounting_standard_note: CASH に短期有価証券を含め、IBD にリース負債を含める（spec §2）。 **IFRS16 適用でリース負債が乗ると、同じ企業のネットキャッシュが突然マイナスに転じる。** Z07 のフラグ年は判定を保留する。
