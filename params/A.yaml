  accounting_standard_note: 基準間比較の基準となる指標。のれん償却の有無を吸収するため、日本基準と IFRS の企業を同じ土俵に載せられる 数少ない指標。ただし IFRS16 / ASC842 でリース費用が EBITDA から抜けて押し上げられるので、 EV 側の IBD にリース負債を必ず含める（spec §2）。
