  period_convention: GUIDE_CO
  consolidation: consolidated
  accounting_standard_note: '**日本は会社予想が義務開示、米国のガイダンスは任意。** 同じ「予想益回り」でも 日本は全銘柄で会社予想が取れ、米国は出さない企業が多くコンセンサスで代替することになる。 **同一 ID で日米の中身が違うのは危険**なので、GUIDE_CO 版と GUIDE_CONS 版を 別 ID に分けるべき（OQ-22 と同根）。現状は GUIDE_CO を割り当てている。'
  pit_lag_days: 1
  zero_denominator_policy: PRICE>0。予想が赤字なら負のまま保持（A01 と同じく E/P の向きで持つ）。
