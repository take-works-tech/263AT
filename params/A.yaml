  economic_rationale: '**OSAP BPEBM t=4.1。A14 と対で持つと B/P の中身が分かる。** **B/P が高い理由は2つある** — (a) 事業が安く評価されている（A14 が低い） (b) 負債が多い（レバレッジ成分が大きい）。 **(a) は買う理由になるが (b) はならない。** → **A03 を単独で使うと、 ただ借金が多いだけの企業をバリューと誤認する。** **B05（デュポン分解）が ROE で同じことをする**のと 完全に対応する構造 — **どちらも「レバレッジ由来の 見かけの良さ」を分離するための分解。**'
