- id: C08
  name_ja: 期待複利成長
  category: C
  category_name: 成長性・再投資
  subsection: null
  definition: ROIC × 再投資率
  formula: B03 × C07
  inputs:
  - B03
  - C07
  sign: positive
  buy_class: main
  sell_class: main
  gate_policy: null
  horizon:
    label: 3Y-5Y
    min_m: 36
    max_m: 60
  data_sources:
  - CALC
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T3
  markets:
  - JP
  - US
  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: B03 と C07 の会計基準差を継承。IFRS16 が両方に効く。
  pit_lag_days: 0
  zero_denominator_policy: B03 または C07 が欠損なら欠損。C07 の分母（NOPAT）が負なら欠損。
  missing_policy: flag
  missing_bias: ネットキャッシュ企業で B03 が欠損、無投資企業で C07 が不安定。 **成熟した無投資の優良企業が落ちる**方向の偏り。
  normalization: rank_sector
  nonlinear: null
  winsorize: null
  correlated_with:
  - B03
  - B04
  - B12
  - C07
  - C35
  - C36
  economic_rationale: '**本カタログの中核式（LAW-43）。長期複利 ≈ ROIC × 再投資率。** 高 ROIC でも再投資できなければ複利は回らず（配当で返すしかない）、 再投資しても ROIC が低ければ価値を壊す。**両方が高い企業だけが長期複利の本体。**

    **ここが C カテゴリの符号の分裂を橋渡しする唯一の変数である。** C35（資産成長）は再投資を減点し、C08 は再投資を加点する。矛盾ではなく、 **B04（ROIC - WACC）が正の企業でのみ再投資が正しい**という条件付きの関係。 平均的な企業は B04 が薄いので、無条件に平均すれば C35 の符号（負）が勝つ。 **だから C07/C29/C39/N33 はすべて B04 との交互作用が必須になる。**'
  references:
  - https://www.forbes.com/sites/bill_stone/2026/06/13/how-to-find-multibagger-stocks-before-they-soar/
  - https://www.nber.org/system/files/working_papers/w19681/w19681.pdf
  - 実務家の中核概念だが、この積の形での断面実証は未確認
  notes: 本プロジェクトの中核式。「双方が高い」企業が長期複利の本体
