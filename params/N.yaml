  - https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf
  - https://www.nber.org/system/files/working_papers/w23394/w23394.pdf
  notes: アナリスト予想の変化方向は最も頑健なシグナルの一つ。小型株はカバレッジ不足で使えないことが多い
