  pit_lag_days: 1
  zero_denominator_policy: 前期コンセンサスが 0 近傍だと発散するため、分母に下限（株価の1%）を置く。 符号反転（赤字→黒字予想）は比率が意味を失うので、別途フラグで持つ。
