- id: N44
  name_ja: 上場維持基準の余裕度
  category: N
  category_name: カタリスト・イベント
  subsection: null
  definition: 流通株式時価総額・株主数などの基準に対する余裕率
  formula: min(流通株式時価総額/基準, 流通株式比率/基準, 株主数/基準)
  inputs:
  - float_market_cap
  - float_ratio
  - shareholder_count
  sign: positive
  buy_class: gate
  sell_class: main
  gate_policy: 流通株式時価総額・流通株式比率・株主数のいずれかが上場維持基準の1.2倍未満なら除外。 **抵触してから（N23）では遅いので、余裕度で先に手を引く。**
  horizon:
    label: 1Y-3Y
    min_m: 12
    max_m: 36
  data_sources:
  - JQ
  - CALC
  evidence_stars: 2
  prior_scale: 0.45
  evidence_tier: T3
  markets:
  - JP
  - US
  industries: null
  period_convention: POINT
  consolidation: na
  accounting_standard_note: na
  pit_lag_days: 1
  zero_denominator_policy: 基準値は制度で定まっているのでゼロにならない。
  missing_policy: flag
  missing_bias: 流通株式時価総額と株主数は**年1回の開示**なので最大1年古い（Z04）。 株主数の急減（K34）は基準抵触の先行指標だが、これも年次。**先行指標としての解像度が粗い。**
  normalization: rank_all
  nonlinear: null
  winsorize: null
  correlated_with:
  - N23
  - J06
  - J07
  - K34
  - K36
  economic_rationale: 構造的制約。N23（抵触してから）では遅い。**余裕度が薄い銘柄を先に外す。** 東証の市場区分見直しで基準が厳格化しており、スタンダード市場の小型株では 現実的なリスクになっている。ただし**抵触リスクがある企業ほど割安に見える**ため、 A カテゴリと逆相関する典型的なバリュートラップ要因。
  references:
  - https://www.jpx.co.jp/english/equities/follow-up/02.html
  - 東証 有価証券上場規程（上場維持基準）
  notes: N23 の事前版。抵触してからでは遅い
