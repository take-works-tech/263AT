- id: N02
  name_ja: SUE（標準化サプライズ）
  category: N
  category_name: カタリスト・イベント
  subsection: null
  definition: (実績EPS - 予想EPS) / sd(過去8期のサプライズ)
  formula: (EPS_actual_FQ - EPS_expected) / sd(surprise, last 8 quarters)
  inputs:
  - EPS_actual
  - EPS_expected
  - surprise_history
  sign: positive
  buy_class: main
  sell_class: useful
  gate_policy: null
  horizon:
    label: 3M-1Y
    min_m: 3
    max_m: 12
  data_sources:
  - CALC
  evidence_stars: 3
  prior_scale: 1.0
  evidence_tier: T1
  markets:
  - JP
  - US
  industries: null
  period_convention: GUIDE_CONS
  consolidation: consolidated
  accounting_standard_note: '予想の出所で別物になる。**GUIDE_CONS 版（コンセンサス）と GUIDE_CO 版（会社予想）を別 ID として持つべきだが、 現状は本 ID に GUIDE_CONS を割り当てている。日本の小型株はコンセンサスが存在しないため、 実質的には GUIDE_CO 版か K32（四季報予想）版が必要（未作成: OQ-22）。**'
  pit_lag_days: 0
  zero_denominator_policy: 過去8期のサプライズ標準偏差が 0 に近い（＝常に予想通り）銘柄では発散する。 分母に下限（株価の 0.5% 相当）を置く。8期分の履歴がない場合は欠損。
  missing_policy: flag
  missing_bias: '**欠損はランダムでない。** コンセンサスが存在しない日本の小型株（無カバー62%）で丸ごと欠損する。 これはユニバースの中核（O カテゴリ）と重なるため、GUIDE_CO 版の整備が実質的に必須。'
  normalization: rank_all
  nonlinear: null
  winsorize: null
  correlated_with:
  - N03
  - N04
  - N05
  - N06
  - N10
  - G18
  economic_rationale: 投資家は決算情報を過小評価し、時間をかけて修正する（アンカリングと調整）。日本市場でも確認されており、 **注目度が低いほどドリフトが長く強い**ため、N06（注目度調整PEAD）として O カテゴリと交互作用させる価値が高い。
  references:
  - https://www2.econ.osaka-u.ac.jp/econ_society/dp/2125.pdf
  - https://www.jstage.jst.go.jp/article/jbef/3/0/3_0_1/_pdf/-char/ja
  - https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf
  notes: PEADの中核。日本でも実証済。予想は会社予想 / コンセンサスを分けて2種類作る
