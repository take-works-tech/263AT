  missing_bias: '**記事が出ない銘柄が大量にある。しかもそれは 263AT の狙い目 （ネグレクト銘柄）そのもの。** → **中核ユニバースで最も欠損する。** さらに**同じ話が10媒体に載るので重複除去が必須**で、 除去しないと大手企業の記事量が過大になる。'
