- id: F01
  name_ja: 純株式発行率(1年)
  category: F
  category_name: 資本政策・希薄化
  subsection: null
  definition: 発行済株式数(t)/発行済株式数(t-1) - 1
  formula: SHARES[t] / SHARES[t-12m] - 1
  inputs:
  - SHARES
  sign: negative
  buy_class: main
  sell_class: main
  gate_policy: null
  horizon:
    label: 1Y-3Y
    min_m: 12
    max_m: 36
  data_sources:
  - FIN
  evidence_stars: 3
  prior_scale: 1.0
  evidence_tier: T1
  markets:
  - JP
  - US
  industries: null
  period_convention: POINT
  consolidation: na
  accounting_standard_note: na（株数は会計基準に依存しない）
  pit_lag_days: 0
  zero_denominator_policy: SHARES>0 なので割り算自体は問題ない。ただし**株式分割・併合の調整漏れがあると ±50% 等の異常値になる** （spec §9-4）。調整済み株数を使い、Z09 の異常値フラグで監視する。
  missing_policy: flag
  missing_bias: 上場後1年未満で欠損。IPO 直後の銘柄が抜ける（N24 と方向が一致するので実害は小さい）。
  normalization: rank_all
  nonlinear: null
  winsorize: null
  correlated_with:
  - F02
  - F03
  - F05
  - F06
  - F14
  economic_rationale: 経営陣は自社株が割高か割安かを最もよく知っている。割高なら発行し、割安なら買い戻す。 したがって株数の増加は「経営陣が割高と考えている」サイン。 **効果は発行側（悪材料）に大きく偏り、買戻し側は弱い**ため、符号を対称に扱うと過大評価になる。
  references:
  - https://www.sciencedirect.com/science/article/abs/pii/S0304405X09001007
  - https://www.acadian-asset.com/investment-insights/owenomics/firms-are-the-smart-money
  - https://www.federalreserve.gov/econres/feds/files/2021-037pap.pdf
  notes: 最重要。効果は「発行側（悪材料）」に大きく偏り、「買戻し側」は弱い。株式分割の調整を必ず行う
