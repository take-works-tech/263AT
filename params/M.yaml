  name_ja: アクティビスト標的スコア
  category: M
  category_name: 株主構成・ガバナンス
  subsection: null
  definition: z(低PBR) + z(ネットキャッシュ比率) + z(低ROE) + z(政策保有多) + 1[親子上場]
  formula: z(-A03) + z(A16) + z(-B01) + z(政策保有株比率) + 1[K18 親会社比率 50-90%]
  inputs:
  - A03
  - A16
  - B01
  - K17
  - K18
  sign: positive
