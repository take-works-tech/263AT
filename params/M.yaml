  industries: null
  period_convention: TTM
  consolidation: consolidated
  accounting_standard_note: 構成要素の会計基準差を継承。政策保有株の開示は日本固有。
  pit_lag_days: 0
  zero_denominator_policy: 構成要素が3つ未満しか計算できないなら欠損。
  missing_policy: flag
  missing_bias: 政策保有株比率は**日本の有報でのみ開示**されるので、米国では構成要素が1つ減る。 日米で中身が違う複合指標になる。
  normalization: rank_market
  nonlinear: null
  winsorize: null
  correlated_with:
  - A03
  - A16
  - B01
  - K17
  - K18
  - M08
  - M09
  - N13
  - N14
  economic_rationale: '**保有報告が出る「前」に先回りする。** M08/M09 は既に公表された事実なので、 その時点で価格は動いている。アクティビストが狙う条件 （低PBR・現金過多・低ROE・政策保有多・親子上場）を先に満たす銘柄を拾う。 東証の資本コスト要請（LAW-47）が同じ条件の企業に圧力をかけているので、 **アクティビストが来なくても企業自身が動く可能性がある**という二重の期待。

    **ただし DF-01 により検証できない。** 成功シナリオ（TOB・非公開化）で 廃止された銘柄は無料の株価データから消える（取得率 0/15）。 **バックテストすると勝ち筋だけが削除される**ので、この指標の有効性は 有料データを入れるまで測定不能。'
  references:
  - https://note.com/tatsuya_sabato/n/n035f8265adb9
  - https://www.nri.com/jp/media/column/osaki/20230509.html
  - https://corpgov.law.harvard.edu/2025/10/21/tokyo-stock-exchange-initiative-on-cost-of-capital-and-stock-price-conscious-management/
  - 合成仮説であり、この形での実証は無い。加えて DF-01 により検証手段が無い
  notes: 保有報告が出る「前」に先回りする。日本の中小型株で最も妙味がある設計
