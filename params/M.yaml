  zero_denominator_policy: na（ブール値）
  missing_policy: flag
  missing_bias: '**日本固有の制度。** 米国では 13D（経営関与目的）と 13G（純投資）の区別が対応するが、 粒度が違う。日本の「重要提案行為」は具体的な行為類型が列挙されており、より明確。 **markets を JP に限定し、米国は K48（13D/G）で扱う。**'
  normalization: rank_market
  nonlinear: null
  winsorize: null
  correlated_with:
  - M08
  - M10
  - M11
  - M24
  - K48
  economic_rationale: '**通常の投資目的より遥かに強いシグナル。** 「重要提案行為」を記載すると 保有報告の特例（機関投資家の簡易報告）が使えなくなるため、 **記載するのは本気で経営に介入する意思がある場合に限られる。** 制度設計上、コストを払ってでも意思表示しているという点で情報量が高い。'
  references:
  - https://www.nri.com/jp/media/column/osaki/20230509.html
  - https://www.businesslawyers.jp/articles/1536
  - 金融商品取引法 第27条の23（大量保有報告制度）
  notes: 通常の投資目的より遥かに強いシグナル。2024年で133件、前年比+55%
